<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天奇金泰阁 - 回收率指标</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F4F7FB;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }

        .ppt-card {
            width: 1200px;
            max-width: 95vw;
            background-color: #FFFFFF;
            border-radius: 24px;
            padding: 40px 30px 30px 30px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08), 0 8px 20px rgba(0, 0, 0, 0.02);
            transition: all 0.2s;
        }

        .main-title {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #1A2A3A;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }
        .main-title span {
            background: linear-gradient(135deg, #1A2A3A 0%, #3A5A7A 100%);
            padding: 0 20px;
            color: #fff;
            display: inline-block;
            line-height: 1.6;
            border-radius: 40px;
            padding: 0 30px;
            background: #1A2A3A;
        }

        .sub-desc {
            text-align: center;
            color: #8899AA;
            font-size: 14px;
            margin-bottom: 30px;
            letter-spacing: 1px;
            border-bottom: 2px dashed #EEF2F6;
            padding-bottom: 15px;
        }

        .charts-wrapper {
            display: flex;
            justify-content: space-around;
            align-items: stretch;
            gap: 20px;
            margin: 15px 0 20px 0;
        }

        .chart-item {
            flex: 1;
            height: 320px;
            min-width: 0;
            background: #FAFCFE;
            border-radius: 16px;
            padding: 10px 5px 5px 5px;
            transition: transform 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.02);
        }

        .chart-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.03);
        }

        .footer-source {
            text-align: right;
            font-size: 13px;
            color: #AAB8C9;
            border-top: 1px solid #F0F2F5;
            padding-top: 18px;
            margin-top: 5px;
            letter-spacing: 0.5px;
        }
        .footer-source strong {
            color: #7A8A9E;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .ppt-card {
                padding: 20px 10px;
            }
            .charts-wrapper {
                flex-direction: column;
                align-items: center;
            }
            .chart-item {
                width: 100%;
                height: 280px;
            }
            .main-title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="ppt-card">
        <div class="main-title">
            <span>核心工艺指标：全元素高回收率</span>
        </div>
        <div class="sub-desc">
            ⚡ 湿法冶金核心技术 · 行业领先水平
        </div>

        <div class="charts-wrapper">
            <div id="chart1" class="chart-item"></div>
            <div id="chart2" class="chart-item"></div>
            <div id="chart3" class="chart-item"></div>
        </div>

        <div class="footer-source">
            <strong>数据来源：</strong> 公司公告及公开资料整理
        </div>
    </div>

    <script>
        (function() {
            const chart1Dom = document.getElementById('chart1');
            const chart2Dom = document.getElementById('chart2');
            const chart3Dom = document.getElementById('chart3');

            function createRingOption(percent, centerText, subText, color, isRange = false) {
                const rest = 100 - percent;
                const displayPercent = isRange ? 99 : percent;
                const mainColor = color;
                const trackColor = '#F0F2F5';

                return {
                    series: [{
                        type: 'pie',
                        radius: ['68%', '85%'],
                        avoidLabelOverlap: false,
                        itemStyle: {
                            borderRadius: 10,
                            borderColor: '#fff',
                            borderWidth: 0
                        },
                        label: {
                            show: true,
                            position: 'center',
                            formatter: function(params) {
                                if (params.seriesIndex === 0 && params.dataIndex === 0) {
                                    return ['{a|' + centerText + '}', '{b|' + subText + '}'].join('\n');
                                }
                                return '';
                            },
                            rich: {
                                a: {
                                    fontSize: 32,
                                    fontWeight: 'bold',
                                    color: mainColor,
                                    lineHeight: 48,
                                    textShadow: '0 2px 4px rgba(0,0,0,0.02)'
                                },
                                b: {
                                    fontSize: 15,
                                    color: '#6B7A8F',
                                    lineHeight: 28,
                                    fontWeight: 400,
                                    letterSpacing: 1
                                }
                            },
                            fontSize: 14,
                            fontWeight: 'normal',
                            color: '#333'
                        },
                        emphasis: {
                            scale: false,
                            label: {
                                show: true
                            }
                        },
                        data: [
                            { value: displayPercent, name: '回收率', itemStyle: { color: mainColor } },
                            { value: rest, name: '剩余', itemStyle: { color: trackColor, borderWidth: 0 } }
                        ],
                        animationDuration: 1500,
                        animationEasing: 'cubicOut',
                        labelLine: { show: false },
                        startAngle: 90,
                        clockwise: true
                    }],
                    legend: { show: false },
                    tooltip: { show: false },
                    grid: { containLabel: false }
                };
            }

            if (chart1Dom) {
                const chart1 = echarts.init(chart1Dom);
                chart1.setOption(createRingOption(99, '98-99%', '钴 & 镍', '#2B7EC1', true));
                window.addEventListener('resize', () => chart1.resize());
            }

            if (chart2Dom) {
                const chart2 = echarts.init(chart2Dom);
                chart2.setOption(createRingOption(90, '90%', '锂', '#F5A623', false));
                window.addEventListener('resize', () => chart2.resize());
            }

            if (chart3Dom) {
                const chart3 = echarts.init(chart3Dom);
                chart3.setOption(createRingOption(95, '95%', '磷酸铁', '#2ECC71', false));
                window.addEventListener('resize', () => chart3.resize());
            }
        })();
    </script>

</body>
</html>
