    <script>
    (function(){
      // Read __dept from URL ONLY - no sessionStorage, no ADMIN_DEPT fallback
      var m=location.search.match(/[?&]__dept=([^&]+)/);
      var _dept=m?decodeURIComponent(m[1]):'';
      console.log('[analysis_hub] dept=',_dept);

      var BU_DEPT={
        hq:  ['od-8ad5942df92ef45ac8905b543fc38d2b','7593161552124923083'],
        czly:['od-c8c5bc8612d60825208196a97cd0686d'],
        lpsd:['od-349632b3f04edaa205990f6c96e66c26','od-c36a380b50b52171d47b7a8f5c1f3a70'],
        sdmd:['od-05e668aea865f92b574f366b3d976094'],
        sjl: ['od-310bdafba6cb5bdbd3300cf326878caa'],
        felt:['od-2e6cc0918fbe3086ebf636680997a2f2'],
        dhx: ['od-7a313bc06887dc30349237cb0d64ce83'],
        lhy: ['od-280342e9ed0ad39d203d5462b337451c'],
        kls: ['od-c90e5fd524dfde6467bd59b867cfed8c'],
        bych:['od-33054981612c6dc0fbbdfbb743774d1b'],
      };
      function isAllowed(buId){
        if(!_dept)return false;
        if(BU_DEPT.hq.indexOf(_dept)>=0)return true;
        var arr=BU_DEPT[buId];
        if(arr&&arr.indexOf(_dept)>=0)return true;
        return false;
      }

      // Inject no-auth style
      if(!document.getElementById('__bu_css')){
        var s=document.createElement('style');s.id='__bu_css';
        s.textContent='.no-auth-card{cursor:not-allowed!important;opacity:.4!important;pointer-events:none!important}';
        document.head.appendChild(s);
      }

      // Patch all .html navigation to include __dept
      function ap(u){
        if(!u||!_dept)return u;
        var b=u.split('#')[0];var h=u.indexOf('#')>=0?u.slice(u.indexOf('#')):'';
        var s=b.indexOf('?')>=0?'&':'?';
        return b+s+'__dept='+encodeURIComponent(_dept)+h;
      }
      document.addEventListener('click',function(e){
        var a=e.target.closest('a[href$=".html"]');
        if(a){if(a.host&&a.host!==location.host)return;e.preventDefault();window.location.href=ap(a.getAttribute('href'));return;}
        var el=e.target.closest('[onclick]');
        if(!el)return;
        var oc=el.getAttribute('onclick')||'';
        var m2=oc.match(/location\.href\s*=\s*['"]([^'"]+\.html)/);
        if(m2){e.preventDefault();window.location.href=ap(m2[1]);return;}
        var m3=oc.match(/__goto\s*\(\s*['"]([^'"]+\.html)/);
        if(m3){e.preventDefault();window.location.href=ap(m3[1]);return;}
      });

      // __goto passes dept to ALL pages
      window.__goto=function(url){
        if(!url)return;
        var s=url.indexOf('?')>-1?'&':'?';
        window.location.href=url+s+'__dept='+encodeURIComponent(_dept);
      };
    })();
    </script>

function buildReportCard(db) {
    const badge = db.done
        ? '<span class="card-badge done">✅ 已完成</span>'
        : '<span class="card-badge building">🚧 建设中</span>';

    const overlay = db.done ? '' : '<div class="building-overlay">🚧 报告编写中</div>';

    // Build report button(s)
    let reportBtns = '';
    if (db.done) {
        if (db.availableMonths && db.availableMonths.length > 0) {
            // Multi-month: show split button with month selector
            const latest = db.availableMonths[0]; // sorted newest first
            const monthLabel = latest.replace('-', '年') + '月';
            // 电解液用 felt_report_202605 格式（无下划线），其他数据库用 lfp_report_2026_04 格式（有下划线）
            const buildHref = (m) => db.reportBase + '_' + (db.id === 'electrolyte' ? m.replace('-', '') : m.replace('-', '_')) + '.html';
            const latestHref = buildHref(latest);

            // Build month options
            const monthOptions = db.availableMonths.map(m => {
                const label = m.replace('-', '年') + '月';
                const href = buildHref(m);
                const selected = m === latest ? ' selected' : '';
                return `<option value="${href}"${selected}>${label}</option>`;
            }).join('');

            reportBtns = `
                <a href="${latestHref}" class="btn-report" id="btn-report-${db.id}"> 查看报告（${monthLabel}）</a>
                <select class="btn-month" id="sel-month-${db.id}"
                    onchange="var b=document.getElementById('btn-report-${db.id}');b.href=this.value;b.innerHTML=' 查看报告（'+this.options[this.selectedIndex].text+'）';"
                    title="选择报告月份">
                    ${monthOptions}
                </select>`;
        } else if (db.reportHref) {
            // Single report: simple button
            reportBtns = `<a href="${db.reportHref}" class="btn-report" style="border-radius:8px;"> 查看报告</a>`;
        }
    } else {
        reportBtns = `<a href="#" class="btn-report disabled" onclick="return false;" style="border-radius:8px;"> 查看报告</a>`;
    }

    return `
    <div class="db-card" data-db="${db.id}">
        ${overlay}
        <div class="card-top">
            <div class="card-icon-wrap">${db.icon}</div>
            ${badge}
        </div>
        <div class="card-name">${db.name}</div>
        <div class="card-desc">${db.desc}</div>
        <div class="card-meta">
            <div class="meta-item">
                <div class="meta-val">${db.tabs}</div>
                <div class="meta-label">报告结构</div>
            </div>
            <div class="meta-item">
                <div class="meta-val">${db.charts}</div>
                <div class="meta-label">数据图表</div>
            </div>
        </div>
        <div class="card-actions">
            ${reportBtns}
        </div>
    </div>`;
}

      if(m&&!isAllowed(m))el.classList.add('no-auth-card');
    });
    document.querySelectorAll('[data-bu]').forEach(function(el){
      var b=(el.getAttribute('data-bu')||'').toLowerCase();
      if(b&&!isAllowed(b))el.classList.add('no-auth-card');
    });
  }
  gateCards();
  if(window.MutationObserver){
    var to;
    new MutationObserver(function(){
      clearTimeout(to);to=setTimeout(gateCards,200);
    }).observe(document.body,{childList:true,subtree:true});
  }
  console.log('[BU gate] ready');
})();
