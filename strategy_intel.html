                <div class="scope-switch" id="scopeSwitch" role="tablist" aria-label="时间范围切换">
                    <button type="button" data-scope="week" class="active">最近 7 天</button>
                    <button type="button" data-scope="month">最近 30 天</button>
                    <button type="button" data-scope="all">全部</button>
                </div>
            </div>
            <div class="heatmap-card">
                <table class="heatmap-table" id="heatmapTable"></table>
                <div class="heatmap-legend" id="heatmapLegend">
                    <div class="lg"><span class="sw" style="background:#f0f0f0"></span>0</div>
                    <div class="lg"><span class="sw" style="background:#c8e6c9"></span>1-2</div>
                    <div class="lg"><span class="sw" style="background:#66bb6a"></span>3-9</div>
                    <div class="lg"><span class="sw" style="background:#2e7d32"></span>10+</div>
                </div>
            </div>
        </div>
    </div>

    <!-- BU × 头部竞品 矩阵 -->
    <div class="section-title" style="margin-top:8px">
        <span>BU × 头部竞品 监控矩阵</span>
        <span class="count" id="matrixMeta"></span>
    </div>
    <div class="matrix-card">
        <table class="matrix-table" id="matrixTable">
            <thead>
                <tr>
                    <th style="width:90px">BU</th>
                    <th>头部竞品（4家）</th>
                    <th style="width:100px" id="matrixPeriodHead">本周事件</th>
                    <th style="width:90px">高重要度</th>
                    <th style="width:120px">上次更新</th>
                    <th style="width:80px">操作</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

</div>

<!-- TOP5 详情浮层：看完整摘要 -->
<div class="t5-modal" id="t5Modal" hidden>
    <div class="t5-mask" data-t5close="1"></div>
    <div class="t5-box" role="dialog" aria-modal="true" aria-label="重点事件详情">
        <button class="t5-x" type="button" data-t5close="1" aria-label="关闭">✕</button>
        <div id="t5ModalBody"></div>
    </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════
   集团竞品情报监控页 — 数据全部来自 strategy_intel_feed.json
   （由 tools/build_strategy_intel_feed.py 聚合 9 份
    competitor_feed_<bu>.json 生成，可定时重跑）
   ═══════════════════════════════════════════════════════ */
const BU_META = {
    czly:{name:'常州锂源',short:'LFP',color:'#064e3b'},
    lpsd:{name:'龙蟠时代',short:'Li₂CO₃',color:'#2e75b6'},
    felt:{name:'法恩莱特',short:'电解液',color:'#7b2d8b'},
    sdmd:{name:'山东美多',short:'回收',color:'#215732'},
    sjl: {name:'三金锂电',short:'三元',color:'#34495e'},
    dhx: {name:'迪克化学',short:'汽化品',color:'#16a085'},
    lhy: {name:'润滑油事业部',short:'润滑油',color:'#c0392b'},
    kls: {name:'可兰素',short:'车用尿素',color:'#d35400'},
    bych:{name:'铂源催化',short:'氢催化',color:'#8e44ad'}
};

// 36 家头部竞品
const COMPETITOR_LIST = {
    czly: ['湖南裕能', '万润新能', '富临精工', '德方纳米'],
    lpsd: ['赣锋锂业', '天齐锂业', '雅化集团', '永兴材料'],
    felt: ['天赐材料', '多氟多', '新宙邦', '永太科技'],
    sdmd: ['格林美', '华友钴业', '邦普循环', '赣州豪鹏'],
    sjl:  ['容百科技', '当升科技', '振华新材', '长远锂科'],
    dhx:  ['中触媒', '尤夫股份', '隆众化学', '明水化工'],
    lhy:  ['昆仑润滑油', '长城润滑油', '统一石化', '康普顿'],
    kls:  ['美丰化工', '四川美丰', '禾泰车用尿素', '龙蟠车用'],
    bych: ['贵研铂业', '北方稀土', '凯立新材', '中触媒氢能']
};

/* ═══════════════════════════════════════════════════════
   渲染逻辑
   ═══════════════════════════════════════════════════════ */
// 热力图类别轴 = 竞品 feed 的真实 category（2026-09-27 修正：原为 mock 的 业绩/扩产/客户/战略/新品/合规，
// 与源数据完全不匹配导致全部塌陷到「战略」）。运行时会用 feed.category_list 覆盖此常量。
const CATEGORY_LIST = ['今日关注', '企业动态', '项目/招标', '技术/产品', '公告/披露'];
const $ = id => document.getElementById(id);
const escapeHtml = s => String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 初始化 BU 下拉
(function initBuSelect(){
    const sel = $('fBu');
    Object.entries(BU_META).forEach(([id, m]) => {
        const opt = document.createElement('option');
        opt.value = id; opt.textContent = m.name;
        sel.appendChild(opt);
    });
})();

// 事件流渲染
function renderEvents(){
    const kw = $('fKw').value.trim().toLowerCase();
    const fBu = $('fBu').value;
    const fCat = $('fCat').value;
    const fImp = $('fImp').value;
    const fTime = $('fTime').value;

    let list = FEED.events.slice();

    // 时间筛选
    if (fTime === 'week') {
        const now = parseDate(FEED.latest_report_date) || new Date();
        const weekAgo = new Date(now); weekAgo.setDate(now.getDate() - 7);
        list = list.filter(e => {
            const d = parseDate(e.report_date || e.date);
            return d && d >= weekAgo;
        });
    } else if (fTime === 'month') {
        const now = parseDate(FEED.latest_report_date) || new Date();
        const monthAgo = new Date(now); monthAgo.setMonth(now.getMonth() - 1);
        list = list.filter(e => {
            const d = parseDate(e.report_date || e.date);
            return d && d >= monthAgo;
        });
    }

    if (fBu) list = list.filter(e => e.bu === fBu);
    if (fCat) list = list.filter(e => e.category === fCat);
    if (fImp) list = list.filter(e => e.importance === fImp);
    if (kw) list = list.filter(e =>
        (e.title||'').toLowerCase().includes(kw) ||
        (e.competitor||'').toLowerCase().includes(kw) ||
        (e.summary||'').toLowerCase().includes(kw)
    );

    // 排序：高→中→低 → 日期倒序
    const impOrder = {high:0, medium:1, low:2};
    list.sort((a,b)=>{
        if (impOrder[a.importance] !== impOrder[b.importance]) return impOrder[a.importance] - impOrder[b.importance];
        const ad = parseDate(a.report_date || a.date) || 0;
        const bd = parseDate(b.report_date || b.date) || 0;
        return bd - ad;
    });

    const listEl = $('eventList');
    // 把当前筛选后列表暴露给详情浮层，避免在 HTML 属性里塞整个对象
    EVENT_STREAM_DATA = list;
    if (!list.length) {
        listEl.innerHTML = '<div class="event-empty">📭 当前筛选条件下无事件<br><br>试试调整筛选条件</div>';
    } else {
        listEl.innerHTML = list.map((e, idx) => {
            const meta = BU_META[e.bu] || {name:e.bu, color:'#666'};
            const link = e.source_url
                ? ` · <a href="${escapeHtml(e.source_url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看原文 →</a>`
                : (e.source_kind === 'main' ? '' : ' · <span style="color:#9aa0a6">无原文</span>');
            return `
<div class="event-card ${e.importance}" onclick="openEventDetail(${idx})">
    <div class="event-head">
        <div class="event-tags">
            <span class="tag importance-${e.importance}">${e.importance === 'high' ? '高' : e.importance === 'medium' ? '中' : '低'}</span>
            <span class="tag category">${escapeHtml(e.category)}</span>
            <span class="tag bu">${escapeHtml(meta.name)} · ${escapeHtml(e.competitor || '—')}</span>
        </div>
        <span class="event-date">${e.date || e.report_date}</span>
    </div>
    <div class="event-title">${escapeHtml(e.title)}</div>
    <div class="event-summary">${escapeHtml(e.summary)}</div>
    <div class="event-footer">
        <span class="event-source">📄 ${escapeHtml(e.source)} · ${e.date || e.report_date}${link}</span>
    </div>
</div>`;
        }).join('');
    }

    $('eventCount').textContent = list.length + ' 条';
}

// 事件流卡片点击：打开与 TOP5 同款的详情浮层
function openEventDetail(idx){
    const e = EVENT_STREAM_DATA[idx];
    if (!e) return;
    openTop5Detail(e);
}

// 热力图渲染
function scopeFilteredEvents(){
    if (currentScope === 'all') return FEED.events;
    const days = currentScope === 'week' ? 7 : 30;
    const now = parseDate(FEED.latest_report_date) || new Date();
    const ago = new Date(now); ago.setDate(now.getDate() - days);
    return FEED.events.filter(e => {
        const d = parseDate(e.report_date || e.date);
        return d && d >= ago;
    });
}

function renderHeatmap(){
    const tbl = $('heatmapTable');
    const pool = scopeFilteredEvents();
    const grid = {};
    Object.keys(BU_META).forEach(bu => {
        grid[bu] = {};
        CATEGORY_LIST.forEach(cat => grid[bu][cat] = 0);
    });
    pool.forEach(e => {
        if (grid[e.bu] && grid[e.bu][e.category] !== undefined) grid[e.bu][e.category]++;
    });

    // 自适应分级：三档窗口（7天/30天/全部）数量级差异极大（最大单格 22 / 74 / 313），
    // 固定阈值会让大窗口全深、小窗口全浅。改为按当前视图最大单格值折算。
    let maxV = 0;
    Object.keys(BU_META).forEach(bu => CATEGORY_LIST.forEach(cat => {
        if (grid[bu][cat] > maxV) maxV = grid[bu][cat];
    }));
    const t3 = Math.max(3, Math.ceil(maxV * 0.60));   // 深
    const t2 = Math.max(2, Math.ceil(maxV * 0.28));   // 中
    if (t2 >= t3) { /* 数据量极小时保证 t2 < t3 */ }

    let html = '<thead><tr><th class="bu-label">BU \\ 类别</th>';
    CATEGORY_LIST.forEach(c => html += `<th>${escapeHtml(c)}</th>`);
    html += '</tr></thead><tbody>';
    Object.entries(BU_META).forEach(([id, m]) => {
        html += `<tr><td class="bu-label" style="color:${m.color}">${escapeHtml(m.name)}</td>`;
        CATEGORY_LIST.forEach(cat => {
            const v = grid[id][cat];
            const lv = v >= t3 ? 'lv3' : v >= t2 ? 'lv2' : v >= 1 ? 'lv1' : 'lv0';
            html += `<td class="heatmap-cell ${lv}" onclick="filterByBuCat('${id}','${cat}')" title="${escapeHtml(m.name)} · ${escapeHtml(cat)} (${v}条)">${v}</td>`;
        });
        html += '</tr>';
    });
    html += '</tbody>';
    tbl.innerHTML = html;

    // 图例随阈值同步刷新（否则深浅与数字对不上）
    const lg = $('heatmapLegend');
    if (lg) {
        const mid = Math.max(t2, 1);
        const hi = Math.max(t3, mid + 1);
        lg.innerHTML =
            `<div class="lg"><span class="sw" style="background:#f0f0f0"></span>0</div>` +
            `<div class="lg"><span class="sw" style="background:#c8e6c9"></span>${maxV ? `1-${mid - 1}` : '—'}</div>` +
            `<div class="lg"><span class="sw" style="background:#66bb6a"></span>${maxV ? `${mid}-${hi - 1}` : '—'}</div>` +
            `<div class="lg"><span class="sw" style="background:#2e7d32"></span>${maxV ? `${hi}+` : '—'}</div>`;
    }
}

// 热力图点击联动
function filterByBuCat(bu, cat){
    $('fBu').value = bu;
    $('fCat').value = cat;
    renderEvents();
    document.querySelector('.event-list').scrollTop = 0;
    window.scrollTo({top:document.querySelector('.event-list').offsetTop - 100, behavior:'smooth'});
}

// BU × 头部竞品 矩阵渲染
function renderMatrix(){
    const tbody = document.querySelector('#matrixTable tbody');
    const now = parseDate(FEED.latest_report_date) || new Date();
    const days = currentScope === 'week' ? 7 : currentScope === 'month' ? 30 : 36500;
    const ago = new Date(now); ago.setDate(now.getDate() - days);

    let html = '';
    Object.entries(BU_META).forEach(([id, m]) => {
        const evts = FEED.events.filter(e => e.bu === id);
        const scopeEvts = evts.filter(e => {
            const d = parseDate(e.report_date || e.date);
            return d && d >= ago;
        });
        const highEvts = scopeEvts.filter(e => e.importance === 'high').length;
        const lastUpdate = evts.length
            ? evts.map(e => e.report_date || e.date).sort().reverse()[0]
            : '--';
        const comps = COMPETITOR_LIST[id] || [];

        html += `<tr>
            <td>
                <div class="bu-name-cell">
                    <span class="bu-dot" style="background:${m.color}"></span>
                    <span style="font-weight:600;color:${m.color}">${escapeHtml(m.name)}</span>
                </div>
                <div style="font-size:11px;color:#888;margin-top:2px;padding-left:18px">${escapeHtml(m.short)}</div>
            </td>
            <td><div class="comp-list">${comps.map(c=>escapeHtml(c)).join(' · ')}</div></td>
            <td><span class="event-count-badge ${scopeEvts.length===0?'zero':''}"><span class="num">${scopeEvts.length}</span> 条</span></td>
            <td>${highEvts > 0 ? `<span class="high-pill">${highEvts} 条</span>` : '<span style="color:#aaa">—</span>'}</td>
            <td><span class="last-update">${lastUpdate}</span></td>
            <td><a href="#" onclick="event.preventDefault();$('fBu').value='${id}';renderEvents();window.scrollTo({top:0,behavior:'smooth'});" style="color:#064e3b;font-weight:600;text-decoration:none;font-size:12px">查看 →</a></td>
        </tr>`;
    });
    tbody.innerHTML = html;

    // 矩阵右侧 meta 已下线（保留空占位 span #matrixMeta，仅供后续如需回填使用）
    const labelMap = { week: '最近 7 天', month: '最近 30 天', all: '全部时间' };
    // 表头随口径变化（不能一直写「本周事件」）
    const head = $('matrixPeriodHead');
    if (head) head.textContent = labelMap[currentScope] + '事件';
}

// 顶部 meta 已下线（顶部右侧文案移除，函数保留为幂等空实现，避免外部调用报错）
function renderTopbar(){
    // 注：顶部统计卡（本周事件总数/高重要度/BU 覆盖/竞品覆盖/本周增量）已下线，
    // 该位置改为「TOP 5 重点」卡片墙（见 renderTop5）；页面副标题与其他装饰性口径
    // 文案已按需求移除，事件规模由事件流标题承载。

    // 仍保留必要的派生量，供下面的「数据更新」日期显示使用
    const total = FEED.events.length;
    const latest = FEED.latest_report_date || '--';
    const peers = new Set();
    FEED.events.forEach(e => (e.peers || []).forEach(p => peers.add(p)));

    // 页面头部「数据更新」从 feed 自动算
    const pageDataUpdate = $('pageDataUpdate');
    if (pageDataUpdate && latest !== '--') {
        pageDataUpdate.textContent = `${latest} 周报`;
    }
}

// 当前视图范围：week=7d / month=30d / all=全部
let currentScope = 'week';

// 类别权重：产能/投资/招标类（对竞争格局影响最大）优先，其后依次为企业动态、
// 技术/产品、公告/披露、今日关注。权重只用于 TOP 排序，不改变源数据分类。
const CATEGORY_WEIGHT = { '项目/招标': 5, '企业动态': 4, '技术/产品': 3, '公告/披露': 2, '今日关注': 1 };
const SCOPE_LABEL = { week: '本周', month: '近 30 天', all: '全部' };

// 当前 TOP5 命中的事件（供详情浮层取全文）
let TOP5_PICKED = [];
// 当前事件流筛选结果（供详情浮层按索引取事件）
let EVENT_STREAM_DATA = [];

// 「TOP 5 重点」：跟随当前口径（本周/近 30 天/全部）× 仅高重要度
//   选条策略：① 类别权重优先（产能/投资 > 企业动态 > 技术 > 公告）→ ② 日期新者优先
//   去重约束：同一 BU 最多 1 条、同一类别最多 2 条 → 保证 5 张卡覆盖不同事业部、
//   不会整排都是「项目/招标」；池子不足 5 条时自动放宽约束补位。
function renderTop5(){
    const row = $('top5Row');
    if (!row) return;

    const winLabel = SCOPE_LABEL[currentScope] || '本周';
    const titleEl = $('top5Title');
    if (titleEl) titleEl.textContent = `${winLabel} TOP 5 重点`;

    const pool = scopeFilteredEvents().filter(e => e.importance === 'high');
    pool.sort((a, b) => {
        const wa = CATEGORY_WEIGHT[a.category] || 0;
        const wb = CATEGORY_WEIGHT[b.category] || 0;
        if (wa !== wb) return wb - wa;
        const ad = parseDate(a.date || a.report_date);
        const bd = parseDate(b.date || b.report_date);
        return (bd ? bd.getTime() : 0) - (ad ? ad.getTime() : 0);
    });

    const seenBu = new Set();
    const catCnt = {};
    const picked = [];
    for (const e of pool) {
        if (seenBu.has(e.bu)) continue;
        if ((catCnt[e.category] || 0) >= 2) continue;
        seenBu.add(e.bu);
        catCnt[e.category] = (catCnt[e.category] || 0) + 1;
        picked.push(e);
        if (picked.length === 5) break;
    }
    // 兜底：BU/类别约束下不足 5 条时，放宽约束按排序补足
    if (picked.length < 5) {
        for (const e of pool) {
            if (picked.indexOf(e) !== -1) continue;
            picked.push(e);
            if (picked.length === 5) break;
        }
    }

    const metaEl = $('top5Meta');
    if (metaEl) {
        metaEl.textContent = `${winLabel}高优 ${pool.length} 条 · 覆盖 ${seenBu.size} 个 BU · 全池 ${FEED.events.length} 条`;
    }

    if (!picked.length) {
        row.innerHTML = '<div class="top5-empty">当前口径下暂无高重要度事件</div>';
        return;
    }

    row.innerHTML = picked.map((e, i) => {
        const meta = BU_META[e.bu] || { name: e.bu };
        const d = parseDate(e.date || e.report_date);
        const ds = d ? `${d.getMonth() + 1}/${d.getDate()}` : '—';
        // 源数据里 competitor 可能是占位符 'bu'（该条来自 BU 周报的行业段，非单一竞品）
        const compRaw = String(e.competitor == null ? '' : e.competitor).trim();
        const comp = /^(bu|—|-|无)$/i.test(compRaw) ? '' : compRaw;
        const summary = String(e.summary || '').trim();
        return `<div class="top5-card r${i + 1}" data-idx="${i}" role="button" tabindex="0"
     title="点击查看完整摘要">
    <div class="t5-head">
        <span class="t5-rank">${i + 1}</span>
        <span class="t5-cat">${escapeHtml(e.category)}</span>
        <span class="t5-date">${ds}</span>
    </div>
    <div class="t5-title">${escapeHtml(e.title)}</div>
    ${summary ? `<div class="t5-summary">${escapeHtml(summary)}</div>` : ''}
    <div class="t5-foot">
        <span class="t5-bu">${escapeHtml(meta.name)}</span>
        ${comp ? `<span class="t5-comp">${escapeHtml(comp)}</span>` : ''}
        <span class="t5-more">全文 ›</span>
    </div>
</div>`;
    }).join('');

    TOP5_PICKED = picked;
}

// 详情浮层：卡片摘要被 3 行截断，点卡片看完整标题+摘要+来源
// arg 可以是 TOP5 序号，也可以是事件对象（事件流直接传入）
function openTop5Detail(arg){
    let e, idx;
    if (arg && typeof arg === 'object') {
        e = arg;
        idx = null;
    } else {
        idx = arg;
        e = TOP5_PICKED[idx];
    }
    if (!e) return;
    const meta = BU_META[e.bu] || { name: e.bu };
    const modal = $('t5Modal');
    const body = $('t5ModalBody');
    if (!modal || !body) return;

    const dateStr = e.date || e.report_date || '—';
    const compRaw = String(e.competitor == null ? '' : e.competitor).trim();
    const comp = /^(bu|—|-|无)$/i.test(compRaw) ? '' : compRaw;
    const src = String(e.source || '').trim();
    const url = String(e.source_url || '').trim();
    const summary = String(e.summary || '').trim();
    const peers = (e.peers || []).filter(Boolean);

    body.innerHTML = `
<div class="t5m-tags">
    <span class="t5m-rank">${idx != null ? idx + 1 : '·'}</span>
    <span class="tag importance-high">高重要度</span>
    <span class="t5-cat">${escapeHtml(e.category)}</span>
    <span class="t5-bu">${escapeHtml(meta.name)}</span>
    ${comp ? `<span class="tag bu">竞品：${escapeHtml(comp)}</span>` : ''}
</div>
<div class="t5m-title">${escapeHtml(e.title)}</div>
<div class="t5m-summary">${summary ? escapeHtml(summary) : '（该条暂无摘要）'}</div>
<div class="t5m-foot">
    <span>📄 ${escapeHtml(src || '来源未标注')} · ${escapeHtml(String(dateStr))}${peers.length ? ' · 关联：' + escapeHtml(peers.join('、')) : ''}</span>
    ${url ? `<a href="${escapeHtml(url)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">查看原文 →</a>` : ''}
</div>`;

    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    const x = modal.querySelector('.t5-x');
    if (x) x.focus();
}

function closeTop5Detail(){
    const modal = $('t5Modal');
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    document.body.style.overflow = '';
}

// 浮层交互：点卡片打开、点遮罩/✕/Esc 关闭
document.addEventListener('click', ev => {
    const card = ev.target.closest && ev.target.closest('#top5Row .top5-card');
    if (card) { openTop5Detail(parseInt(card.getAttribute('data-idx'), 10) || 0); return; }
    const closer = ev.target.closest && ev.target.closest('[data-t5close]');
    if (closer) closeTop5Detail();
});
document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape') closeTop5Detail();
    // 键盘可达性：卡片聚焦后 Enter/Space 打开
    if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList &&
        ev.target.classList.contains('top5-card')) {
        ev.preventDefault();
        openTop5Detail(parseInt(ev.target.getAttribute('data-idx'), 10) || 0);
    }
});

// 日期解析（兼容 "2026-09-24"）
function parseDate(s){
    if(!s || typeof s !== 'string') return null;
    var d = new Date(s.replace(/-/g, '/'));
    return isNaN(d.getTime()) ? null : d;
}

// 事件绑定
['fBu','fCat','fImp','fTime','fKw'].forEach(id => {
    const el = $(id);
    el.addEventListener('input', renderEvents);
    el.addEventListener('change', () => {
        // 时间下拉与热力图/矩阵的分段控件保持同一口径
        if (id === 'fTime' && $('scopeSwitch')) {
            currentScope = el.value;
            document.querySelectorAll('#scopeSwitch button').forEach(b =>
                b.classList.toggle('active', b.getAttribute('data-scope') === currentScope));
            renderHeatmap();
            renderMatrix();
            renderTop5();
        }
        renderEvents();
    });
});
$('fReset').addEventListener('click', () => {
    ['fBu','fCat','fImp','fKw'].forEach(id => $(id).value = '');
    $('fTime').value = 'week';
    currentScope = 'week';
    document.querySelectorAll('#scopeSwitch button').forEach(b =>
        b.classList.toggle('active', b.getAttribute('data-scope') === 'week'));
    renderEvents();
    renderHeatmap();
    renderMatrix();
    renderTop5();
});

// 视图切换（热力图 + 矩阵 + TOP5 联动）
document.querySelectorAll('#scopeSwitch button').forEach(btn => {
    btn.addEventListener('click', () => {
        currentScope = btn.getAttribute('data-scope');
        document.querySelectorAll('#scopeSwitch button').forEach(b => b.classList.toggle('active', b === btn));
        // 与事件流的时间下拉统一口径（两者取值同为 week/month/all），避免同页两个时间轴打架
        const ft = $('fTime');
        if (ft && ft.value !== currentScope) { ft.value = currentScope; renderEvents(); }
        renderHeatmap();
        renderMatrix();
        renderTop5();
    });
});

// 数据加载（fetch 聚合后的 strategy_intel_feed.json）
let FEED = null;
function start(){
    if (!FEED) {
        document.body.insertAdjacentHTML('beforeend',
            '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:32px 40px;box-shadow:0 8px 30px rgba(0,0,0,.15);font-family:Microsoft YaHei;text-align:center;z-index:2147483647"><div style="font-size:32px">⚠️</div><div style="margin-top:12px;font-size:16px;font-weight:700">strategy_intel_feed.json 未加载</div><div style="margin-top:8px;font-size:12px;color:#888">请确认发布包完整，或重跑 tools/build_strategy_intel_feed.py</div></div>');
        return;
    }
    renderTopbar();
    renderEvents();
    renderHeatmap();
    renderMatrix();
    renderTop5();
}
fetch('strategy_intel_feed.json', { cache: 'no-store' })
    .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
    })
    .then(function(d){
        // 用 FEED.bu_meta / competitor_list / category_list 同步页内常量，
        // 这样以后改名字/颜色只需改 Python 脚本的 BU_META，HTML 不动
        if (d.bu_meta) {
            Object.keys(d.bu_meta).forEach(k => BU_META[k] = d.bu_meta[k]);
        }
        if (d.competitor_list) {
            Object.keys(d.competitor_list).forEach(k => COMPETITOR_LIST[k] = d.competitor_list[k]);
        }
        if (d.category_list && d.category_list.length) {
            // 替换 CATEGORY_LIST 内容（保持变量名）
            CATEGORY_LIST.length = 0;
            d.category_list.forEach(c => CATEGORY_LIST.push(c));
        }
        FEED = d;
        start();
    })
    .catch(function(err){
        console.error('[strategy_intel] feed fetch failed', err);
        document.body.insertAdjacentHTML('beforeend',
            '<div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;border-radius:12px;padding:32px 40px;box-shadow:0 8px 30px rgba(0,0,0,.15);font-family:Microsoft YaHei;text-align:center;z-index:2147483647;max-width:480px"><div style="font-size:32px">❌</div><div style="margin-top:12px;font-size:16px;font-weight:700">数据加载失败</div><div style="margin-top:8px;font-size:12px;color:#888">strategy_intel_feed.json 读取失败：' + escapeHtml(String(err.message || err)) + '<br><br>建议：<br>1) 确认 dist-miaoda-test/strategy_intel_feed.json 存在<br>2) 用 python -m http.server 启动，file:// 协议会被浏览器拦截 fetch<br>3) 重跑 <code>python tools/build_strategy_intel_feed.py</code></div></div>');
    });
</script>
