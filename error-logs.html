<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误日志</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f5f5f5; padding: 20px; }
        h1 { font-size: 18px; margin-bottom: 15px; color: #333; }
        .toolbar { margin-bottom: 15px; display: flex; gap: 10px; }
        button { padding: 6px 12px; border: 1px solid #ddd; border-radius: 4px; background: #fff; cursor: pointer; font-size: 13px; }
        button:hover { background: #f0f0f0; }
        #clearBtn { color: #f44336; border-color: #f44336; }
        #status { font-size: 13px; color: #666; margin-bottom: 10px; }
        .error-item { background: #fff; border-left: 3px solid #f44336; padding: 10px; margin-bottom: 8px; border-radius: 4px; font-size: 12px; }
        .error-item .time { color: #999; font-size: 11px; }
        .error-item .type { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 11px; margin-right: 6px; }
        .error-item .type.JavaScript错误 { background: #ffebee; color: #c62828; }
        .error-item .type.网络请求错误 { background: #fff3e0; color: #e65100; }
        .error-item .type.资源加载错误 { background: #e8f5e9; color: #2e7d32; }
        .error-item .type.图表渲染错误 { background: #e3f2fd; color: #1565c0; }
        .error-item .type.API调用错误 { background: #f3e5f5; color: #6a1b9a; }
        .error-item .msg { margin: 5px 0; color: #333; word-break: break-all; }
        .error-item .detail { color: #666; font-size: 11px; margin-top: 3px; }
        #empty { text-align: center; color: #999; padding: 40px; font-size: 14px; }
        #count { font-weight: bold; color: #f44336; }
    </style>
</head>
<body>
    <h1>📋 错误日志</h1>
    <div id="status">正在加载...</div>
    <div class="toolbar">
        <button onclick="loadLogs()">🔄 刷新</button>
        <button onclick="exportLogs()">📥 导出</button>
        <button id="clearBtn" onclick="clearLogs()">🗑️ 清空</button>
    </div>
    <div id="logs"></div>

    <script>
        function loadLogs() {
            const logs = [];
            try {
                const data = localStorage.getItem('homepage_error_logs');
                if (data) logs.push(...JSON.parse(data));
            } catch(e) {}
            
            const status = document.getElementById('status');
            const container = document.getElementById('logs');
            
            status.innerHTML = `共记录 <span id="count">${logs.length}</span> 条错误`;
            
            if (logs.length === 0) {
                container.innerHTML = '<div id="empty">✅ 暂无错误记录<br><br>当首页发生错误时，会自动记录到这里</div>';
                return;
            }
            
            container.innerHTML = logs.reverse().map((e, i) => `
                <div class="error-item">
                    <div class="time">${new Date(e.timestamp).toLocaleString('zh-CN')}</div>
                    <div style="margin-top:5px">
                        <span class="type ${e.type}">${e.type}</span>
                        <span style="font-size:11px;color:#999">${e.url || ''}</span>
                    </div>
                    <div class="msg">${e.message}</div>
                    ${e.detail ? `<div class="detail">${e.detail}</div>` : ''}
                </div>
            `).join('');
        }
        
        function clearLogs() {
            if (!confirm('确定清空所有错误记录？')) return;
            localStorage.removeItem('homepage_error_logs');
            loadLogs();
        }
        
        function exportLogs() {
            const logs = JSON.parse(localStorage.getItem('homepage_error_logs') || '[]');
            const blob = new Blob([JSON.stringify(logs, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `错误日志_${new Date().toLocaleDateString('zh-CN')}.json`;
            a.click();
        }
        
        loadLogs();
        // 自动刷新（如果打开了首页，错误会实时写入）
        setInterval(loadLogs, 5000);
    </script>
</body>
</html>
