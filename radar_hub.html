  var RADAR_GATE_SHADOW = true;

  // 用途：让作者本人一眼看到「妙搭壳到底回传了什么 ID」——这是决定白名单是否有效的唯一关键信息。
  // 对普通访问者零影响（不带参数时不创建任何节点）。
  function esc1(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
  function radarProbeBadge(uid, deptIds, allowed){

      }

    }catch(_){}

  function decide(uid, deptIds){
    // 已放行则保持（幂等）
    if(window.RADAR_UID_DECIDED && window.RADAR_UID_ALLOWED) return;
    var deptOk = Array.isArray(deptIds) && deptIds.some(function(d){return RADAR_DEPT_WHITELIST.indexOf(d)>=0;});

    if(window.RADAR_UID_DECIDED && !window.RADAR_UID_ALLOWED && allowed){
      window.RADAR_UID_ALLOWED = true;
      document.documentElement.style.visibility='';
      clearDeny();
      radarProbeBadge(uid, deptIds, true);

    window.RADAR_UID_ALLOWED = allowed;
    document.documentElement.style.visibility='';
    if(!window.RADAR_UID_ALLOWED) radarGateDeny(uid, deptIds);

  // document.documentElement.style.visibility='hidden';
  var s=(window.userInfo&&(window.userInfo.user_id||window.userInfo.open_id))||window.userId||(window.__context&&window.__context.user&&window.__context.user.open_id)||'';

      }
    }
  },1500);
})();

// ─────────────────────────────────────────────
// 渲染卡片 HTML（雷达图容器使用真实 ECharts div）
// ─────────────────────────────────────────────
function buildCard(buId, meta) {
    // 多月份BU：取当前选中月份的数据；单月份BU：从BU_HISTORY取最新月份
    var history = BU_HISTORY[buId];
    if (history) {
        var months = Object.keys(history).sort();
        if (!currentCardMonth[buId]) currentCardMonth[buId] = months[months.length - 1];
    }
    var activeMonth = currentCardMonth[buId];
    var dims = history && history[activeMonth]
        ? history[activeMonth]
        : (BU_HISTORY[buId] ? (function() {
            var allMonths = Object.keys(BU_HISTORY[buId]).sort();
            return BU_HISTORY[buId][allMonths[allMonths.length - 1]];
          })() : { d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0 });
    var score = getScore(buId, dims);
    var logo = BU_LOGOS[buId] || '';
    var logoHTML = logo
        ? '<img class="dept-logo" src="' + logo + '" alt="' + meta.name + '" onerror="this.style.display=\'none\'">'
        : '<div class="dept-logo" style="background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:20px;"></div>';

    var currentBadge = BU_IS_CURRENT[buId]
        ? '<span class="dept-current-badge">★当月</span>'
        : '';

    // 多月份切换按钮
    var monthToggle = '';
    if (history) {
        var months = Object.keys(history).sort();
        monthToggle = '<div class="dept-month-toggle">' +
            months.map(function(m) {
                var label = m.replace('2026-', '');
                var isActive = (m === activeMonth);
                return '<span class="month-btn' + (isActive ? ' active' : '') + '" ' +
                    'style="' + (isActive ? ('background:' + meta.color + ';color:#fff;') : 'background:#f0f0f0;color:#555;') + '" ' +
                    'onclick="event.stopPropagation();switchCardMonth(\'' + buId + '\',\'' + m + '\')">' + label + '</span>';
            }).join('') +
            '</div>';
    }

    var dimChips = DIM_IDS.map(function(d, i) {
        var v = dims[d] || 0;
        return '<span class="dim-chip"><span class="chip-val" style="color:' + meta.color + '">' + v + '</span>' + DIM_NAMES[i] + '</span>';
    }).join('');

    // 点击雷达卡片时动态读取 sessionStorage._dept，保证身份切换后立即生效
    var IS_LOCAL = /localhost|127\.0\.0\.1/i.test(location.hostname);
    var MIAODA_BASE = 'https://lopal603906.aiforce.cloud/app/app_4k7069448fj88/';
    var BU_FILES = {
        'sdmd': 'radar_detail_sdmd.html',
        'kls':  'radar_detail_kelan.html',
        'lhy':  'radar_detail_lhy.html',
        'dhx':  'radar_detail_dkhx.html',
        'czly': 'radar_detail_czly.html',
        'lpsd': 'radar_detail_lpsd.html',
        'felt': 'radar_detail_felt.html',
        'sjld': 'radar_detail_sjl.html'
    };
    function showToast(msg) {
        var t = document.createElement('div');
        t.textContent = msg;
        Object.assign(t.style, {position:'fixed',top:'50%',left:'50%',transform:'translate(-50%,-50%)',background:'#1a1a2e',color:'#fff',padding:'12px 24px',borderRadius:'8px',fontSize:'14px',zIndex:99999,opacity:'0',transition:'opacity .3s',boxShadow:'0 4px 20px rgba(0,0,0,.25)'});
        document.body.appendChild(t);
        requestAnimationFrame(function(){t.style.opacity='1';});
        setTimeout(function(){t.style.opacity='0';setTimeout(function(){document.body.removeChild(t);},300);},2000);
    }
    // 雷达看板按 BU 过滤：点击卡片进入对应事业部详情，透传部门 ID（hash 方式）供详情页判定
    window.navigateToDetail = function(buId) {
        var file = BU_FILES[buId] || ('radar_detail.html?id=' + buId);
        var dm = location.hash.match(/[#&]dept=([^&]+)/)
              || location.search.match(/[?&]__dept=([^&]+)/);
        var deptId = dm ? decodeURIComponent(dm[1]) : '';
        if (!deptId) { try { deptId = sessionStorage.getItem('__dept') || sessionStorage.getItem('_dept') || ''; } catch(e){} }
        var km = location.hash.match(/[#&]key=([^&]+)/)
              || location.search.match(/[?&]key=([^&]+)/);
        var um = location.hash.match(/[#&]uid=([^&]+)/)
              || location.search.match(/[?&]uid=([^&]+)/);
        var key = km ? decodeURIComponent(km[1]) : '';
        var uid = um ? decodeURIComponent(um[1]) : '';
        var hashParts = [];
        if (deptId) hashParts.push('dept=' + encodeURIComponent(deptId));
        if (key) hashParts.push('key=' + encodeURIComponent(key));
        if (uid) hashParts.push('uid=' + encodeURIComponent(uid));
        if (hashParts.length) {
            file = file.split('#')[0] + '#' + hashParts.join('&');
        }
        location.assign(file);
    }

    return '<div id="card-' + buId + '" class="dept-card ' + meta.category + '" style="border-left-color:' + meta.color + '">' +
        '<div class="dept-card-header">' +
        logoHTML +
        '<div class="dept-info">' +
        '<div class="dept-name" style="color:' + meta.color + '">' + meta.name + currentBadge + '</div>' +
        '<div class="dept-subtitle">' + meta.subtitle + '</div>' +
        '</div></div>' +
        monthToggle +
        '<a href="javascript:void(0)" class="dept-radar-link" onclick="event.stopPropagation();navigateToDetail(\'' + buId + '\')">' +
        '<div class="dept-radar-preview" id="radar-' + buId + '"></div>' +
        '</a>' +
        '<div class="dept-dims-row">' + dimChips + '</div>' +
        '<div class="dept-score">' +
        '<span class="dept-score-label">综合评分</span>' +
        '<span><span class="dept-score-val" style="color:' + meta.color + '">' + score + '</span><span class="dept-score-dims">/100</span></span>' +
        '</div></div>';
}

function renderCards() {
    var gridMain = document.getElementById('grid-main');

    Object.keys(BU_META).forEach(function(buId) {
        var meta = BU_META[buId];
        var card = buildCard(buId, meta);
        gridMain.innerHTML += card;
    });

    // 渲染完卡片后，初始化所有 ECharts 雷达图
    initAllRadars();
    // 门禁命中（密钥/uid白名单/本地）：显示全部，跳过部门过滤；否则维持原部门过滤
    if (window.RADAR_UID_DECIDED ? window.RADAR_UID_ALLOWED : true) {
        return;
    }
    if (window.applyBUFilter) {
        setTimeout(function() { window.applyBUFilter('#grid-main'); }, 80);
    }
}

// ─────────────────────────────────────────────
// ECharts 迷你雷达图初始化（IntersectionObserver 懒加载）
// ─────────────────────────────────────────────
function initAllRadars() {
    Object.keys(BU_META).forEach(function(buId) {
        renderMiniRadar(buId);
    });
}

function renderMiniRadar(buId) {
    var dom = document.getElementById('radar-' + buId);
    if (!dom) return;

    var meta = BU_META[buId];
    var history = BU_HISTORY[buId];
    var activeMonth = currentCardMonth[buId];
    var dims = history && history[activeMonth]
        ? history[activeMonth]
        : (history ? (function() {
            var allMonths = Object.keys(history).sort();
            return history[allMonths[allMonths.length - 1]];
          })() : { d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0 });
    var vals = DIM_IDS.map(function(d) { return dims[d] || 0; });

    var chart = echarts.init(dom, null, { renderer: 'canvas', width: dom.clientWidth || 280, height: 145 });
    buChartInstances[buId] = chart;

    // 颜色辅助：亮色版本（用于渐变）
    var lightColor = meta.color + '99'; // 透明度60%
    var darkColor = meta.color;

    var option = {
        backgroundColor: 'transparent',
        animation: true,
        animationDuration: 800,
        animationEasing: 'cubicOut',
        tooltip: {
            trigger: 'item',
            confine: true,
            backgroundColor: 'rgba(255,255,255,0.97)',
            borderColor: meta.color,
            borderWidth: 1.5,
            borderRadius: 8,
            padding: [8, 12],
            textStyle: { color: '#333', fontSize: 12 },
            formatter: function(params) {
                var idx = params.dimensionIndex;
                var dimName = (idx != null && idx >= 0) ? (DIM_NAMES[idx] || ('维度' + (idx + 1))) : '综合评分';
                return '<b style="color:' + meta.color + ';font-size:13px">' + meta.name + '</b><br/>' +
                    '<span style="color:#888;font-size:11px">' + dimName + ':</span> ' +
                    '<b style="color:' + meta.color + ';font-size:14px">' + params.value + '</b>' +
                    '<span style="color:#888;font-size:11px"> / 100</span>';
            }
        },
        radar: {
            indicator: DIM_NAMES.map(function(n) { return { name: n, max: 100 }; }),
            radius: '62%',
            center: ['50%', '50%'],
            splitNumber: 3,
            axisName: {
                color: '#aaa',
                fontSize: 8,
                fontWeight: 'normal',
            },
            //渐变网格线（从内到外颜色变浅）
            splitLine: {
                show: true,
                lineStyle: {
                    width: 1,
                    color: {
                        type: 'linear',
                        x: 0, y: 0, x2: 0, y2: 1,
                        colorStops: [
                            { offset: 0, color: meta.color + '55' },
                            { offset: 0.5, color: meta.color + '22' },
                            { offset: 1, color: meta.color + '0a' }
                        ]
                    },
                    type: 'solid'
                }
            },
            // 渐变填充区域
            splitArea: {
                show: true,
                areaStyle: {
                    color: [
                        meta.color + '06',
                        meta.color + '0c',
                        meta.color + '14'
                    ]
                }
            },
            axisLine: {
                show: true,
                lineStyle: { color: meta.color + '66', width: 1 }
            },
            shape: 'polygon',
        },
        series: [{
            type: 'radar',
            emphasis: {
                lineStyle: { width: 3 },
                areaStyle: { opacity: 0.35 }
            },
            data: [{
                value: vals,
                name: meta.name,
                // 渐变线条
                lineStyle: {
                    color: {
                        type: 'linear',
                        x: 0, y: 0, x2: 1, y2: 1,
                        colorStops: [
                            { offset: 0, color: lightColor },
                            { offset: 1, color: darkColor }
                        ]
                    },
                    width: 2,
                    type: 'solid'
                },
                // 发光数据点
                itemStyle: {
                    color: meta.color,
                    shadowBlur: 10,
                    shadowColor: meta.color + '88'
                },
                // 径向渐变填充
                areaStyle: {
                    color: {
                        type: 'radial',
                        x: 0.5, y: 0.5, r: 0.5,
                        colorStops: [
                            { offset: 0, color: meta.color + '40' },
                            { offset: 1, color: meta.color + '0a' }
                        ]
                    }
                },
                label: { show: false },
                symbol: 'circle',
                symbolSize: 5,
            }],
        }],
    };

    chart.setOption(option);
}

//切换卡片月份并更新雷达图和维度分数
function switchCardMonth(buId, month) {
    currentCardMonth[buId] = month;

    // 更新按钮样式
    var card = document.getElementById('radar-' + buId);
    if (card && card.closest) {
        var btns = card.closest('.dept-card').querySelectorAll('.month-btn');
        btns.forEach(function(btn) {
            var isActive = (btn.textContent === month.replace('2026-', ''));
            var color = BU_META[buId].color;
            btn.style.background = isActive ? color : '#f0f0f0';
            btn.style.color = isActive ? '#fff' : '#555';
        });
    }

    // 重新渲染雷达图
    renderMiniRadar(buId);

    // 更新维度分数显示
    var history = BU_HISTORY[buId];
    var dims = history && history[month]
        ? history[month]
        : (history ? (function() {
            var allMonths = Object.keys(history).sort();
            return history[allMonths[allMonths.length - 1]];
          })() : { d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0 });
    if (dims) {
        var card2 = document.getElementById('radar-' + buId);
        if (card2 && card2.closest) {
            var chips = card2.closest('.dept-card').querySelectorAll('.dim-chip');
            DIM_IDS.forEach(function(d, i) {
                if (chips[i]) {
                    var val = dims[d] || 0;
                    chips[i].querySelector('.chip-val').textContent = val;
                }
            });
            // 更新综合评分
            var score = getScore(buId, dims);
            var scoreEl = card2.closest('.dept-card').querySelector('.dept-score-val');
            if (scoreEl) scoreEl.textContent = score;
        }
    }
}

//窗口 resize 时重绘所有图表
window.addEventListener('resize', function() {
    Object.keys(buChartInstances).forEach(function(buId) {
        var chart = buChartInstances[buId];
        var dom = document.getElementById('radar-' + buId);
        if (chart && dom) {
            chart.resize({ width: dom.clientWidth, height: 145 });
        }
    });
});
