<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="html-version" content="20260516-01">
<title>行业新闻 - 晨会指挥中心</title>
<style>
  :root {
    --primary: #1e3c72;
    --accent: #f39c12;
    --bg: #f0f2f8;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-dim: #7f8c8d;
    --border: #e0e6ef;
    --shadow: 0 2px 12px rgba(30,60,114,0.08);
    --shadow-hover: 0 6px 24px rgba(30,60,114,0.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;
          background:var(--bg); color:var(--text); min-height:100vh; }

  /* ── 顶部导航 ── */
  .topbar {
    background: #111111;
    padding:14px 30px; display:flex; align-items:center;
    justify-content:space-between; box-shadow:0 2px 12px rgba(0,0,0,0.15);
    position:sticky; top:0; z-index:100;
  }
  .topbar-title { color:#fff; font-size:20px; font-weight:700;
                   display:flex; align-items:center; gap:10px; }
  .topbar-title .icon { font-size:22px; }
  .topbar-date { color:rgba(255,255,255,0.85); font-size:13px; }
  .topbar-badge { background:var(--accent); color:#fff;
                   font-size:11px; padding:2px 8px; border-radius:20px;
                   font-weight:600; margin-left:8px; }
  .topbar-back {
    background:rgba(255,255,255,0.15); color:#fff; border:none;
    padding:7px 16px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:background 0.2s; display:flex; align-items:center; gap:6px;
  }
  .topbar-back:hover { background:rgba(255,255,255,0.25); }

  /* ── 页面容器 ── */
  .page {
    isolation:isolate;
    position:relative; max-width:1100px; margin:0 auto; padding:24px 16px 60px; }

    /* ── BU主Tab栏（一级，含下拉维度，单行不换行） ── */
  .bu-tab-bar {
    display:flex; gap:8px; margin-bottom:20px;
    position:relative; z-index:999;
    flex-wrap:nowrap; align-items:flex-start;
    padding-bottom:4px;
  }

  .bu-tab-wrap {
    position:relative; display:inline-block; flex-shrink:0;
    z-index:999;
  }
  .bu-tab-btn {
    padding:8px 18px; border-radius:20px; border:2px solid transparent;
    cursor:pointer; font-size:13px; font-weight:600;
    background:#fff; color:var(--text); white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .bu-tab-btn .dropdown-arrow { font-size:10px; transition:transform 0.2s; }
  .bu-tab-wrap:hover .bu-tab-btn .dropdown-arrow { transform:rotate(180deg); }

  /* 下拉菜单（默认隐藏，悬停显示） */
  .bu-dropdown {
    display:none;
    position:absolute; top:calc(100% + 6px); left:0;
    background:#fff; border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12);
    z-index:1000; min-width:160px; overflow:visible;
  }
  .bu-tab-wrap:hover .bu-dropdown { display:block; }

  .bu-dropdown-item {
    padding:10px 16px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; transition:background 0.15s;
    border-bottom:1px solid var(--border);
  }
  .bu-dropdown-item:last-child { border-bottom:none; }
  .bu-dropdown-item:hover { background:#f0f4ff; }
  .bu-dropdown-item .dro-label { display:flex; align-items:center; gap:8px; }
  .bu-dropdown-item .dro-count {
    font-size:11px; color:var(--text-dim); background:var(--bg);
    padding:1px 7px; border-radius:10px; font-weight:600;
  }
/* ── 内容区标题（当前BU+维度指示） ── */
  .content-header {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .content-header .bu-pill {
    font-size:12px; padding:3px 12px; border-radius:20px;
    color:#fff; font-weight:600;
  }
  .content-header .dim-label {
    font-size:14px; font-weight:700; color:var(--text);
  }

  /* ── 维度内容区 ── */
  .dim-content { display:none; }
  .dim-content.active { display:block; }

  /* ── 统计条 ── */
  .dim-stats {
    display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;
  }
  .stat-chip {
    font-size:12px; padding:4px 12px; border-radius:20px;
    background:#fff; border:1px solid var(--border);
    color:var(--text-dim);
  }
  .stat-chip strong { color:var(--primary); }

  /* ── 新闻卡片 ── */
  .news-card {
    background:var(--card-bg); border-radius:12px; padding:16px 20px;
    margin-bottom:12px; box-shadow:var(--shadow);
    border-left:4px solid var(--border);
    transition:box-shadow 0.2s, border-color 0.2s;
    cursor:pointer;
  }
  .news-card:hover { box-shadow:var(--shadow-hover); border-left-color:var(--primary); }
  .news-card.p0 { border-left-color:#c0392b; }
  .news-card.p1 { border-left-color:#e67e22; }
  .news-card.p2 { border-left-color:#27ae60; }

  .card-top {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:8px;
  }
  .bu-tag {
    font-size:11px; font-weight:700; padding:2px 10px;
    border-radius:20px; color:#fff;
  }
  .priority-tag {
    font-size:10px; font-weight:700; padding:2px 7px;
    border-radius:3px; color:#fff;
  }
  .priority-tag.p0 { background:#c0392b; }
  .priority-tag.p1 { background:#e67e22; }
  .priority-tag.p2 { background:#27ae60; }

  .card-title {
    font-size:15px; font-weight:700; color:var(--primary);
    line-height:1.5; margin-bottom:6px;
  }
  .card-content {
    font-size:13px; color:var(--text-dim); line-height:1.8;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
    transition:max-height 0.3s ease;
  }
  .news-card.expanded .card-content {
    display:block; -webkit-line-clamp:unset; overflow:visible;
  }
  .card-arrow {
    font-size:11px; color:var(--text-dim); margin-top:4px;
    transition:transform 0.2s;
  }
  .news-card.expanded .card-arrow { transform:rotate(180deg); }

  .card-footer {
    margin-top:8px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .card-source { font-size:11px; color:var(--text-dim); }
  .card-link {
    font-size:11px; color:#3498db; text-decoration:none;
  }
  .card-link:hover { text-decoration:underline; }

  /* ── 加载状态 ── */
  #pageLoader { text-align:center; padding:80px 0; color:#888; }
  #pageLoader .loader-icon { font-size:40px; margin-bottom:14px; }
  #pageLoader .loader-msg { font-size:15px; }
  .page-error { text-align:center; padding:60px 20px; color:#888; font-size:14px; }

  /* ── 空状态 ── */
  .empty-state {
    text-align:center; padding:60px 20px; color:#aaa;
    font-size:14px; background:var(--card-bg); border-radius:12px;
    box-shadow:var(--shadow);
  }

  @media (max-width:640px) {
    .topbar { padding:12px 16px; }
    .topbar-title { font-size:16px; }
    .dim-tab-btn { padding:6px 14px; font-size:13px; }
    .news-card { padding:12px 14px; }
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="topbar">
  <div class="topbar-title">
    <span class="icon">📰</span>
    行业新闻
    <span class="topbar-badge">今日更新</span>
  </div>
  <div class="topbar-date" id="topbarDate">加载中...</div>
  <button class="topbar-back" onclick="history.back()">← 返回首页</button>
</div>

<!-- 页面 -->
<div class="page">

  <!-- 加载状态 -->
  <div id="pageLoader">
    <div class="loader-icon">⏳</div>
    <div class="loader-msg">正在加载行业新闻...</div>
  </div>

  <!-- 真实内容（JS 渲染） -->
  <div id="realPageContent" style="display:none">

    <!-- BU主Tab（一级，含下拉维度子Tab） -->
    <div class="bu-tab-bar" id="buTabBar"></div>

    <!-- 内容区（直接渲染新闻，无二级维度Tab） -->
    <div id="dimContentArea"></div>

  </div>

</div>

<script src="inline_00.js"></script><script src="inline_01.js"></script>

<script src="inline_02.js"></script>
</body>
</html>
