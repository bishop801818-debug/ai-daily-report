<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>飞书授权回调 - 锂电产业链AI日报</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .callback-container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        
        .callback-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        .callback-title {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 10px;
        }
        
        .callback-message {
            font-size: 14px;
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .callback-loading {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .callback-error {
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #c33;
            font-size: 14px;
        }
        
        .callback-success {
            background: #efe;
            border: 1px solid #cfc;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            color: #3c3;
            font-size: 14px;
        }
        
        .callback-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: transform 0.2s;
        }
        
        .callback-button:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="callback-container">
        <div class="callback-icon">🔐</div>
        <div class="callback-title">飞书授权处理中</div>
        <div class="callback-message" id="message">正在处理您的授权信息，请稍候...</div>
        <div class="callback-loading" id="loading"></div>
        <div class="callback-error" id="error" style="display: none;"></div>
        <div class="callback-success" id="success" style="display: none;"></div>
        <button class="callback-button" id="closeButton" style="display: none;" onclick="window.close()">关闭窗口</button>
    </div>

    <script>
        // 配置：后端服务地址（根据实际部署修改）
        const BACKEND_URL = 'http://localhost:5000';
        
        // 页面加载后自动处理授权
        window.addEventListener('DOMContentLoaded', function() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            const state = urlParams.get('state');
            
            if (!code) {
                showError('授权失败：未获取到授权码');
                return;
            }
            
            // 开始处理授权流程
            processAuth(code, state);
        });
        
        // 处理授权流程
        async function processAuth(code, state) {
            try {
                // 1. 交换 access_token
                showMessage('正在验证授权信息...');
                const tokenResult = await fetch(`${BACKEND_URL}/feishu/callback`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({code: code, state: state})
                });
                
                const tokenData = await tokenResult.json();
                if (tokenData.code !== 0) {
                    throw new Error(tokenData.msg || '授权验证失败');
                }
                
                const accessToken = tokenData.data.access_token;
                const userId = tokenData.data.user_id;
                
                // 2. 获取用户部门和匹配的事业部
                showMessage('正在获取您的部门信息...');
                const deptResult = await fetch(`${BACKEND_URL}/feishu/get-user-dept`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({access_token: accessToken, user_id: userId})
                });
                
                const deptData = await deptResult.json();
                if (deptData.code !== 0) {
                    throw new Error(deptData.msg || '获取部门信息失败');
                }
                
                const matchedBu = deptData.data.matched_bu;
                const matchedDeptName = deptData.data.matched_dept_name;
                
                // 3. 保存用户信息到 localStorage
                const userInfo = {
                    user_id: userId,
                    matched_bu: matchedBu,
                    matched_dept_name: matchedDeptName,
                    auth_time: new Date().toISOString()
                };
                
                localStorage.setItem('feishu_user_info', JSON.stringify(userInfo));
                
                // 4. 通知主页面（通过 storage 事件）
                localStorage.setItem('feishu_auth_event', Date.now().toString());
                
                // 5. 显示成功信息
                if (matchedBu) {
                    showSuccess(`授权成功！\n您所属的事业部：${matchedDeptName}\n即将自动关闭窗口...`);
                } else {
                    showSuccess(`授权成功！\n但未匹配到对应事业部，将显示默认权限。\n即将自动关闭窗口...`);
                }
                
                // 6. 3秒后自动关闭窗口
                setTimeout(() => {
                    window.close();
                }, 3000);
                
            } catch (error) {
                console.error('授权处理失败:', error);
                showError(`授权处理失败：${error.message}`);
            }
        }
        
        // 显示消息
        function showMessage(msg) {
            document.getElementById('message').textContent = msg;
            document.getElementById('loading').style.display = 'inline-block';
            document.getElementById('error').style.display = 'none';
            document.getElementById('success').style.display = 'none';
            document.getElementById('closeButton').style.display = 'none';
        }
        
        // 显示错误
        function showError(msg) {
            document.getElementById('message').textContent = '授权失败';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = msg;
            document.getElementById('closeButton').style.display = 'inline-block';
        }
        
        // 显示成功
        function showSuccess(msg) {
            document.getElementById('message').textContent = '授权成功';
            document.getElementById('loading').style.display = 'none';
            document.getElementById('success').style.display = 'block';
            document.getElementById('success').textContent = msg;
        }
    </script>
</body>
</html>
