<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>艾隶集团股权穿透图</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  svg { max-width: 100%; height: auto; }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720">
  <defs>
    <!-- 连接线渐变 -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A7FE0"/>
      <stop offset="100%" stop-color="#5B9EF5"/>
    </linearGradient>
    <!-- 阴影 -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(74,127,224,0.18)"/>
    </filter>
    <filter id="shadowGreen" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(46,186,131,0.18)"/>
    </filter>
    <filter id="shadowOrange" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(247,154,47,0.18)"/>
    </filter>
    <!-- 顶部渐变背景 -->
    <linearGradient id="topBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3a7a"/>
      <stop offset="100%" stop-color="#2a5ab8"/>
    </linearGradient>
    <!-- 蓝色方块渐变 -->
    <linearGradient id="blueBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A7FE0"/>
      <stop offset="100%" stop-color="#3A6FD4"/>
    </linearGradient>
    <!-- 绿色方块渐变 -->
    <linearGradient id="greenBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2EBA83"/>
      <stop offset="100%" stop-color="#25996e"/>
    </linearGradient>
    <!-- 橙色方块渐变 -->
    <linearGradient id="orangeBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F79A2F"/>
      <stop offset="100%" stop-color="#e8861f"/>
    </linearGradient>
    <!-- 浅蓝方块渐变 -->
    <linearGradient id="lightBlueBox" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B9FE8"/>
      <stop offset="100%" stop-color="#5588D8"/>
    </linearGradient>
  </defs>

  <!-- ==================== 主图区域 ==================== -->

  <!-- 虚线连接：顶层→第二层 -->
  <line x1="550" y1="160" x2="550" y2="200" stroke="#4A7FE0" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="546,196 554,196 550,204" fill="#4A7FE0"/>

  <!-- 虚线连接：第二层→第三层左侧分支 -->
  <line x1="310" y1="260" x2="310" y2="310" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="310" y1="310" x2="800" y2="310" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 垂直连接线：第三层各公司 -->
  <line x1="148" y1="310" x2="148" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="265" y1="310" x2="265" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="385" y1="310" x2="385" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="505" y1="310" x2="505" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="625" y1="310" x2="625" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="745" y1="310" x2="745" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="865" y1="310" x2="865" y2="340" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 虚线连接：第三层→第四层左侧（智慧生活） -->
  <line x1="148" y1="395" x2="148" y2="440" stroke="#2EBA83" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="148" y1="440" x2="430" y2="440" stroke="#2EBA83" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="198" y1="440" x2="198" y2="460" stroke="#2EBA83" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="310" y1="440" x2="310" y2="460" stroke="#2EBA83" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="430" y1="440" x2="430" y2="460" stroke="#2EBA83" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- 虚线连接：第三层→第四层右侧（外部公司） -->
  <line x1="865" y1="395" x2="865" y2="440" stroke="#F79A2F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="865" y1="440" x2="1020" y2="440" stroke="#F79A2F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="940" y1="440" x2="940" y2="460" stroke="#F79A2F" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1020" y1="440" x2="1020" y2="460" stroke="#F79A2F" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ==================== 顶部标题 ==================== -->
  <rect x="0" y="0" width="1100" height="50" fill="url(#topBg)"/>
  <text x="550" y="32" text-anchor="middle" fill="white" font-size="17" font-weight="bold" letter-spacing="3">艾隶集团 · 股权穿透图</text>

  <!-- ==================== 持股比例标注（第二层水平线上方）==================== -->
  <!-- 100% 标注在左分支 -->
  <rect x="295" y="205" width="52" height="22" rx="11" fill="#4A7FE0" filter="url(#shadow)"/>
  <text x="321" y="220" text-anchor="middle" fill="white" font-size="12" font-weight="bold">100%</text>

  <!-- 35% 标注在中间分支 -->
  <rect x="480" y="205" width="52" height="22" rx="11" fill="#4A7FE0" filter="url(#shadow)"/>
  <text x="506" y="220" text-anchor="middle" fill="white" font-size="12" font-weight="bold">35%</text>

  <!-- 10% 标注在右分支 -->
  <rect x="720" y="205" width="52" height="22" rx="11" fill="#4A7FE0" filter="url(#shadow)"/>
  <text x="746" y="220" text-anchor="middle" fill="white" font-size="12" font-weight="bold">10%</text>

  <!-- 连接线 100%→左分支 -->
  <line x1="321" y1="227" x2="148" y2="290" stroke="#4A7FE0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- 连接线 35%→中间分支 -->
  <line x1="506" y1="227" x2="505" y2="290" stroke="#4A7FE0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>
  <!-- 连接线 10%→右分支 -->
  <line x1="746" y1="227" x2="745" y2="290" stroke="#4A7FE0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

  <!-- ==================== 第一层：艾隶集团 ==================== -->
  <rect x="440" y="55" width="220" height="100" rx="12" fill="url(#topBg)" filter="url(#shadow)"/>
  <text x="550" y="95" text-anchor="middle" fill="white" font-size="18" font-weight="bold">艾隶集团</text>
  <text x="550" y="118" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="11">最终受益方</text>
  <circle cx="510" cy="103" r="4" fill="rgba(255,255,255,0.6)"/>
  <circle cx="590" cy="103" r="4" fill="rgba(255,255,255,0.6)"/>

  <!-- ==================== 第二层：杭州艾隶网络科技有限公司 ==================== -->
  <rect x="310" y="200" width="480" height="55" rx="10" fill="url(#blueBox)" filter="url(#shadow)"/>
  <text x="550" y="228" text-anchor="middle" fill="white" font-size="14" font-weight="bold">杭州艾隶网络科技有限公司</text>
  <text x="550" y="245" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="11">持股平台</text>

  <!-- ==================== 第三层：7家子公司 ==================== -->

  <!-- 公司1：智慧生活 -->
  <rect x="68" y="340" width="160" height="55" rx="8" fill="url(#greenBox)" filter="url(#shadowGreen)"/>
  <text x="148" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶智慧生活</text>
  <text x="148" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">服务有限公司</text>

  <!-- 公司2：城市服务 -->
  <rect x="185" y="340" width="160" height="55" rx="8" fill="url(#greenBox)" filter="url(#shadowGreen)"/>
  <text x="265" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶城市服务</text>
  <text x="265" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">集团有限公司</text>

  <!-- 公司3：数字科技 -->
  <rect x="305" y="340" width="160" height="55" rx="8" fill="url(#greenBox)" filter="url(#shadowGreen)"/>
  <text x="385" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶数字科技</text>
  <text x="385" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">有限公司</text>

  <!-- 公司4：企业管理 -->
  <rect x="425" y="340" width="160" height="55" rx="8" fill="url(#lightBlueBox)" filter="url(#shadow)"/>
  <text x="505" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶企业管理</text>
  <text x="505" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">有限公司</text>

  <!-- 公司5：公关广告 -->
  <rect x="545" y="340" width="160" height="55" rx="8" fill="url(#lightBlueBox)" filter="url(#shadow)"/>
  <text x="625" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶公关广告</text>
  <text x="625" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">有限公司</text>

  <!-- 公司6：供应链 -->
  <rect x="665" y="340" width="160" height="55" rx="8" fill="url(#lightBlueBox)" filter="url(#shadow)"/>
  <text x="745" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶供应链</text>
  <text x="745" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">有限公司</text>

  <!-- 公司7：新能源 -->
  <rect x="785" y="340" width="160" height="55" rx="8" fill="url(#lightBlueBox)" filter="url(#shadow)"/>
  <text x="865" y="362" text-anchor="middle" fill="white" font-size="11" font-weight="bold">杭州艾隶新能源科技</text>
  <text x="865" y="379" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="10">有限公司</text>

  <!-- ==================== 第四层：智慧生活子业务 ==================== -->
  <text x="148" y="425" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">业务版块</text>

  <rect x="120" y="460" width="155" height="36" rx="6" fill="#E8F5EE" stroke="#2EBA83" stroke-width="1.5"/>
  <text x="197" y="483" text-anchor="middle" fill="#1a6b45" font-size="11" font-weight="bold">艾隶智慧生活 App</text>

  <rect x="260" y="460" width="155" height="36" rx="6" fill="#E8F5EE" stroke="#2EBA83" stroke-width="1.5"/>
  <text x="337" y="483" text-anchor="middle" fill="#1a6b45" font-size="11" font-weight="bold">艾隶到家</text>

  <rect x="380" y="460" width="155" height="36" rx="6" fill="#E8F5EE" stroke="#2EBA83" stroke-width="1.5"/>
  <text x="457" y="483" text-anchor="middle" fill="#1a6b45" font-size="11" font-weight="bold">社区服务</text>

  <!-- ==================== 第四层：外部公司 ==================== -->
  <text x="980" y="425" text-anchor="middle" fill="#888" font-size="10" font-weight="bold">外部合作</text>

  <rect x="895" y="460" width="130" height="36" rx="6" fill="#FFF3E6" stroke="#F79A2F" stroke-width="1.5"/>
  <text x="960" y="483" text-anchor="middle" fill="#b35912" font-size="11" font-weight="bold">艾隶钱包 App</text>

  <rect x="980" y="460" width="100" height="36" rx="6" fill="#FFF3E6" stroke="#F79A2F" stroke-width="1.5"/>
  <text x="1030" y="483" text-anchor="middle" fill="#b35912" font-size="11" font-weight="bold">艾隶科技</text>

  <!-- ==================== 底部标注 ==================== -->
  <rect x="30" y="545" width="1040" height="55" rx="10" fill="#F0F5FF" stroke="#4A7FE0" stroke-width="1.5"/>

  <circle cx="60" cy="572" r="5" fill="#4A7FE0"/>
  <text x="75" y="576" fill="#333" font-size="12" font-weight="bold">穿透后最终受益方：</text>
  <text x="235" y="576" fill="#1a3a7a" font-size="12" font-weight="bold">艾隶集团</text>

  <line x1="310" y1="562" x2="310" y2="582" stroke="#DDD" stroke-width="1"/>

  <circle cx="335" cy="572" r="5" fill="#2EBA83"/>
  <text x="350" y="576" fill="#333" font-size="12" font-weight="bold">各子公司：</text>
  <text x="440" y="576" fill="#555" font-size="12">独立运营，自负盈亏</text>

  <line x1="600" y1="562" x2="600" y2="582" stroke="#DDD" stroke-width="1"/>

  <circle cx="625" cy="572" r="5" fill="#F79A2F"/>
  <text x="640" y="576" fill="#333" font-size="12" font-weight="bold">外部合作：</text>
  <text x="740" y="576" fill="#555" font-size="12">艾隶钱包 App / 艾隶科技</text>

  <!-- ==================== 图例 ==================== -->
  <text x="30" y="625" fill="#888" font-size="11" font-weight="bold">图例</text>

  <rect x="30" y="635" width="18" height="18" rx="4" fill="url(#topBg)"/>
  <text x="55" y="649" fill="#555" font-size="11">集团顶层</text>

  <rect x="130" y="635" width="18" height="18" rx="4" fill="url(#blueBox)"/>
  <text x="155" y="649" fill="#555" font-size="11">持股平台</text>

  <rect x="230" y="635" width="18" height="18" rx="4" fill="url(#greenBox)"/>
  <text x="255" y="649" fill="#555" font-size="11">核心业务</text>

  <rect x="330" y="635" width="18" height="18" rx="4" fill="url(#lightBlueBox)"/>
  <text x="355" y="649" fill="#555" font-size="11">配套业务</text>

  <rect x="440" y="635" width="18" height="18" rx="4" fill="url(#orangeBox)"/>
  <text x="465" y="649" fill="#555" font-size="11">外部合作</text>

  <!-- 虚线说明 -->
  <line x1="550" y1="643" x2="590" y2="643" stroke="#4A7FE0" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="600" y="649" fill="#555" font-size="11">股权穿透路径</text>

  <!-- 比例说明 -->
  <rect x="710" y="635" width="52" height="18" rx="9" fill="#4A7FE0"/>
  <text x="736" y="648" text-anchor="middle" fill="white" font-size="10" font-weight="bold">100%</text>
  <text x="770" y="649" fill="#555" font-size="11">持股比例标注</text>

  <!-- ==================== 底部说明文字 ==================== -->
  <line x1="30" y1="665" x2="1070" y2="665" stroke="#EEE" stroke-width="1"/>
  <text x="550" y="685" text-anchor="middle" fill="#AAA" font-size="10">© 艾隶集团 · 股权结构以工商登记为准 · 仅供内部参考</text>

  <!-- ==================== 侧边装饰 ==================== -->
  <rect x="0" y="50" width="5" height="610" fill="url(#topBg)" opacity="0.6"/>
</svg>
</body>
</html>
