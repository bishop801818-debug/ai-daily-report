    <title>雷达看板 - 龙蟠科技</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; min-height: 100vh; }

        .page-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 24px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(30,60,114,0.3);
        }
        .page-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .page-header .back-btn:hover { color: white; }
        .page-header h1 { font-size: 22px; font-weight: bold; margin-bottom: 4px; }
        .page-header .subtitle { font-size: 13px; opacity: 0.85; }

        .container { max-width: 1100px; margin: 30px auto; padding: 0 20px; }

        .section-label {
            font-size: 13px;
            color: #888;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-label::after { content: ""; flex: 1; height: 1px; background: #ddd; }

        .dept-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 36px;
        }

        .dept-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border-left: 4px solid #1e3c72;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .dept-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(30,60,114,0.15);
        }
        .dept-card.lithium { border-left-color: #1e3c72; }
        .dept-card.longpan { border-left-color: #2e75b6; }
        .dept-card.other { border-left-color: #7030a0; }

        .dept-card-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .dept-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
            border: 2px solid rgba(0,0,0,0.08);
            flex-shrink: 0;
        }
        .dept-info { flex: 1; min-width: 0; }
        .dept-name { font-size: 14px; font-weight: bold; color: #1e3c72; margin-bottom: 2px; }
        .dept-subtitle { font-size: 11px; color: #888; }

        /* ECharts 雷达图容器 */
        .dept-radar-preview {
            height: 130px;
            margin: 6px 0 4px;
            flex-shrink: 0;
        }
        .dept-radar-preview canvas { border-radius: 8px; }

        /* 月份切换按钮 */
        .dept-month-toggle {
            display: flex;
            gap: 4px;
            margin: 4px 0 2px;
            justify-content: center;
        }
        .month-btn {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            background: #f0f0f0;
            color: #555;
            border: none;
            -webkit-user-select: none;
            user-select: none;
        }
        .month-btn:hover { opacity: 0.8; }
        .month-btn.active { font-weight: 600; }

        .dept-score {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid #f0f0f0;
        }
        .dept-score-label { font-size: 12px; color: #888; }
        .dept-score-val { font-size: 18px; font-weight: bold; color: #1e3c72; }
        .dept-score-dims { font-size: 11px; color: #aaa; margin-left: 6px; }

        .dept-dims-row {
            display: flex;
            gap: 4px;
            margin-top: 6px;
            flex-wrap: wrap;
        }
        .dim-chip {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #666;
        }
        .dim-chip .chip-val { font-weight: bold; margin-right: 2px; }

        .dept-current-badge {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #fff3e0;
            color: #e67e22;
            font-weight: bold;
            margin-left: 6px;
        }

        .footer-note {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            padding: 24px;
            border-top: 1px solid #eee;
            margin-top: 20px;
        }
        .footer-note a { color: #1e3c72; text-decoration: none; font-weight: 600; }
        .footer-note a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .dept-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
