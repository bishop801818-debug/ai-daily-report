<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷达看板 - 龙蟠科技</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; min-height: 100vh; }

        .page-header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 20px 40px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 12px rgba(30,60,114,0.3);
        }
        .page-header .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: rgba(255,255,255,0.85);
            text-decoration: none;
            font-size: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: color 0.2s;
        }
        .page-header .back-btn:hover { color: white; }
        .page-header .header-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .page-header .bu-logo {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: contain;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.4);
            flex-shrink: 0;
        }
        .page-header .bu-name { font-size: 22px; font-weight: bold; }
        .page-header .bu-subtitle { font-size: 13px; opacity: 0.8; }

        .container { max-width: 1100px; margin: 24px auto; padding: 0 20px; }

        /* 综合评分卡 */
        .score-overview {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .score-main {
            flex: 00 160px;
            background: white;
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border-top: 4px solid #1e3c72;
        }
        .score-main .big-score { font-size: 56px; font-weight: bold; color: #1e3c72; line-height: 1; }
        .score-main .score-label { font-size: 13px; color: #888; margin-top: 6px; }
        .score-main .score-sub { font-size: 11px; color: #aaa; margin-top: 4px; }

        .score-dims {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 16px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .dim-item {
            flex: 1;
            text-align: center;
            padding: 8px 4px;
            border-radius: 8px;
            background: #f8f9fc;
        }
        .dim-item .dim-name { font-size: 11px; color: #888; margin-bottom: 4px; }
        .dim-item .dim-score { font-size: 20px; font-weight: bold; color: #1e3c72; }
        .dim-item .dim-max { font-size: 10px; color: #aaa; }

        /* Tab 导航 */
        .tab-nav {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid #eee;
            padding-bottom: 0;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            font-size: 14px;
            color: #888;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .tab-btn:hover { color: #1e3c72; }
        .tab-btn.active { color: #1e3c72; border-bottom-color: #1e3c72; font-weight: bold; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 图表区 */
        .chart-section {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 02px 8px rgba(0,0,0,0.06);
            margin-bottom: 24px;
        }
        .chart-title {
            font-size: 15px;
            font-weight: bold;
            color: #1e3c72;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .chart-wrap { height: 380px; }

        /* KPI 详情卡片 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        .kpi-card {
            background: white;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 3px solid #1e3c72;
        }
        .kpi-card .kpi-name { font-size: 12px; color: #888; margin-bottom: 6px; }
        .kpi-card .kpi-val { font-size: 22px; font-weight: bold; color: #1e3c72; }
        .kpi-card .kpi-unit { font-size: 12px; color: #aaa; margin-left: 4px; }
        .kpi-card .kpi-delta { font-size: 12px; margin-top: 4px; }
        .kpi-card .kpi-delta.up { color: #e74c3c; }
        .kpi-card .kpi-delta.down { color: #27ae60; }

        /* 雷达图指标说明 */
        .dim-explain {
            background: #f8f9fc;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 12px;
            font-size: 12px;
            color: #666;
            line-height: 1.8;
        }
        .dim-explain strong { color: #1e3c72; }

        .footer-note {
            text-align: center;
            color: #bbb;
            font-size: 12px;
            padding: 24px;
            border-top: 1px solid #eee;
        }
        .footer-note a { color: #1e3c72; text-decoration: none; }
        .footer-note a:hover { text-decoration: underline; }

        @media (max-width: 768px) {
            .score-overview { flex-direction: column; }
            .score-dims { flex-wrap: wrap; }
            .kpi-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="page-header" id="pageHeader">
    <a class="back-btn" href="radar_hub.html">← 雷达看板</a>
    <a class="back-btn" href="index_v3.html" style="margin-left:12px">← 返回首页</a>
    <div class="header-row">
        <img class="bu-logo" id="buLogo" src="" alt="logo" onerror="this.style.display='none'">
        <div>
            <div class="bu-name" id="buName">--</div>
            <div class="bu-subtitle" id="buSubtitle">--</div>
        </div>
    </div>
</div>

<div class="container">
    <!-- 综合评分 -->
    <div class="score-overview">
        <div class="score-main">
            <div class="big-score" id="bigScore">--</div>
            <div class="score-label">综合评分</div>
            <div class="score-sub">六维加权平均</div>
        </div>
        <div class="score-dims" id="scoreDims"></div>
    </div>

    <!-- Tab 导航 -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab(this, 'radar')">六维雷达图</button>
        <button class="tab-btn" onclick="switchTab(this, 'kpi')">KPI详情</button>
        <button class="tab-btn" onclick="switchTab(this, 'history')">历史趋势</button>
    </div>

    <!-- Tab: 雷达图 -->
    <div id="tab-radar" class="tab-content active">
        <div class="chart-section">
            <div class="chart-title">六维能力雷达图</div>
            <div class="chart-wrap" id="radarChart"></div>
            <div class="dim-explain">
                <strong>指标说明：</strong>
                D1 战略达成 / D2 经营效益 / D3客户认可 / D4 组织效能 / D5 创新研发 / D6 风险管控
            </div>
        </div>
    </div>

    <!-- Tab: KPI详情 -->
    <div id="tab-kpi" class="tab-content">
        <div class="kpi-grid" id="kpiGrid"></div>
    </div>

    <!-- Tab: 历史趋势 -->
    <div id="tab-history" class="tab-content">
        <div class="chart-section">
            <div class="chart-title">综合评分历史趋势</div>
            <div class="chart-wrap" id="historyChart"></div>
        </div>
    </div>
</div>

<div class="footer-note">
    数据仅供参考 · <a href="radar_hub.html">返回雷达看板</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<script>
var BU_META = {
    czly: { name: '常州锂源', subtitle: '磷酸铁锂正极材料', category: 'lithium', color: '#1e3c72' },
    lpsd: { name: '龙蟠时代', subtitle: '碳酸锂', category: 'lithium', color: '#2e75b6' },
    felt: { name: '法恩莱特', subtitle: '电解液', category: 'lithium', color: '#7b2d8b' },
    sdmd: { name: '山东美多', subtitle: '动力电池回收', category: 'lithium', color: '#215732' },
    sjld: { name: '三金锂电', subtitle: '三元前驱体', category: 'lithium', color: '#34495e' },
    kls:  { name: '可兰素', subtitle: '车用尿素', category: 'other', color: '#d35400' },
    lhy:  { name: '润滑油事业部', subtitle: '润滑油', category: 'other', color: '#c0392b' },
    bych: { name: '铂源催化', subtitle: '氢能/催化', category: 'other', color: '#8e44ad' },
    dhx:  { name: '迪克化学', subtitle: '汽车化学品', category: 'other', color: '#16a085' },
};

var BU_DIMS = {
    czly: { d1: 87, d2: 90, d3: 82, d4: 80, d5: 90, d6: 78 },
    lpsd: { d1: 75, d2: 72, d3: 88, d4: 65, d5: 70, d6: 82 },
    felt: { d1: 82, d2: 88, d3: 85, d4: 78, d5: 85, d6: 80 },
    sdmd: { d1: 70, d2: 65, d3: 75, d4: 60, d5: 68, d6: 72 },
    sjld: { d1: 78, d2: 80, d3: 72, d4: 75, d5: 78, d6: 70 },
    kls:  { d1: 85, d2: 88, d3: 90, d4: 85, d5: 82, d6: 88 },
    lhy:  { d1: 80, d2: 82, d3: 78, d4: 80, d5: 75, d6: 78 },
    bych: { d1: 68, d2: 65, d3: 70, d4: 62, d5: 60, d6: 65 },
    dhx:  { d1: 75, d2: 78, d3: 72, d4: 70, d5: 72, d6: 75 },
};

var BU_HISTORY = {
    czly: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [82, 83, 85, 80, 78, 84, 86, 84] },
    lpsd: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [70, 72, 74, 71, 73, 75, 74, 76] },
    felt: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [78, 80, 82, 79, 81, 83, 84, 84] },
    sdmd: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [65, 66, 68, 67, 69, 70, 71, 71] },
    sjld: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [74, 75, 76, 75, 77, 78, 78, 78] },
    kls:  { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [82, 83, 84, 83, 85, 86, 87, 87] },
    lhy:  { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [76, 77, 78, 77, 79, 80, 80, 80] },
    bych: { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [62, 63, 64, 63, 65, 66, 67, 67] },
    dhx:  { months: ['2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04','2026-05'], scores: [72, 73, 74, 73, 74, 75, 75, 75] },
};

var BU_LOGOS = {};

// 加载 logo
(function loadLogos() {
    fetch('bu_logos.json')
        .then(function(r) { return r.json(); })
        .then(function(logos) {
            BU_LOGOS = logos;
            init();
        })
        .catch(function() {
            init();
        });
})();

function init() {
    var params = new URLSearchParams(location.search);
    var buId = params.get('id') || 'czly';

    if (!BU_META[buId]) {
        buId = 'czly';
    }

    var meta = BU_META[buId];
    var dims = BU_DIMS[buId] || { d1: 0, d2: 0, d3: 0, d4: 0, d5: 0, d6: 0 };
    var history = BU_HISTORY[buId] || { months: [], scores: [] };

    // 设置页面标题和header
    document.title = meta.name + ' - 雷达看板';
    document.getElementById('buName').textContent = meta.name;
    document.getElementById('buSubtitle').textContent = meta.subtitle;
    document.getElementById('pageHeader').style.borderTopColor = meta.color;
    document.getElementById('pageHeader').style.background = 'linear-gradient(135deg, ' + meta.color + ' 0%, ' + adjustColor(meta.color, 20) + ' 100%)';

    // Logo
    var logo = BU_LOGOS[buId];
    if (logo) {
        document.getElementById('buLogo').src = logo;
    } else {
        document.getElementById('buLogo').style.display = 'none';
    }

    // 综合评分
    var vals = [dims.d1, dims.d2, dims.d3, dims.d4, dims.d5, dims.d6];
    var score = Math.round(vals.reduce(function(a, b) { return a + b; }, 0) / vals.length);
    document.getElementById('bigScore').textContent = score;
    document.getElementById('bigScore').style.color = meta.color;

    // 六维小卡
    var dimNames = ['D1战略达成', 'D2经营效益', 'D3客户认可', 'D4组织效能', 'D5创新研发', 'D6风险管控'];
    var dimDoms = ['d1', 'd2', 'd3', 'd4', 'd5', 'd6'];
    var scoreDimsEl = document.getElementById('scoreDims');
    dimDoms.forEach(function(d, i) {
        var v = dims[d] || 0;
        scoreDimsEl.innerHTML +=
            '<div class="dim-item">' +
            '<div class="dim-name">' + dimNames[i] + '</div>' +
            '<div class="dim-score" style="color:' + meta.color + '">' + v + '</div>' +
            '<div class="dim-max">/100</div>' +
            '</div>';
    });

    // KPI 卡片
    var kpiData = [
        { name: '营收达成率', val: '95%', delta: '+5%', up: true },
        { name: '净利润率', val: '8.2%', delta: '+1.2%', up: true },
        { name: '客户满意度', val: '88分', delta: '+3分', up: true },
        { name: '产能利用率', val: '82%', delta: '-3%', up: false },
        { name: '新品上市数', val: '3个', delta: '+1个', up: true },
        { name: '风险事件数', val: '0起', delta: '持平', up: null },
    ];
    var kpiGrid = document.getElementById('kpiGrid');
    kpiData.forEach(function(k) {
        var deltaClass = k.up === true ? 'up' : (k.up === false ? 'down' : '');
        var deltaSign = k.up === true ? '▲ ' : (k.up === false ? '▼ ' : '');
        kpiGrid.innerHTML +=
            '<div class="kpi-card" style="border-left-color:' + meta.color + '">' +
            '<div class="kpi-name">' + k.name + '</div>' +
            '<div><span class="kpi-val" style="color:' + meta.color + '">' + k.val + '</span></div>' +
            '<div class="kpi-delta ' + deltaClass + '">' + (k.up !== null ? deltaSign : '') + k.delta + '</div>' +
            '</div>';
    });

    // 渲染雷达图
    renderRadar(buId, meta, dims);

    // 渲染历史趋势
    renderHistory(buId, meta, history);
}

function adjustColor(hex, amount) {
    // 简单颜色变亮
    var num = parseInt(hex.replace('#', ''), 16);
    var r = Math.min(255, (num >> 16) + amount);
    var g = Math.min(255, ((num >> 8) & 0x00FF) + amount);
    var b = Math.min(255, (num & 0x0000FF) + amount);
    return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
}

function renderRadar(buId, meta, dims) {
    var dom = document.getElementById('radarChart');
    if (!dom) return;
    var chart = echarts.init(dom);

    var dimNames = ['D1战略达成', 'D2经营效益', 'D3客户认可', 'D4组织效能', 'D5创新研发', 'D6风险管控'];
    var vals = [dims.d1, dims.d2, dims.d3, dims.d4, dims.d5, dims.d6];

    var option = {
        tooltip: { trigger: 'item', confine: true },
        legend: { show: false },
        radar: {
            indicator: dimNames.map(function(n) { return { name: n, max: 100 }; }),
            radius: '62%',
            splitNumber: 4,
            axisName: { color: '#444', fontSize: 13, fontWeight: 'bold' },
            splitLine: { lineStyle: { color: '#e8ecf0' } },
            splitArea: { areaStyle: { color: ['#fff', '#fafafa'] } },
            axisLine: { lineStyle: { color: '#ddd' } },
        },
        series: [{
            type: 'radar',
            data: [{
                value: vals,
                name: meta.name,
                lineStyle: { color: meta.color, width: 2 },
                itemStyle: { color: meta.color },
                areaStyle: { color: meta.color, opacity: 0.15 },
                label: { show: true, formatter: '{c}', fontSize: 12, color: meta.color },
            }]
        }]
    };

    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
}

function renderHistory(buId, meta, history) {
    var dom = document.getElementById('historyChart');
    if (!dom) return;
    var chart = echarts.init(dom);

    var option = {
        tooltip: { trigger: 'axis', confine: true },
        grid: { left: 48, right: 20, top: 20, bottom: 40 },
        xAxis: {
            type: 'category',
            data: history.months.map(function(m) { return m.replace('-', '年') + '月'; }),
            axisLabel: { fontSize: 11, color: '#888' },
            axisLine: { lineStyle: { color: '#ddd' } },
        },
        yAxis: {
            type: 'value',
            min: 50,
            max: 100,
            axisLabel: { fontSize: 11, color: '#888' },
            splitLine: { lineStyle: { color: '#f0f0f0' } },
        },
        series: [{
            type: 'line',
            data: history.scores,
            smooth: true,
            lineStyle: { color: meta.color, width: 2 },
            itemStyle: { color: meta.color, borderWidth: 2 },
            areaStyle: { color: meta.color, opacity: 0.1 },
            label: { show: true, fontSize: 11, color: meta.color, position: 'top' },
            markLine: {
                silent: true,
                lineStyle: { color: '#aaa', type: 'dashed' },
                data: [{ yAxis: 80, name: '基准线' }]
            }
        }]
    };

    chart.setOption(option);
    window.addEventListener('resize', function() { chart.resize(); });
}

function switchTab(btn, tabId) {
    document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-' + tabId).classList.add('active');
    setTimeout(function() {
        document.querySelectorAll('.chart-container, .chart-wrap').forEach(function(c) {
            var chart = echarts.getInstanceByDom(c);
            if (chart) chart.resize();
        });
    }, 50);
}
</script>
</body>
</html>
