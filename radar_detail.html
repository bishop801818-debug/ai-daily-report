<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雷达看板 - 跳转中...</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f0f2f5; flex-direction: column; gap: 16px; }
        .msg { font-size: 16px; color: #64748B; }
        .links { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .links a { padding: 8px 16px; background: #3A6A9E; color: white; text-decoration: none; border-radius: 6px; font-size: 14px; }
        .links a:hover { background: #2a5490; }
    </style>
</head>
<body>
    <div class="msg" id="msg">正在跳转...</div>
    <div class="links">
        <a href="radar_detail_sdmd.html">山东美多</a>
        <a href="radar_detail_felt.html">法恩莱特</a>
        <a href="radar_detail_lhy.html">润滑油事业部</a>

    <script>
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id') || '';
        var dest = {
            'sdmd': 'radar_detail_sdmd.html',
            'felt':  'radar_detail_felt.html',
            'lhy':   'radar_detail_lhy.html',
            'lpsd':  'radar_detail_lpsd.html',
        };
        if (dest[id]) {
            document.getElementById('msg').textContent = '正在跳转到: ' + id.toUpperCase() + '...';
            window.location.replace(dest[id]);
        } else {
            document.getElementById('msg').textContent = '未知BU: "' + id + '"，请选择：';
        }
    </script>
