  var RADAR_DEPT_WHITELIST = ['od-839a5caffe1fa682e014982a1d28fcb8'];
  var RADAR_USERID_WHITELIST = ['7595021657568185305','7598822772604701656','7589910160420637874','7589938135119744185','7591392573697101019','7592890122870410205'];
  function isLocalPreview(){return location.protocol==='file:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'||location.hostname==='';}
  window.RADAR_UID_DECIDED=false; window.RADAR_UID_ALLOWED=false;
  function clearDeny(){var el=document.getElementById('radar_deny_overlay'); if(el&&el.parentNode)el.parentNode.removeChild(el);}
  function deny(){var ex=document.getElementById('radar_deny_overlay'); if(ex)return; function render(){var el=document.getElementById('radar_deny_overlay'); if(el)return; var d=document.createElement('div'); d.id='radar_deny_overlay'; d.style.cssText='position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:rgba(245,246,250,.98)'; d.innerHTML='<div style="text-align:center;padding:48px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)"><div style="font-size:64px;margin-bottom:12px">\uD83D\uDD12</div><div style="font-size:22px;font-weight:700;color:#c0392b">您的账号暂无权限浏览</div><div style="margin-top:8px;color:#888;font-size:14px">请联系管理员申请雷达看板访问权限。</div></div>'; (document.body||document.documentElement).appendChild(d);} if(document.body)render(); else document.addEventListener('DOMContentLoaded',render);}
  function decide(uid, deptIds){
    // 已放行则保持（幂等）
    if(window.RADAR_UID_DECIDED && window.RADAR_UID_ALLOWED) return;
    var deptOk = Array.isArray(deptIds) && deptIds.some(function(d){return RADAR_DEPT_WHITELIST.indexOf(d)>=0;});
    var allowed = (RADAR_UID_WHITELIST.indexOf(String(uid))>=0)||(RADAR_USERID_WHITELIST.indexOf(String(uid))>=0)||deptOk||isLocalPreview();
    // 之前若被拒（如首帧部门尚未补齐），本次部门命中则覆盖放行
    if(window.RADAR_UID_DECIDED && !window.RADAR_UID_ALLOWED && allowed){
      window.RADAR_UID_ALLOWED = true;
      document.documentElement.style.visibility='';
      clearDeny();
      return;
    }
    if(window.RADAR_UID_DECIDED) return;
    window.RADAR_UID_DECIDED = true;
    window.RADAR_UID_ALLOWED = allowed;
    document.documentElement.style.visibility='';
    if(!window.RADAR_UID_ALLOWED) deny();
  }
  document.documentElement.style.visibility='hidden';
  function getOpenId(){    try{var ssoRaw=localStorage.getItem('sso-user-info');if(ssoRaw){var sp=JSON.parse(ssoRaw);if(sp&&sp.open_id)return sp.open_id;}}catch(e){}    try{var uiRaw=localStorage.getItem('userInfo');if(uiRaw){var up=JSON.parse(uiRaw);if(up&&up.open_id)return up.open_id;}}catch(e){}    if(window.userInfo&&window.userInfo.open_id)return window.userInfo.open_id;    if(window.__context&&window.__context.user&&window.__context.user.open_id)return window.__context.user.open_id;    var um=location.hash.match(/[#&]uid=([^&]+)/)||location.search.match(/[?&]uid=([^&]+)/);    if(um)return decodeURIComponent(um[1]);    return '';  }  var s=getOpenId()||(window.userInfo&&window.userInfo.user_id)||window.userId||(window.__context&&window.__context.user&&window.__context.user.open_id)||'';
  if(s)decide(s);
  window.addEventListener('message',function(e){if(e.data&&e.data.type==='RADAR_AUTH'){window.__radar_auth_received=true;window.__radar_auth_empty=false;var _u=e.data.openId;var _usr=e.data.user;if(!_u&&_usr){_u=_usr.open_id||_usr.user_id||_usr.employee_id||_usr.union_id||'';}if(_u){if(window.__radar_auth_lock_timer){clearTimeout(window.__radar_auth_lock_timer);window.__radar_auth_lock_timer=null;}decide(_u,e.data.deptIds);}else{window.__radar_auth_empty=true;}}});
  try{if(window.parent&&window.parent!==window)window.parent.postMessage({type:'RADAR_REQUEST_AUTH'},'*');}catch(_){}
  window.__radar_auth_lock_timer=setTimeout(function(){if(!window.__radar_auth_received){decide('');}else if(window.__radar_auth_empty){window.__radar_auth_lock_timer=setTimeout(function(){decide('');},4000);}},1500);
})();
</script>
