    <script>
    (function(){
      // 集团领导白名单（与 D:/_pub_wsjrn4fj 后端 groupLeaderUsers 同步；
      //   妙搭壳侧应在 iframe URL 注入 ?__user=<userId>，本单边先加读分支）
      window.__GROUP_LEADER_IDS__ = window.__GROUP_LEADER_IDS__ || ['7595021657568185305', '1854251564037223'];
      function isGroupLeader(){
        // 既读 query 也读 hash（与 __dept 一致口径）
        var u=''; try{ u = new URLSearchParams(location.search).get('__user')||''; }catch(e){}
        if (!u) { try{ u = new URLSearchParams(location.hash.split(/\#/).filter(Boolean)[0]).get('__user')||''; }catch(e){} }
        return u && (window.__GROUP_LEADER_IDS__||[]).indexOf(u.trim()) >= 0;
      }
      // 创作者调试入口：URL 加 ?__leader=1 直接放行（与 auth_policy.js 的 ?__simulate_bu 同款思路）
      function isDebugLeader(){
        try {
          if (new URLSearchParams(location.search).get('__leader') === '1') return true;
          if (new URLSearchParams(location.hash.split(/\#/).filter(Boolean)[0]).get('__leader') === '1') return true;
        } catch(e){}
        return false;
      }
      window.addEventListener('load', function() {
        var buMatch = location.hash.match(/#([a-z]+)/);
        if (!buMatch) return;
        // ⚠️ 2026-09-17 13:05 收紧：仅「财务对标」（#xxx&_fin=1）路径触发拦截；
        // 其他事业部入口（#lpsd/#sdmd/...）继续开放，零影响。
        if (location.hash.indexOf('_fin=1') < 0) return;
        // 2026-09-17 15:00 修：本拦截器此前未读本地预览开关。
        // bu_gate.js 在 localhost/127.0.0.1/file: 下会置 __BU_GATE_ALLOW_ANON=true，
        // expand 页 guard 读了它（本地放行），本文件没读 → 本地打开同样 403，
        // 造成「本地预览被拦、线上却因别的原因表现不同」的错位。现与 guard 对齐。
        if (window.__BU_GATE_ALLOW_ANON) return;
        // 集团领导白名单穿透（独立于部门判断）
        if (isGroupLeader()) return;
        // 创作者调试入口（?__leader=1）
        if (isDebugLeader()) return;
        var rawBu = buMatch[1];
        var map = { lubricant:'lhy', kelan:'kls', dkhx:'dhx', sjld:'sjl' };
        var buId = map[rawBu] || rawBu;
        // 2026-09-18 修（czly 口径残留）：拒绝文案原写死「常州锂源事业部」，
        // 导致 lpsd/felt 同事被拒时看到别的事业部名。改为按当前 BU 取名。
        var GATE_BU_NAME = {
          czly:'常州锂源事业部', lpsd:'龙蟠时代事业部', sdmd:'山东美多事业部',
          sjld:'三金锂电事业部', felt:'法恩莱特事业部', dhx:'迪克化学事业部',
          lhy:'润滑油事业部', kls:'可兰素事业部', bych:'铂源催化事业部'
        };
        var buName = GATE_BU_NAME[buId] || '本事业部';
        // 2026-09-17 15:00 修（主因）：原实现只读 location.search（'?' 段），
        // 而 expand 页注入 iframe 时把 __dept 拼在 hash 里（'#czly&_fin=1&__dept=xxx'）
        // → 线上恒取不到身份 → 落 !deptId 分支 403 → 常州锂源本部门同事也被挡。
        // 现改为 query + hash 双读；hash 按 '#' 切段，兼容 '#__user=x#czly&_fin=1&__dept=y'。
        var deptId = (function(){
          function pick(src){
            var m = src.match(/[?&]__dept=([^&]+)/);
            if(m) return decodeURIComponent(m[1]);
            m = src.match(/[?&]departmentId=([^&]+)/);
            if(m) return decodeURIComponent(m[1]);
            return '';
          }
          var v = pick(location.search);
          if (v) return v;
          var segs = location.hash.split(/\#/).filter(Boolean);
          for (var i = 0; i < segs.length; i++) {
            v = pick('?' + segs[i]);
            if (v) return v;
          }
          // 2026-09-17 15:20 兜底：URL 完全不带身份时（expand 页「打开正式财务页」同标签跳转、
          // 用户手敲地址、刷新后参数丢失），复用 bu_gate.js 的完整解析 ——
          // 含 hash #dept=、?tier=<BU 代码>、以及 sessionStorage（妙搭壳注入身份时已写入）。
          try {
            if (typeof window.getCurrentDeptId === 'function') {
              v = window.getCurrentDeptId();
              if (v) return v;
            }
          } catch(e){}
          return '';
        })();
        if (!deptId) {
          // 无身份：iframe 内嵌场景下也视为拒绝（仅本路径生效）
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#f5f6fa"><div style="text-align:center;padding:48px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)"><div style="font-size:64px;margin-bottom:12px">⛔</div><div style="font-size:22px;font-weight:700;color:#c0392b">财务对标 · 无权限访问</div><div style="margin-top:8px;color:#888;font-size:14px">本模块仅向' + buName + ' + 集团领导开放，请通过妙搭首页进入。</div></div></div>';
          return;
        }
        var ids = (deptId||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
        // 2026-09-17 15:00 修：bu_gate.isAllowed(bu, ids) 期望的是 od-* 部门 ID，
        // 而妙搭壳 / expand 页注入的往往是 'czly' 这类 BU 速记令牌 →
        // 'czly' 不在 BU_DEPT['czly'] 的 od 数组里 → isAllowed 恒 false → 403。
        // 与 expand 页 guard 对齐：命中 本 BU 代号 / hq / all 直接放行
        // （本 BU 代号用 buId 动态判定，不写死某一个 BU）。
        // 2026-09-18 修（czly 口径残留）：删掉硬编码 'czly' ——
        // 原写法使 'czly' 令牌成为跨 BU 万能钥匙：`#felt&_fin=1&__dept=czly`
        // 会绕过下方 isAllowed('felt', ids) 直接放行（越权口子）。
        // 本 BU 速记令牌已由 ids.indexOf(buId) 覆盖，无需额外写死。
        if (ids.indexOf(buId) >= 0 || ids.indexOf('hq') >= 0 || ids.indexOf('all') >= 0) return;
        if (!isAllowed || !isAllowed(buId, ids)) {
          document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;background:#f5f6fa"><div style="text-align:center;padding:48px;background:#fff;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)"><div style="font-size:64px;margin-bottom:12px">⛔</div><div style="font-size:22px;font-weight:700;color:#c0392b">财务对标 · 无权限访问</div><div style="margin-top:8px;color:#888;font-size:14px">您所在的部门无权查看该内容，请联系管理员。</div></div></div>';
        }
      });
    })();
    </script>

// 安全图表初始化（防止重复初始化导致echarts崩溃）
// ════════════════════════════════════════════════════════
function safeInitChart(id) {
    var el = document.getElementById(id);
    if (!el) { console.warn('safeInitChart: element not found', id); return null; }
    var old = echarts.getInstanceByDom(el);
    if (old) old.dispose();
    return echarts.init(el);
}

function getDashboardEntities(data) {
    return data.entities || [
        { id:'czly', name:'常州锂源', color:'#1e3c72' },
        { id:'hnyn', name:'湖南裕能', color:'#6a9fd8' },
        { id:'wrxn', name:'万润新能', color:'#7f8c8d' },
        { id:'fljg', name:'富临精工', color:'#e67e22' },
        { id:'dfnm', name:'德方纳米', color:'#f56c6c' },
        { id:'avg', name:'行业均值', color:'#b0c4de', isAvg:true }
    ];
}

function renderCompareSelects(data, currentId) {
    var entities = getDashboardEntities(data);
    var selectable = entities.filter(function(e){ return !e.isBenchmark; });
    var peers = selectable.filter(function(e){ return e.id !== 'avg'; });
    var aEl = document.getElementById('compare-a');
    var bEl = document.getElementById('compare-b');
    if (!aEl || !bEl) return;
    function options(selected) {
        return selectable.map(function(e) {
            return '<option value="' + e.id + '"' + (e.id === selected ? ' selected' : '') + '>' + e.name + '</option>';
        }).join('');
    }
    aEl.innerHTML = options(currentId);
    var defaultPeer = (peers.filter(function(e){ return e.id !== currentId; })[0] || selectable[0]).id;
    bEl.innerHTML = options(defaultPeer);
}

function renderTrendMini(data) {
    var chart = echarts.init(document.getElementById('trend-mini-chart'));
    var quarters = data.quarters;
    var buId = window._curBuId || 'czly';
    var buName = (data.meta && data.meta[buId] && data.meta[buId].name) ? data.meta[buId].name : buId;
    // 计算当前BU综合得分（5维度均值）
    var buScores = quarters.map(function(q, i){
        var s = data.scores[buId];
        if (!s) return 0;
        return ((s.scale[i]+s.profit[i]+s.cost_eff[i]+s.finance[i]+s.growth[i])/5).toFixed(1)*1;
    });
    // 行业均值
    var avgScores = quarters.map(function(q, i){
        var s = data.scores.avg;
        return ((s.scale[i]+s.profit[i]+s.cost_eff[i]+s.finance[i]+s.growth[i])/5).toFixed(1)*1;
    });
    // 环比delta（显示在数据点上方）
    var deltaLabels = buScores.map(function(v, i){
        if (i === 0) return '';
        var d = (v - buScores[i-1]).toFixed(1);
        var sign = d > 0 ? '+' : '';
        return sign + d;
    });
    // 整体趋势：最后一季 vs 第一季
    var trendDir = buScores[buScores.length-1] - buScores[0];
    var trendColor = trendDir > 0 ? '#27ae60' : (trendDir < 0 ? '#e74c3c' : '#888');
    var trendArrow = trendDir > 0 ? '↑' : (trendDir < 0 ? '↓' : '→');
    var trendText = trendDir > 0 ? '整体上升' : (trendDir < 0 ? '整体下降' : '持平');
    // 最新环比
    var lastDelta = buScores.length > 1 ? (buScores[buScores.length-1] - buScores[buScores.length-2]).toFixed(1) : '0.0';
    var lastDeltaColor = lastDelta > 0 ? '#27ae60' : (lastDelta < 0 ? '#e74c3c' : '#888');
    var lastDeltaSign = lastDelta > 0 ? '+' : '';
    // 最大/最小
    var maxIdx = buScores.indexOf(Math.max.apply(null, buScores));
    var minIdx = buScores.indexOf(Math.min.apply(null, buScores));

    var option = {
        backgroundColor: 'transparent',
        grid: { top: 42, bottom: 28, left: 48, right: 18 },
        xAxis: {
            type: 'category', data: quarters,

                var qi = params[0].dataIndex;
                var v = params[0].value;
                var d = qi === 0 ? '' : '（环比' + (v - buScores[qi-1] > 0 ? '+' : '') + (v - buScores[qi-1]).toFixed(1) + '）';
                var html = '<strong>' + quarters[qi] + '</strong><br/>';
                html += '<span style="display:inline-block;width:10px;height:10px;background:' + params[0].color + ';border-radius:50%;margin-right:6px;"></span>';

function renderSignalBoard(data) {
    var board = document.getElementById('signal-board');
    var dims = [
        { key: 'scale',    name: '规模与市场地位' },
        { key: 'profit',   name: '盈利质量' },
        { key: 'cost_eff', name: '成本与效率' },
        { key: 'finance',  name: '运营与财务健康' },
        { key: 'growth',   name: '成长潜力' }
    ];
    var html = '';
    var last = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    // 动态修复data.current（原本硬编码为常州锂源，现改为当前BU）
    var _buId = window._curBuId || 'czly';
    ['scale','profit','cost_eff','finance','growth'].forEach(function(_dk) {
        data.current[_dk] = {
            val: data.scores[_buId][_dk][last],
            target: _dk==='growth'?7.0:5.0,
            mom: last>0 ? data.scores[_buId][_dk][last] - data.scores[_buId][_dk][last-1] : 0
        };
    });
    dims.forEach(function(d) {
        var cur = data.current[d.key];
        var pct = Math.round(cur.val / cur.target * 100);
        var avgVal = data.scores.avg[d.key][last];
        var diff = cur.val - avgVal;
        var cls = diff >= 0.5 ? 'green' : (diff >= -0.5 ? 'yellow' : 'red');
        var arrow = cur.mom >= 0 ? '↑' : '↓';
        html += '<div class="signal-card ' + cls + '" onclick="switchDim(\' + d.key + \')">';
        html += '<div class="signal-title">';
        html += '<span><span class="dot ' + cls + '"></span>' + d.name + '</span>';
        html += '<span class="signal-score">' + cur.val + '</span>';
        html += '</div>';
        html += '<div class="signal-bar-wrap"><div class="signal-bar ' + cls + '" style="width:' + Math.min(pct,100) + '%"></div></div>';
        html += '<div class="signal-meta">';
        html += '<span>目标 ' + cur.target + '</span>';
        html += '<span>行业均值 ' + avgVal.toFixed(1) + '</span>';
        html += '<span style="color:' + (cur.mom>=0?'#27ae60':'#e74c3c') + '">' + arrow + ' ' + Math.abs(cur.mom) + ' 较上季</span>';
        html += '</div></div>';
    });
    board.innerHTML = html;
}

function renderQuarterSelect(data) {
    // 更新按钮文字
    var isLatest = selectedQuarterIdx === null || selectedQuarterIdx === data.quarters.length - 1;
    var displayIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    document.getElementById('quarter-btn-text').textContent = data.quarters[displayIdx] + (isLatest ? '（最新）' : '');
    // 渲染popover选项
    var pop = document.getElementById('quarter-pop');
    var html = '';
    data.quarters.forEach(function(q, idx) {
        var isLast = idx === data.quarters.length - 1;
        var isActive = idx === displayIdx;
        html += '<div onclick="selectQuarterFromPop(' + idx + ')" style="padding:6px 16px;cursor:pointer;font-size:13px;color:' + (isActive ? '#fff' : 'rgba(255,255,255,0.7)') + ';background:' + (isActive ? 'rgba(255,255,255,0.15)' : 'transparent') + ';white-space:nowrap;" onmouseover="this.style.background=\'rgba(255,255,255,0.1)\'" onmouseout="this.style.background=\'' + (isActive ? 'rgba(255,255,255,0.15)' : 'transparent') + '\'">' + q + (isLast ? ' ✓' : '') + '</div>';
    });
    pop.innerHTML = html;
}

function toggleQuarterPop() {
    var pop = document.getElementById('quarter-pop');
    if (pop.style.display === 'block') {
        pop.style.display = 'none';
    } else {
        pop.style.display = 'block';
        // 点击外部关闭
        setTimeout(function() {
            var closeFn = function(e) {
                if (!document.getElementById('time-selector-wrap').contains(e.target)) {
                    pop.style.display = 'none';
                    document.removeEventListener('click', closeFn);
                }
            };
            document.addEventListener('click', closeFn);
        }, 10);
    }
}

function selectQuarterFromPop(idx) {
    selectedQuarterIdx = idx;
    var data = window.currentData;
    renderQuarterSelect(data);
    renderRadar(data);
    renderSignalBoard(data);
    renderDetailTable(data, currentDim);
    renderCompare();
    document.getElementById('quarter-pop').style.display = 'none';
}

function switchDim(dim) {
    currentDim = dim;
    document.querySelectorAll('.dim-chip').forEach(function(c){ c.classList.remove('active'); });
    document.querySelector('.dim-chip[data-dim="'+dim+'"]').classList.add('active');
    var data = window.currentData || BU_STRATEGY_DATA;
    renderDetailTable(data, dim);
}

function renderGenericDetailTable(data, dim) {
    var tableEl = document.getElementById('detail-table');
    var entities = getDashboardEntities(data);
    var peers = entities.filter(function(e){ return !e.isAvg && !e.isBenchmark; });
    var targetId = window._curBuId;
    var cfg = data.metrics[dim];
    var qIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    var target = entities.filter(function(e){ return e.id === targetId; })[0];
    function val(metric, id) { return metric.values[id][qIdx]; }
    function hasValue(value) { return typeof value === 'number' && isFinite(value); }
    function displayValue(value) { return hasValue(value) ? value : '—'; }
    function avg(metric) { return val(metric, 'avg'); }
    function rank(metric) {
        var values = peers.map(function(e){ return { id:e.id, value:val(metric,e.id) }; }).filter(function(v){ return hasValue(v.value); })
            .sort(function(a,b){ return metric.direction === 1 ? b.value-a.value : a.value-b.value; });
        var index = values.map(function(v){ return v.id; }).indexOf(targetId);
        return index === -1 ? null : index + 1;
    }
    function valueColor(metric) {
        var current = val(metric,targetId);
        return (metric.direction === 1 ? current >= avg(metric) : current <= avg(metric)) ? '#1e3c72' : '#a8c8e8';
    }
    function score(id) { return data.scores[id] && data.scores[id][dim] ? data.scores[id][dim][qIdx] : null; }
    function displayScore(id) { var value = score(id); return hasValue(value) ? value.toFixed(1) : '—'; }
    var html = '<h3 class="table-title">' + cfg.name + ' 维度分析</h3>';
    if (entities.some(function(e){ return e.isBenchmark; })) {
        html += '<div style="margin:0 0 10px;color:#637083;font-size:12px">注：标杆企业按其披露口径展示，不纳入当前同业均值、排名、雷达或评分。</div>';
    }
    html += '<div style="display:flex;gap:20px;align-items:flex-start;min-width:0;flex-wrap:nowrap">';
    html += '<table class="detail-table"><thead><tr><th>子指标</th>' + entities.map(function(e){return '<th>'+e.name+'</th>';}).join('') + '<th>权重</th><th>排名</th></tr></thead><tbody>';
    cfg.sub.forEach(function(metric) {
        var r = rank(metric);
        html += '<tr><td>' + metric.label + (metric.direction === -1 ? ' <span style="color:#a8c8e8;font-size:11px">↓反</span>' : '') + '</td>';
        entities.forEach(function(e) {
            var style = e.id === targetId ? ' style="color:'+valueColor(metric)+';font-weight:600"' : '';
            html += '<td' + style + '>' + displayValue(val(metric,e.id)) + (hasValue(val(metric,e.id)) ? ' ' + (e.unit || metric.unit) : '') + '</td>';
        });
        html += '<td>' + metric.w + '%</td><td style="color:' + (r===null?'#999':(r<=2?'#1e3c72':(r<=4?'#3a6bc5':'#a8c8e8'))) + ';font-weight:700">' + (r===null ? '—' : (r<=3 ? r+'名' : '垫底')) + '</td></tr>';
    });
    html += '<tr class="total-row"><td>维度综合得分</td>' + entities.map(function(e){
        var scoreValue = score(e.id);
        var color = e.id === targetId && hasValue(scoreValue) ? (scoreValue >= score('avg') ? '#1e3c72' : '#a8c8e8') : '';
        return '<td><b' + (color ? ' style="color:'+color+'"' : '') + '>' + displayScore(e.id) + '</b></td>';
    }).join('') + '<td></td><td></td></tr></tbody></table></div>';
    html += '<div style="display:flex;gap:12px;margin-top:16px;flex-wrap:nowrap"><div id="dim-chart-score" style="flex:1;min-width:0;height:380px"></div><div id="dim-chart-0" style="flex:1;min-width:0;height:380px"></div><div id="dim-chart-1" style="flex:1;min-width:0;height:380px"></div></div>';
    tableEl.innerHTML = html;

    function makeBar(title, rows, unit, vertical, avgLine) {
        var names = rows.map(function(r){return r.name;});
        var values = rows.map(function(r){return r.value;});
        var currentIdx = names.indexOf(target.name);
        var colors = values.map(function(v,i){ return names[i] === '行业均值' ? '#b0c4de' : (i === currentIdx ? '#1e3c72' : (v < 0 ? '#e74c3c' : '#6a9fd8')); });
        return {
            backgroundColor:'#fff', title:{text:title,left:'center',top:4,textStyle:{fontSize:12,fontWeight:'bold',color:'#1e3c72'}},
            tooltip:{trigger:'axis',axisPointer:{type:'shadow'},formatter:function(p){return '<strong>'+p[0].name+'</strong><br/>'+p[0].value+unit;}},
            grid:vertical ? {top:38,bottom:40,left:48,right:14,containLabel:true} : {top:38,bottom:28,left:72,right:35},
            xAxis:vertical ? {type:'category',data:names,axisLabel:{fontSize:9,rotate:20},axisTick:{show:false}} : {type:'value',min:0,axisLabel:{fontSize:9},splitLine:{lineStyle:{color:'#f2f2f2',type:'dashed'}}},
            yAxis:vertical ? {type:'value',axisLabel:{fontSize:9},splitLine:{lineStyle:{color:'#f2f2f2',type:'dashed'}}} : {type:'category',data:names,axisLabel:{fontSize:10},axisTick:{show:false}},
            series:[{type:'bar',barWidth:'55%',data:values.map(function(v,i){return {value:v,itemStyle:{color:colors[i],opacity:names[i]==='行业均值'?0.6:(i===currentIdx?1:0.75)}}; }),
                label:{show:true,position:vertical?'top':'right',fontSize:9,formatter:function(p){return p.value+unit;}},
                markLine:avgLine == null ? null : {silent:true,symbol:'none',data:[vertical ? {yAxis:avgLine,lineStyle:{color:'#b0c4de',type:'dashed'}} : {xAxis:avgLine,lineStyle:{color:'#b0c4de',type:'dashed'}}]}}
            ]
        };
    }
    var scoreRows = peers.map(function(e){return {name:e.name,value:score(e.id)};}).sort(function(a,b){return b.value-a.value;});
    var scoreChart = safeInitChart('dim-chart-score');
    scoreChart.setOption(makeBar(cfg.name+'得分排名', scoreRows, '分', false, score('avg')));
    cfg.sub.forEach(function(metric, idx) {
        var rows = peers.map(function(e){return {name:e.name,value:val(metric,e.id)};}).filter(function(row){ return hasValue(row.value); })
            .sort(function(a,b){return metric.direction===1 ? b.value-a.value : a.value-b.value;});
        rows.push({name:'行业均值',value:avg(metric)});
        var chart = safeInitChart(idx===0 ? 'dim-chart-0' : 'dim-chart-1');
        chart.setOption(makeBar(metric.label + '（' + (metric.direction===1?'越高越好':'越低越好') + '）', rows, metric.unit, true, avg(metric)));
    });
}

        return arr.indexOf(val) + 1;

    function rankColor(r) { return r<=2?'#1e3c72':(r<=4?'#3a6bc5':'#a8c8e8'); }

    html += '</div>';
    tableEl.innerHTML = tableEl.innerHTML.replace('</tbody></table>', '</tbody></table>') + html;

    function makeHorBarOpt(data, names, title, unit, avgLine, currentIdx, maxVal) {
        var markLine = avgLine != null ? {
            silent: true, symbol: 'none',
            data: [{ xAxis: avgLine, lineStyle: { color: '#b0c4de', type: 'dashed', width: 1.5 },
                    label: { show: true, position: 'end', formatter: '均值 ' + avgLine + (unit||''), fontSize: 9, color: '#888' } }]
        } : null;
        return {
            backgroundColor: '#fff',
            title: { text: title, textStyle: { fontSize: 12, fontWeight: 'bold', color: '#1e3c72' }, left: 'center', top: 4 },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    return '<strong>' + params[0].name + '</strong><br/>' + params[0].marker + ' ' + params[0].value + (unit||'');
                }
            },
            grid: { top: 36, bottom: 28, left: 70, right: 50, containLabel: false },
            xAxis: { type: 'value', max: maxVal || undefined, min: 0, axisLabel: { fontSize: 9 }, splitLine: { lineStyle: { color: '#f2f2f2', type: 'dashed' } } },
            yAxis: { type: 'category', data: names, axisLabel: { fontSize: 10 }, axisTick: { show: false } },
            series: [{
                type: 'bar', barWidth: '55%',
                data: data.map(function(v, i) {
                    var isAvg = names[i] === '行业均值';
                    return { value: v, itemStyle: { color: isAvg ? '#b0c4de' : (i === currentIdx ? C_DEEP : C_LIGHT), opacity: isAvg ? 0.6 : (i === currentIdx ? 1 : 0.75) } };
                }),
                label: { show: true, position: 'right', fontSize: 10, formatter: function(p) { return p.value + (unit||''); } },
                markLine: markLine
            }]
        };
    }

    function makeVertBarOpt(data, names, title, unit, avgLine, currentIdx, dir, allowNeg, extraMarkLines) {
        var currentName = names[currentIdx];
        var sorted = data.map(function(v,i){ return {v:v,i:i,n:names[i]}; })
            .filter(function(d){ return d.n !== '行业均值'; })
            .sort(function(a,b){ return dir===1 ? b.v-a.v : a.v-b.v; });
        var avgEntry = {v: data[names.indexOf('行业均值')], n:'行业均值', i: names.indexOf('行业均值')};
        var ordered = sorted.concat(avgEntry.v != null ? [avgEntry] : []);
        var oData = ordered.map(function(d){ return d.v; });
        var oNames = ordered.map(function(d){ return d.n; });
        var oCurrentIdx = oNames.indexOf(currentName);

        var markLines = [];
        if (avgLine != null) {
            markLines.push({ yAxis: avgLine, lineStyle: { color: '#b0c4de', type: 'dashed', width: 1.5 },
                label: { show: true, position: 'insideEndTop', fontSize: 10, color: '#fff', backgroundColor: 'rgba(106,159,216,0.85)', padding: [2,5,2,5], borderRadius: 3,
                    formatter: '均值 ' + avgLine + (unit||'') } });
        }
        if (allowNeg) {
            markLines.push({ yAxis: 0, lineStyle: { color: '#e74c3c', type: 'solid', width: 1.5 },
                label: { show: true, position: 'insideEndTop', fontSize: 10, color: '#fff', backgroundColor: 'rgba(231,76,60,0.85)', padding: [2,5,2,5], borderRadius: 3, formatter: '0' } });
        }
        if (extraMarkLines) extraMarkLines.forEach(function(m){ markLines.push(m); });

        return {
            backgroundColor: '#fff',
            title: { text: title, textStyle: { fontSize: 12, fontWeight: 'bold', color: '#1e3c72' }, left: 'center', top: 4 },
            tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    return '<strong>' + params[0].name + '</strong><br/>' + params[0].marker + ' ' + params[0].value + (unit||'');
                }
            },
            grid: { top: 36, bottom: 28, left: 50, right: 20, containLabel: true },
            xAxis: { type: 'category', data: oNames, axisLabel: { fontSize: 9, rotate: 20 }, axisTick: { show: false } },
            yAxis: {
                type: 'value',
                min: allowNeg ? null : 0,
                axisLabel: { fontSize: 9 },
                splitLine: { lineStyle: { color: '#f2f2f2', type: 'dashed' } }
            },
            series: [{
                type: 'bar', barWidth: '55%',
                data: oData.map(function(v, i) {
                    var name = oNames[i];
                    var isAvg = name === '行业均值';
                    var isNeg = v < 0;
                    var baseColor;
                    if (isAvg) {
                        baseColor = '#b0c4de';
                    } else if (i === oCurrentIdx) {
                        baseColor = C_DEEP;
                    } else if (isNeg) {
                        baseColor = '#e74c3c';
                    } else {
                        baseColor = C_LIGHT;
                    }
                    return { value: v, itemStyle: { color: baseColor, opacity: isAvg ? 0.6 : (i === oCurrentIdx ? 1 : 0.75) } };
                }),
                label: {
                    show: true, position: 'top', fontSize: 9,
                    formatter: function(p) { return (p.value < 0 ? '(' : '') + p.value + (unit||'') + (p.value < 0 ? ')' : ''); }
                },
                markLine: markLines.length ? { silent: true, symbol: 'none', data: markLines } : null
            }]
        };
    }

    // ── SCALE：综合得分排名 + 营业收入 + 总资产 ──
    if (dim === 'scale') {
        var cScore = safeInitChart('dim-chart-score'); if (!cScore) return;
        cScore.setOption(makeHorBarOpt(
            scoreRows.map(function(r){ return r.v; }),
            scoreRows.map(function(r){ return r.n; }),
            '规模维度得分排名', '分', scoreVals.avg, 0,
            Math.ceil(Math.max.apply(null, scoreRows.map(function(r){ return r.v; })) / 2) * 2 + 2
        ));
        window.addEventListener('resize', function(){ cScore.resize(); });

        var rev = cfg.sub[0];
        var revRows = buKeys.map(function(k,i){ return {v:rev[k], n:buNames[i]}; })
            .filter(function(d){ return d.n !== '行业均值'; })
            .sort(function(a,b){ return b.v - a.v; });
        var c0 = safeInitChart('dim-chart-0'); if (!c0) return;
        c0.setOption(makeHorBarOpt(
            revRows.map(function(r){ return r.v; }),
            revRows.map(function(r){ return r.n; }),
            '营业收入排名（亿元）', '亿', rev.avg, 0,
            Math.ceil(revRows[0].v / 50) * 50 + 30
        ));
        window.addEventListener('resize', function(){ c0.resize(); });

        var ast = cfg.sub[1];
        var astRows = buKeys.map(function(k,i){ return {v:ast[k], n:buNames[i]}; })
            .filter(function(d){ return d.n !== '行业均值'; })
            .sort(function(a,b){ return b.v - a.v; });
        var c1 = safeInitChart('dim-chart-1'); if (!c1) return;
        c1.setOption(makeHorBarOpt(
            astRows.map(function(r){ return r.v; }),
            astRows.map(function(r){ return r.n; }),
            '总资产排名（亿元）', '亿', ast.avg, 0,
            Math.ceil(astRows[0].v / 100) * 100 + 50
        ));
        window.addEventListener('resize', function(){ c1.resize(); });
    }

    // ── PROFIT：综合得分 + 哑铃图 + 净利率排名 ──
    else if (dim === 'profit') {
        var cScore = safeInitChart('dim-chart-score'); if (!cScore) return;
        cScore.setOption(makeHorBarOpt(
            scoreRows.map(function(r){ return r.v; }),
            scoreRows.map(function(r){ return r.n; }),

        ));
        window.addEventListener('resize', function(){ cScore.resize(); });

        var grossData = dimMap.profit.sub[0];

        });
        rawRows.sort(function(a, b) {
            if (a.name === '行业均值') return 1;
            if (b.name === '行业均值') return -1;
            return b.gross - a.gross;
        });
        var orderedNames = rawRows.map(function(r){ return r.name; });
        var orderedGross = rawRows.map(function(r){ return r.gross; });
        var orderedNet   = rawRows.map(function(r){ return r.net; });
        var diffLabels   = rawRows.map(function(r) {
            var d = r.gross - r.net;
            return (d >= 0 ? '+' : '') + d.toFixed(2) + 'pct';
        });
        var c0 = safeInitChart('dim-chart-0'); if (!c0) return;
        c0.setOption({
            backgroundColor: '#fff',
            title: { text: '毛利 → 净利差值（盈利能力结构）', textStyle: { fontSize: 12, fontWeight: 'bold', color: '#1e3c72' }, left: 'center', top: 4 },
            tooltip: {
                trigger: 'axis',
                formatter: function(params) {
                    var idx = params[0].dataIndex;
                    var r = rawRows[idx];
                    return '<strong>' + r.name + '</strong><br/>毛利率：<b>' + r.gross + '%</b><br/>净利率：<b>' + r.net + '%</b><br/>差值：<b>' + diffLabels[idx] + '</b>';
                }
            },
            grid: { top: 36, bottom: 28, left: 60, right: 60, containLabel: false },
            xAxis: { type: 'value', min: 0, max: 20, axisLabel: { fontSize: 9, formatter: '{value}%' }, splitLine: { lineStyle: { color: '#f2f2f2', type: 'dashed' } } },
            yAxis: { type: 'category', data: orderedNames, axisLabel: { fontSize: 10 }, axisTick: { show: false } },
            series: [
                { type: 'line', data: orderedGross.map(function(v,i){ return [[v, orderedNames[i]], [orderedNet[i], orderedNames[i]]]; }), lineStyle: { color: '#1e3c72', width: 2 }, itemStyle: { opacity: 0 }, symbol: 'none', tooltip: { show: false }, z: 1 },
                { type: 'scatter', name: '毛利率', data: orderedGross, symbolSize: 10, itemStyle: { color: '#1e3c72' }, label: { show: true, position: 'left', offset: [-4,0], fontSize: 9, color: '#1e3c72', formatter: function(p){ return p.value+'%'; } }, tooltip: { show: false }, z: 2 },
                { type: 'scatter', name: '净利率', data: orderedNet, symbolSize: 10, itemStyle: { color: '#6a9fd8' }, label: { show: true, position: 'right', offset: [4,0], fontSize: 9, color: '#6a9fd8', formatter: function(p){ return p.value+'%'; } }, tooltip: { show: false }, z: 2 },
                { type: 'scatter', name: '差值', data: orderedGross.map(function(v,i){ return (v+orderedNet[i])/2; }), symbolSize: 0, label: { show: true, position: 'right', fontSize: 9, color: '#888', formatter: function(p){ return diffLabels[p.dataIndex]; } }, tooltip: { show: false }, z: 3 }
            ]
        });
        window.addEventListener('resize', function(){ c0.resize(); });

        var net = dimMap.profit.sub[1];

            .filter(function(d){ return d.n !== '行业均值'; })
            .sort(function(a,b){ return b.v - a.v; });
        var c1 = safeInitChart('dim-chart-1'); if (!c1) return;
        c1.setOption(makeHorBarOpt(
            netRows.map(function(r){ return r.v; }),
            netRows.map(function(r){ return r.n; }),
            '净利率排名', '%', net.avg, 0,
            Math.ceil(netRows[0].v / 2) * 2 + 2
        ));
        window.addEventListener('resize', function(){ c1.resize(); });
    }

    // ── COST_EFF：综合得分 + 营业成本率 + 存货周转天数 ──
    else if (dim === 'cost_eff') {
        var ceScore = safeInitChart('dim-chart-score'); if (!ceScore) return;
        ceScore.setOption(makeHorBarOpt(
            scoreRows.map(function(r){ return r.v; }),
            scoreRows.map(function(r){ return r.n; }),
            '成本效率维度得分排名', '分', scoreVals.avg, 0,
            Math.ceil(Math.max.apply(null, scoreRows.map(function(r){ return r.v; })) / 2) * 2 + 2
        ));
        window.addEventListener('resize', function(){ ceScore.resize(); });

        var cost = dimMap.cost_eff.sub[0];
        var inv  = dimMap.cost_eff.sub[1];
        var c0 = safeInitChart('dim-chart-0'); if (!c0) return;
        c0.setOption(makeVertBarOpt(
            [cost.czly, cost.hnyn, cost.wrxn, cost.fljg, cost.dfnm, cost.avg],
            buNames, '营业成本率（%，越低越好）', '%', cost.avg, 0, -1, false
        ));
        window.addEventListener('resize', function(){ c0.resize(); });

        var c1 = safeInitChart('dim-chart-1'); if (!c1) return;
        c1.setOption(makeVertBarOpt(
            [inv.czly, inv.hnyn, inv.wrxn, inv.fljg, inv.dfnm, inv.avg],
            buNames, '存货周转天数（天，越短越好）', '天', inv.avg, 0, -1, false
        ));
        window.addEventListener('resize', function(){ c1.resize(); });
    }

    // ── FINANCE：综合得分 + 资产负债率 + 经营现金流/营收 ──
    else if (dim === 'finance') {
        var finScore = safeInitChart('dim-chart-score'); if (!finScore) return;
        finScore.setOption(makeHorBarOpt(
            scoreRows.map(function(r){ return r.v; }),
            scoreRows.map(function(r){ return r.n; }),
            '财务健康维度得分排名', '分', scoreVals.avg, 0,

            [debt.czly, debt.hnyn, debt.wrxn, debt.fljg, debt.dfnm, debt.avg],
            buNames, '资产负债率（%，越低越好）', '%', debt.avg, 0, -1, false,
            [{ yAxis: 70, lineStyle: { color: '#e74c3c', type: 'solid', width: 2 },
              label: { show: true, position: 'insideEndTop', formatter: '▶ 警戒70%', fontSize: 11, color: '#fff', backgroundColor: 'rgba(231,76,60,0.85)', padding: [2,6,2,6], borderRadius: 3 } }]
        ));
        window.addEventListener('resize', function(){ c0.resize(); });

        var c1 = safeInitChart('dim-chart-1'); if (!c1) return;
        c1.setOption(makeVertBarOpt(
            [cash.czly, cash.hnyn, cash.wrxn, cash.fljg, cash.dfnm, cash.avg],
            buNames, '经营现金流/营收（%，越高越好，负值=失血）', '%', cash.avg, 0, 1, true
        ));
        window.addEventListener('resize', function(){ c1.resize(); });
    }

    // ── GROWTH：综合得分 + 营收同比增长率 + 研发费用率 ──
    else if (dim === 'growth') {
        var grScore = safeInitChart('dim-chart-score'); if (!grScore) return;
        grScore.setOption(makeHorBarOpt(
            scoreRows.map(function(r){ return r.v; }),
            scoreRows.map(function(r){ return r.n; }),
            '成长潜力维度得分排名', '分', scoreVals.avg, 0,
            Math.ceil(Math.max.apply(null, scoreRows.map(function(r){ return r.v; })) / 2) * 2 + 2
        ));
        window.addEventListener('resize', function(){ grScore.resize(); });

        var revg = dimMap.growth.sub[0];
        var rd   = dimMap.growth.sub[1];
        var c0 = safeInitChart('dim-chart-0'); if (!c0) return;
        c0.setOption(makeVertBarOpt(
            [revg.czly, revg.hnyn, revg.wrxn, revg.fljg, revg.dfnm, revg.avg],

        ));
        window.addEventListener('resize', function(){ c0.resize(); });

        var c1 = safeInitChart('dim-chart-1'); if (!c1) return;
        c1.setOption(makeVertBarOpt(
            [rd.czly, rd.hnyn, rd.wrxn, rd.fljg, rd.dfnm, rd.avg],
            buNames, '研发费用率（%，越高越好）', '%', rd.avg, 0, 1, false
        ));
        window.addEventListener('resize', function(){ c1.resize(); });
    }
}

function renderCompare() {

function toggleExportPop() {
    var pop = document.getElementById('export-pop');
    if (pop.style.display === 'block') {
        pop.style.display = 'none';
    } else {
        pop.style.display = 'block';
        setTimeout(function() {
            var closeFn = function(e) {
                if (!e.target.closest('#export-pop') && !e.target.closest('.btn-export')) {
                    pop.style.display = 'none';
                    document.removeEventListener('click', closeFn);
                }
            };
            document.addEventListener('click', closeFn);
        }, 10);
    }
}

function exportExcel() {
    document.getElementById('export-pop').style.display = 'none';
    var data = window.currentData;
    if (!data) return;
    var buId = window._curBuId || new URLSearchParams(location.search).get('id') || 'czly';
    var wb = XLSX.utils.book_new();

    // Sheet1: 战略维度得分
    var dimKeys = ['scale','profit','cost_eff','finance','growth'];
    var dimNames = ['规模与市场地位','盈利质量','成本与效率','运营与财务健康','成长潜力'];
    var qIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    var exportEntities = getDashboardEntities(data);
    var ws1Data = [['维度'].concat(exportEntities.map(function(e){ return e.name; }))];
    dimKeys.forEach(function(k, i) {
        ws1Data.push([dimNames[i]].concat(exportEntities.map(function(e){ return data.scores[e.id][k][qIdx]; })));
    });
    var ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
    XLSX.utils.book_append_sheet(wb, ws1, '战略维度得分');

    // Sheet2: 详细指标（从当前表格提取）
    var tableEl = document.getElementById('detail-table');
    if (tableEl) {
        var ws2 = XLSX.utils.table_to_sheet(tableEl);
        XLSX.utils.book_append_sheet(wb, ws2, '详细指标');
    }

    var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var blob = new Blob([wbout], { type: 'application/octet-stream' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    var d = new Date();
    link.download = '战略洞察_' + buId + '_' + d.getFullYear() + (d.getMonth()+1) + d.getDate() + '.xlsx';
    link.click();
    URL.revokeObjectURL(link.href);
}

function exportPDF() {
    document.getElementById('export-pop').style.display = 'none';
    var el = document.getElementById('dashboard-page');
    var btn = document.querySelector('.btn-export');
    var origText = btn.textContent;
    btn.textContent = '正在生成PDF...';
    html2canvas(el, { scale: 1.5, useCORS: true, logging: false, backgroundColor: '#f4f6fa' }).then(function(canvas) {
        var imgData = canvas.toDataURL('image/jpeg', 0.85);
        var pdf = new window.jspdf.jsPDF('l', 'mm', 'a4');
        var pdfW = pdf.internal.pageSize.getWidth() - 20;
        var imgH = canvas.height * pdfW / canvas.width;
        var maxH = pdf.internal.pageSize.getHeight() - 20;
        if (imgH > maxH) imgH = maxH;
        pdf.addImage(imgData, 'JPEG', 10, 10, pdfW, imgH);
        pdf.save('战略洞察报告.pdf');
        btn.textContent = origText;
    }).catch(function() {
        btn.textContent = origText;
        alert('PDF生成失败，请重试');
    });
}
