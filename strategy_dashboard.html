<script>
var currentDim = 'scale';
var selectedQuarterIdx = null;  // null=最新季度

function initRouter() {
    var params = new URLSearchParams(location.search);
    var buId = params.get('id') || 'czly';
    renderDashboard(buId);
}

function renderDashboard(buId) {
    var data = BU_STRATEGY_DATA;
    window.currentData = data;
    selectedQuarterIdx = data.quarters.length - 1; // 默认最新季度
    var meta = {
        czly: { name: '常州锂源', sub: '磷酸铁锂事业部' },
        hnyn: { name: '湖南裕能', sub: '磷酸铁锂事业部' },
        wrxn: { name: '万润新能', sub: '磷酸铁锂事业部' }
    };
    var m = meta[buId] || meta['czly'];
    document.getElementById('bu-title').textContent = m.name + ' · 战略洞察';
    document.getElementById('bu-title2').textContent = m.name + ' · 战略洞察';
    document.getElementById('bu-sub').textContent = m.sub;
    document.getElementById('update-time').textContent = '数据更新：' + data.update_time;
    renderQuarterSelect(data);
    renderRadar(data);
    renderTrendMini(data);
    renderSignalBoard(data);
    renderDetailTable(data, currentDim);
    renderCompare(data);
}

function renderRadar(data) {
    var chart = echarts.init(document.getElementById('radar-chart'));
    var dimKeys = ['scale','profit','cost_eff','finance','growth'];
    var dimNames = ['规模与市场地位','盈利质量','成本与效率','运营与财务健康','成长潜力'];
    var qIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    var option = {
        backgroundColor: '#fff',
        legend: { data: ['常州锂源','湖南裕能','万润新能','行业均值'], bottom: 0, textStyle: { fontSize: 12 } },
        tooltip: {
            trigger: 'item',
            formatter: function(params) {
                var dimIdx = params.dataIndex !== undefined ? params.dataIndex : 0;
                var dimName = dimNames[dimIdx];
                var html = '<strong style="font-size:13px">' + dimName + '</strong><br/>';
                var keys = ['czly','hnyn','wrxn','avg'];
                var names = ['常州锂源','湖南裕能','万润新能','行业均值'];
                keys.forEach(function(k, ki) {
                    var val = data.scores[k][dimKeys[dimIdx]][qIdx];
                    var diffStr = '';
                    if (ki !== 3) {
                        var avgVal = data.scores.avg[dimKeys[dimIdx]][qIdx];
                        var diff = (val - avgVal).toFixed(1);
                        diffStr = ' <span style="color:' + (diff >= 0 ? '#1e3c72' : '#a8c8e8') + '">(' + (diff >= 0 ? '+' : '') + diff + ')</span>';
                    }
                    html += '<span style="display:inline-block;margin-right:8px">' + names[ki] + ':</span>' + val.toFixed(1) + '/10' + diffStr + '<br/>';
                });
                return html;
            }
        },
        radar: {
            indicator: dimKeys.map(function(k,i){ return { name: dimNames[i], max: 10 }; }),
            shape: 'polygon', splitNumber: 5,
            axisName: { color: '#333', fontSize: 12 },
            splitLine: { lineStyle: { color: '#e0e0e0' } },
            splitArea: { areaStyle: { color: ['#fafafa','#f5f5f5','#f0f0f0','#ebebeb','#e5e5e5'] } },
            axisLine: { lineStyle: { color: '#ccc' } }
        },
        series: [{
            type: 'radar',
            data: [
                { value: dimKeys.map(function(k){ return data.scores.czly[k][qIdx]; }), name: '常州锂源',
                  areaStyle: { color: 'rgba(30,60,114,0.25)' }, lineStyle: { color: '#1e3c72', width: 2 }, itemStyle: { color: '#1e3c72' } },
                { value: dimKeys.map(function(k){ return data.scores.hnyn[k][qIdx]; }), name: '湖南裕能',
                  lineStyle: { color: '#6a9fd8', width: 1.5, type: 'dashed' }, itemStyle: { color: '#6a9fd8' } },
                { value: dimKeys.map(function(k){ return data.scores.wrxn[k][qIdx]; }), name: '万润新能',
                  lineStyle: { color: '#7f8c8d', width: 1.5, type: 'dashed' }, itemStyle: { color: '#7f8c8d' } },
                { value: dimKeys.map(function(k){ return data.scores.avg[k][qIdx]; }), name: '行业均值',
                  lineStyle: { color: '#b0c4de', width: 1, type: 'dotted' }, itemStyle: { color: '#b0c4de' } }
            ]
        }]
    };
    chart.setOption(option);
    chart.on('click', function(params) {
        if (params.componentType === 'series' && params.dataIndex !== undefined && params.dataIndex < dimKeys.length) {
            var dimKey = dimKeys[params.dataIndex];
            switchDim(dimKey);
            setTimeout(function() {
                var el = document.getElementById('detail-table');
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }
    });
    window.addEventListener('resize', function(){ chart.resize(); });
}

function renderTrendMini(data) {
    var chart = echarts.init(document.getElementById('trend-mini-chart'));
    var quarters = data.quarters;
    var czlyScores = quarters.map(function(q, i){
        var s = data.scores.czly;
        return ((s.scale[i]+s.profit[i]+s.cost_eff[i]+s.finance[i]+s.growth[i])/5).toFixed(1)*1;
    });
    var avgScores = quarters.map(function(q, i){
        var s = data.scores.avg;
        return ((s.scale[i]+s.profit[i]+s.cost_eff[i]+s.finance[i]+s.growth[i])/5).toFixed(1)*1;
    });
    // 找极值
    var maxIdx = czlyScores.indexOf(Math.max.apply(null, czlyScores));
    var minIdx = czlyScores.indexOf(Math.min.apply(null, czlyScores));
    var option = {
        backgroundColor: 'transparent',
        grid: { top: 32, bottom: 20, left: 40, right: 12 },
        xAxis: { type: 'category', data: quarters, axisLabel: { fontSize: 9, color: '#999' }, axisLine: { lineStyle: { color: '#eee' } }, axisTick: { show: false } },
        yAxis: { type: 'value', min: 0, max: 10, axisLabel: { fontSize: 9, color: '#999' }, splitLine: { lineStyle: { color: '#f0f0f0' } }, name: '综合得分', nameTextStyle: { fontSize: 9 } },
        tooltip: {
            trigger: 'axis',
            formatter: function(params) {
                var qi = params[0].dataIndex;
                var html = '<strong>' + quarters[qi] + '</strong><br/>';
                params.forEach(function(p) {
                    html += '<span style="display:inline-block;width:10px;height:10px;background:' + p.color + ';border-radius:50%;margin-right:6px;"></span>';
                    html += p.seriesName + '：<b>' + p.value.toFixed(1) + '</b><br/>';
                });
                return html;
            }
        },
        series: [
            {
                name: '常州锂源', type: 'line', data: czlyScores, smooth: true,
                areaStyle: { color: { type: 'linear', x:0, y:0, x2:0, y2:1, colorStops: [{ offset:0, color:'rgba(30,60,114,0.4)' },{ offset:1, color:'rgba(30,60,114,0.05)' }] } },
                lineStyle: { color: '#1e3c72', width: 2 },
                itemStyle: { color: '#1e3c72' },
                symbol: 'circle', symbolSize: function(val, params) { return params.dataIndex === maxIdx || params.dataIndex === minIdx ? 8 : 4; },
                markPoint: {
                    symbol: 'circle',
                    symbolSize: 28,
                    label: { fontSize: 11, fontWeight: 'bold', color: '#fff', offset: [0, -2] },
                    data: [
                        { type: 'max', name: '最高', itemStyle: { color: '#1e3c72' } },
                        { type: 'min', name: '最低', itemStyle: { color: '#a8c8e8' } }
                    ]
                }
            },
            {
                name: '行业均值', type: 'line', data: avgScores, smooth: true,
                lineStyle: { color: '#6a9fd8', width: 2, type: 'dashed' },
                itemStyle: { color: '#6a9fd8' },
                symbol: 'circle', symbolSize: 3,
                areaStyle: null
            }
        ]
    };
    chart.setOption(option);
    chart.on('click', function(params) {
        if (params.componentType === 'series' && params.dataIndex !== undefined) {
            selectedQuarterIdx = params.dataIndex;
            renderQuarterSelect(data);
            renderRadar(data);
            // renderTrendMini不重刷，避免死循环
        }
    });
    window.addEventListener('resize', function(){ chart.resize(); });
}

function renderSignalBoard(data) {
    var board = document.getElementById('signal-board');
    var dims = [
        { key: 'scale',    name: '规模与市场地位' },
        { key: 'profit',   name: '盈利质量' },
        { key: 'cost_eff', name: '成本与效率' },
        { key: 'finance',  name: '运营与财务健康' },
        { key: 'growth',   name: '成长潜力' }
    ];
    var html = '';
    var last = data.quarters.length - 1;
    dims.forEach(function(d) {
        var cur = data.current[d.key];
        var pct = Math.round(cur.val / cur.target * 100);
        var avgVal = data.scores.avg[d.key][last];
        var diff = cur.val - avgVal;
        var cls = diff >= 0.5 ? 'green' : (diff >= -0.5 ? 'yellow' : 'red');
        var arrow = cur.mom >= 0 ? '↑' : '↓';
        html += '<div class="signal-card ' + cls + '" onclick="switchDim(\' + d.key + \')">';
        html += '<div class="signal-title">';
        html += '<span><span class="dot ' + cls + '"></span>' + d.name + '</span>';
        html += '<span class="signal-score">' + cur.val + '</span>';
        html += '</div>';
        html += '<div class="signal-bar-wrap"><div class="signal-bar ' + cls + '" style="width:' + Math.min(pct,100) + '%"></div></div>';
        html += '<div class="signal-meta">';
        html += '<span>目标 ' + cur.target + '</span>';
        html += '<span>行业均值 ' + avgVal.toFixed(1) + '</span>';
        html += '<span style="color:' + (cur.mom>=0?'#27ae60':'#e74c3c') + '">' + arrow + ' ' + Math.abs(cur.mom) + ' 较上季</span>';
        html += '</div></div>';
    });
    board.innerHTML = html;
}

function renderQuarterSelect(data) {
    // 更新按钮文字
    var isLatest = selectedQuarterIdx === null || selectedQuarterIdx === data.quarters.length - 1;
    var displayIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    document.getElementById('quarter-btn-text').textContent = data.quarters[displayIdx] + (isLatest ? '（最新）' : '');
    // 渲染popover选项
    var pop = document.getElementById('quarter-pop');
    var html = '';
    data.quarters.forEach(function(q, idx) {
        var isLast = idx === data.quarters.length - 1;
        var isActive = idx === displayIdx;
        html += '<div onclick="selectQuarterFromPop(' + idx + ')" style="padding:6px 16px;cursor:pointer;font-size:13px;color:' + (isActive ? '#fff' : 'rgba(255,255,255,0.7)') + ';background:' + (isActive ? 'rgba(255,255,255,0.15)' : 'transparent') + ';white-space:nowrap;" onmouseover="this.style.background=\'rgba(255,255,255,0.1)\'" onmouseout="this.style.background=\'' + (isActive ? 'rgba(255,255,255,0.15)' : 'transparent') + '\'">' + q + (isLast ? ' ✓' : '') + '</div>';
    });
    pop.innerHTML = html;
}

function toggleQuarterPop() {
    var pop = document.getElementById('quarter-pop');
    if (pop.style.display === 'block') {
        pop.style.display = 'none';
    } else {
        pop.style.display = 'block';
        // 点击外部关闭
        setTimeout(function() {
            var closeFn = function(e) {
                if (!document.getElementById('time-selector-wrap').contains(e.target)) {
                    pop.style.display = 'none';
                    document.removeEventListener('click', closeFn);
                }
            };
            document.addEventListener('click', closeFn);
        }, 10);
    }
}

function selectQuarterFromPop(idx) {
    selectedQuarterIdx = idx;
    var data = window.currentData;
    renderQuarterSelect(data);
    renderRadar(data);
    renderTrendMini(data);
    document.getElementById('quarter-pop').style.display = 'none';
}

function switchDim(dim) {
    currentDim = dim;
    document.querySelectorAll('.dim-chip').forEach(function(c){ c.classList.remove('active'); });
    document.querySelector('.dim-chip[data-dim="'+dim+'"]').classList.add('active');
    var data = BU_STRATEGY_DATA;
    renderDetailTable(data, dim);
}

function renderDetailTable(data, dim) {
    var tableEl = document.getElementById('detail-table');
    // 定义每个子指标的方向：1=正向（越高越好），-1=反向（越低越好，展示时取反）
    var dirMap = {
        '营业收入': 1, '总资产': 1,
        '毛利率': 1, '净利率': 1,
        '营业成本率': -1, '存货周转天数': -1,
        '资产负债率': -1, '经营现金流/营收': -1,
        '营收同比增长率': 1, '研发费用率': 1
    };
    var dimMap = {
        scale: {
            name: '规模与市场地位',
            sub: [
                { label:'营业收入', unit:'亿元', w:50, czly:10.13, hnyn:28.2, wrxn:9.8, avg:15.5 },
                { label:'总资产', unit:'亿元', w:50, czly:146.17, hnyn:85.0, wrxn:60.0, avg:90.0 }
            ]
        },
        profit: {
            name: '盈利质量',
            sub: [
                { label:'毛利率', unit:'%', w:50, czly:9.54, hnyn:15.2, wrxn:10.8, avg:12.8 },
                { label:'净利率', unit:'%', w:50, czly:5.3, hnyn:10.2, wrxn:7.8, avg:8.8 }
            ]
        },
        cost_eff: {
            name: '成本与效率',
            sub: [
                { label:'营业成本率', unit:'%', w:50, czly:90.46, hnyn:84.8, wrxn:89.2, avg:88.0 },
                { label:'存货周转天数', unit:'天', w:50, czly:70.28, hnyn:65.0, wrxn:75.0, avg:70.0 }
            ]
        },
        finance: {
            name: '运营与财务健康',
            sub: [
                { label:'资产负债率', unit:'%', w:50, czly:87.7, hnyn:55.0, wrxn:60.0, avg:65.0 },
                { label:'经营现金流/营收', unit:'%', w:50, czly:-32.5, hnyn:5.0, wrxn:-5.0, avg:0.0 }
            ]
        },
        growth: {
            name: '成长潜力',
            sub: [
                { label:'营收同比增长率', unit:'%', w:50, czly:0, hnyn:30.0, wrxn:22.0, avg:25.0 },
                { label:'研发费用率', unit:'%', w:50, czly:2.53, hnyn:4.0, wrxn:3.8, avg:3.5 }
            ]
        }
    };
    var cfg = dimMap[dim];
    var last = data.quarters.length - 1;
    var scoreVals = {
        czly: data.scores.czly[dim][last],
        hnyn: data.scores.hnyn[dim][last],
        wrxn: data.scores.wrxn[dim][last],
        avg:  data.scores.avg[dim][last]
    };
    // 计算排名：正向指标降序，反向指标升序
    function getRank(val, arr, dir) {
        if (dir === 1) {
            arr.sort(function(a,b){ return b-a; });
        } else {
            arr.sort(function(a,b){ return a-b; });
        }
        return arr.indexOf(val) + 1;
    }
    // 颜色辅助：排名颜色、数值颜色
    function rankColor(r) { return r<=2?'#1e3c72':(r===3?'#3a6bc5':'#a8c8e8'); }
    function valColor(v, avgV, dir) {
        if (dir===1) return v>=avgV ? '#1e3c72' : '#a8c8e8';
        else return v<=avgV ? '#1e3c72' : '#a8c8e8';
    }
    var html = '<h3 class="table-title">' + cfg.name + ' 维度分析</h3>';
    html += '<div style="display:flex;gap:20px;align-items:flex-start;min-width:0;flex-wrap:nowrap">';
    html += '<table class="detail-table"><thead><tr><th>子指标</th><th>常州锂源</th><th>湖南裕能</th><th>万润新能</th><th>行业均值</th><th>权重</th><th>排名</th></tr></thead><tbody>';
    cfg.sub.forEach(function(s) {
        var dir = dirMap[s.label];
        var vals = [s.czly, s.hnyn, s.wrxn];
        var r = getRank(s.czly, vals.slice(), dir);
        var vc = valColor(s.czly, s.avg, dir);
        html += '<tr>';
        html += '<td>' + s.label + (dir===-1?' <span style="color:#a8c8e8;font-size:11px">↓反</span>':'') + '</td>';
        html += '<td style="color:' + vc + ';font-weight:600">' + s.czly + ' ' + s.unit + '</td>';
        html += '<td>' + s.hnyn + ' ' + s.unit + '</td>';
        html += '<td>' + s.wrxn + ' ' + s.unit + '</td>';
        html += '<td>' + s.avg + ' ' + s.unit + '</td>';
        html += '<td>' + s.w + '%</td>';
        html += '<td style="color:' + rankColor(r) + ';font-weight:700">' + (r<=3?r+'名':'垫底') + '</td>';
        html += '</tr>';
    });
    html += '<tr class="total-row"><td>维度综合得分</td>';
    html += '<td><b style="color:' + (scoreVals.czly>=scoreVals.avg?'#1e3c72':'#a8c8e8') + '">' + scoreVals.czly.toFixed(1) + '</b></td>';
    html += '<td><b>' + scoreVals.hnyn.toFixed(1) + '</b></td>';
    html += '<td><b>' + scoreVals.wrxn.toFixed(1) + '</b></td>';
    html += '<td><b>' + scoreVals.avg.toFixed(1) + '</b></td><td></td><td></td></tr></tbody></table>';
    html += '<div id="dim-bar-chart" style="width:360px;height:220px;flex-shrink:0;min-width:360px"></div></div>';
    tableEl.innerHTML = html;
    var barChart = echarts.init(document.getElementById('dim-bar-chart'));
    barChart.setOption({
        backgroundColor: '#fff',
        tooltip: { trigger: 'axis' },
        legend: { bottom: 0, textStyle: { fontSize: 11 } },
        grid: { top: 10, bottom: 30, left: 60, right: 20 },
        xAxis: { type: 'category', data: ['常州锂源','湖南裕能','万润新能','行业均值'], axisLabel: { fontSize: 10 } },
        yAxis: { type: 'value', max: 10, axisLabel: { fontSize: 10 }, splitLine: { lineStyle: { color: '#f0f0f0' } } },
        series: [{ name: cfg.name, type: 'bar',
            data: [scoreVals.czly, scoreVals.hnyn, scoreVals.wrxn, scoreVals.avg],
            itemStyle: { color: function(p){ return p.dataIndex === 0 ? '#1e3c72' : '#6a9fd8'; } },
            barWidth: '40%' }]
    });
    window.addEventListener('resize', function(){ barChart.resize(); });
}

function renderCompare() {
    var data = window.currentData;
    if (!data) return;
    var a = document.getElementById('compare-a').value;
    var b = document.getElementById('compare-b').value;
    var dimKeys = ['scale','profit','cost_eff','finance','growth'];
    var dimNames = ['规模与市场地位','盈利质量','成本与效率','运营与财务健康','成长潜力'];
    var last = data.quarters.length - 1;
    var aScores = dimKeys.map(function(dk){ return data.scores[a][dk][last]; });
    var bScores = dimKeys.map(function(dk){ return data.scores[b][dk][last]; });
    var chart = echarts.init(document.getElementById('compare-chart'));
    var opt = {
        backgroundColor:'#fff',
        tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
        legend:{bottom:0,textStyle:{fontSize:11}},
        grid:{top:10,bottom:30,left:100,right:80},
        yAxis:{type:'category',data:dimNames,axisLabel:{fontSize:11}},
        xAxis:{type:'value',max:10,min:0,axisLabel:{fontSize:10}},
        series:[
            {name:document.getElementById('compare-a').options[document.getElementById('compare-a').selectedIndex].text,type:'bar',data:aScores,barWidth:'35%',
             itemStyle:{color:'#1e3c72'},
             label:{show:true,position:'right',fontSize:11,formatter:'{c}'}},
            {name:document.getElementById('compare-b').options[document.getElementById('compare-b').selectedIndex].text,type:'bar',data:bScores,barWidth:'35%',
             itemStyle:{color:'#6a9fd8'},
             label:{show:true,position:'right',fontSize:11,formatter:'{c}'}}
        ]
    };
    chart.setOption(opt);
    window.addEventListener('resize',function(){chart.resize();});
}

function toggleExportPop() {
    var pop = document.getElementById('export-pop');
    if (pop.style.display === 'block') {
        pop.style.display = 'none';
    } else {
        pop.style.display = 'block';
        setTimeout(function() {
            var closeFn = function(e) {
                if (!e.target.closest('#export-pop') && !e.target.closest('.btn-export')) {
                    pop.style.display = 'none';
                    document.removeEventListener('click', closeFn);
                }
            };
            document.addEventListener('click', closeFn);
        }, 10);
    }
}

function exportExcel() {
    document.getElementById('export-pop').style.display = 'none';
    var data = window.currentData;
    if (!data) return;
    var buId = new URLSearchParams(location.search).get('id') || 'czly';
    var wb = XLSX.utils.book_new();

    // Sheet1: 战略维度得分
    var dimKeys = ['scale','profit','cost_eff','finance','growth'];
    var dimNames = ['规模与市场地位','盈利质量','成本与效率','运营与财务健康','成长潜力'];
    var qIdx = selectedQuarterIdx !== null ? selectedQuarterIdx : data.quarters.length - 1;
    var ws1Data = [['维度','常州锂源','湖南裕能','万润新能','行业均值']];
    dimKeys.forEach(function(k, i) {
        ws1Data.push([dimNames[i], data.scores.czly[k][qIdx], data.scores.hnyn[k][qIdx], data.scores.wrxn[k][qIdx], data.scores.avg[k][qIdx]]);
    });
    var ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
    XLSX.utils.book_append_sheet(wb, ws1, '战略维度得分');

    // Sheet2: 详细指标（从当前表格提取）
    var tableEl = document.getElementById('detail-table');
    if (tableEl) {
        var ws2 = XLSX.utils.table_to_sheet(tableEl);
        XLSX.utils.book_append_sheet(wb, ws2, '详细指标');
    }

    var wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
    var blob = new Blob([wbout], { type: 'application/octet-stream' });
    var link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    var d = new Date();
    link.download = '战略洞察_' + buId + '_' + d.getFullYear() + (d.getMonth()+1) + d.getDate() + '.xlsx';
    link.click();
    URL.revokeObjectURL(link.href);
}

function exportPDF() {
    document.getElementById('export-pop').style.display = 'none';
    var el = document.getElementById('dashboard-page');
    var btn = document.querySelector('.btn-export');
    var origText = btn.textContent;
    btn.textContent = '正在生成PDF...';
    html2canvas(el, { scale: 1.5, useCORS: true, logging: false, backgroundColor: '#f4f6fa' }).then(function(canvas) {
        var imgData = canvas.toDataURL('image/jpeg', 0.85);
        var pdf = new window.jspdf.jsPDF('l', 'mm', 'a4');
        var pdfW = pdf.internal.pageSize.getWidth() - 20;
        var imgH = canvas.height * pdfW / canvas.width;
        var maxH = pdf.internal.pageSize.getHeight() - 20;
        if (imgH > maxH) imgH = maxH;
        pdf.addImage(imgData, 'JPEG', 10, 10, pdfW, imgH);
        pdf.save('战略洞察报告.pdf');
        btn.textContent = origText;
    }).catch(function() {
        btn.textContent = origText;
        alert('PDF生成失败，请重试');
    });
}



document.addEventListener('DOMContentLoaded', initRouter);

function highlightRadarDim(dimKey) {
    // 高亮雷达图中对应维度
    var chart = echarts.getInstanceByDom(document.getElementById('radar-chart'));
    if (chart) {
        var dimIdx = ['scale','profit','cost_eff','finance','growth'].indexOf(dimKey);
        chart.dispatchAction({
            type: 'highlight',
            dataIndex: dimIdx
        });
    }
}
function resetRadarHighlight() {
    var chart = echarts.getInstanceByDom(document.getElementById('radar-chart'));
    if (chart) {
        chart.dispatchAction({ type: 'downplay' });
    }
}
