<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电解液产业链甘特图 - 测试</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        
        .title {
            font-size: 20px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e0e6ed;
        }
        
        /* 甘特图按钮组 */
        .gantt-btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .gantt-btn {
            padding: 6px 14px;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            background: white;
            color: #333;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .gantt-btn:hover {
            background: #e8f0fe;
            border-color: #1e3c72;
            color: #1e3c72;
        }
        
        .gantt-btn.active {
            background: #1e3c72;
            color: white;
            border-color: #1e3c72;
        }
        
        /* 甘特图容器 */
        .gantt-chart {
            position: relative;
            width: 100%;
            height: 500px;
            border: 1px solid #e0e6ed;
            border-radius: 8px;
            overflow: auto;
            background: #fafbfc;
        }
        
        .gantt-canvas {
            width: 100%;
            height: 100%;
        }
        
        /* 折线图容器 */
        .line-chart-container {
            margin-top: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            display: none;
        }
        
        .line-chart-container.active {
            display: block;
        }
        
        .line-chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 12px;
        }
        
        .line-chart-canvas {
            width: 100%;
            height: 300px;
            background: white;
            border-radius: 6px;
        }
        
        .close-btn {
            float: right;
            padding: 4px 12px;
            border: 1px solid #d0d7de;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 12px;
        }
        
        .close-btn:hover {
            background: #f0f0f0;
        }
    </style>
    <script src="electrolyte_data.js"></script>
</head>
<body>
    <div class="container">
        <div class="title">电解液产业链甘特图（2026年至今）</div>
        
        <!-- 按钮组 -->
        <div class="gantt-btn-group" id="ganttBtnGroup">
            <!-- 按钮将通过JS动态生成 -->
        </div>
        
        <!-- 甘特图 -->
        <div class="gantt-chart">
            <canvas class="gantt-canvas" id="ganttCanvas"></canvas>
        </div>
        
        <!-- 折线图 -->
        <div class="line-chart-container" id="lineChartContainer">
            <button class="close-btn" onclick="closeLineChart()">关闭</button>
            <div class="line-chart-title" id="lineChartTitle"></div>
            <canvas class="line-chart-canvas" id="lineChartCanvas"></canvas>
        </div>
    </div>
    
    <script>
        // 电解液数据（从electrolyte_data.js加载）
        // 这里先使用模拟数据
        const ELECTROLYTE_VARIETIES = [
            { id: '电解液价格-磷酸铁锂动力型', name: '电解液-磷酸铁锂动力', unit: '元/吨' },
            { id: '电解液价格-磷酸铁锂储能型', name: '电解液-磷酸铁锂储能', unit: '元/吨' },
            { id: '电解液价格-三元动力型', name: '电解液-三元动力', unit: '元/吨' },
            { id: 'LiFSI价格-固态', name: 'LiFSI-固态', unit: '元/吨' },
            { id: '添加剂VC-价格', name: '添加剂VC', unit: '元/吨' },
            { id: '添加剂PS-价格', name: '添加剂PS', unit: '元/吨' },
            { id: '添加剂FEC-价格', name: '添加剂FEC', unit: '元/吨' }
        ];
        
        // 模拟价格数据（实际应用中应从ELECTROLYTE_DATA加载）
        let electrolyteData = null;
        
        // 初始化
        function init() {
            console.log('[电解液甘特图] 初始化...');
            
            // 尝试加载真实数据
            if (typeof ELECTROLYTE_DATA !== 'undefined') {
                electrolyteData = ELECTROLYTE_DATA;
                console.log('✓ 已加载电解液数据');
            } else {
                console.warn('⚠️ 未找到ELECTROLYTE_DATA，使用模拟数据');
                generateMockData();
            }
            
            // 生成按钮组
            generateButtons();
            
            // 渲染甘特图
            renderGanttChart();
        }
        
        // 生成模拟数据
        function generateMockData() {
            electrolyteData = {};
            ELECTROLYTE_VARIETIES.forEach(variety => {
                const data = [];
                const startDate = new Date('2026-01-01');
                const endDate = new Date('2026-06-10');
                
                let currentDate = new Date(startDate);
                let price = 20000 + Math.random() * 10000;
                
                while (currentDate <= endDate) {
                    const dateStr = currentDate.toISOString().slice(0, 10);
                    price += (Math.random() - 0.5) * 1000;
                    price = Math.max(10000, price);
                    
                    data.push({
                        日期: dateStr,
                        均价: Math.round(price)
                    });
                    
                    currentDate.setDate(currentDate.getDate() + 1);
                }
                
                electrolyteData[variety.id] = data;
            });
            console.log('✓ 已生成模拟数据');
        }
        
        // 生成按钮组
        function generateButtons() {
            const btnGroup = document.getElementById('ganttBtnGroup');
            btnGroup.innerHTML = '';
            
            ELECTROLYTE_VARIETIES.forEach((variety, index) => {
                const btn = document.createElement('button');
                btn.className = 'gantt-btn' + (index === 0 ? ' active' : '');
                btn.textContent = variety.name;
                btn.onclick = () => selectVariety(variety.id);
                btnGroup.appendChild(btn);
            });
            
            console.log('✓ 已生成按钮组');
        }
        
        // 选择品种
        function selectVariety(varietyId) {
            console.log('[电解液甘特图] 选择品种: ' + varietyId);
            
            // 更新按钮状态
            document.querySelectorAll('.gantt-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 显示折线图
            showLineChart(varietyId);
        }
        
        // 渲染甘特图
        function renderGanttChart() {
            console.log('[电解液甘特图] 渲染甘特图...');
            
            const canvas = document.getElementById('ganttCanvas');
            const ctx = canvas.getContext('2d');
            
            // 设置canvas尺寸
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 计算累积涨跌幅
            const cumulativeChanges = calculateCumulativeChanges();
            
            // 绘制甘特图
            drawGanttChart(ctx, cumulativeChanges, canvas.width, canvas.height);
            
            console.log('✓ 甘特图渲染完成');
        }
        
        // 计算累积涨跌幅
        function calculateCumulativeChanges() {
            const result = [];
            
            ELECTROLYTE_VARIETIES.forEach(variety => {
                const data = electrolyteData[variety.id];
                if (!data || data.length === 0) {
                    result.push({ variety: variety, change: 0, data: [] });
                    return;
                }
                
                // 计算从第一天到最后一一天的价格变化百分比
                const firstPrice = data[0].均价;
                const lastPrice = data[data.length - 1].均价;
                const changePercent = ((lastPrice - firstPrice) / firstPrice * 100).toFixed(2);
                
                result.push({
                    variety: variety,
                    change: parseFloat(changePercent),
                    data: data
                });
            });
            
            // 按涨跌幅降序排序
            result.sort((a, b) => b.change - a.change);
            
            return result;
        }
        
        // 绘制甘特图
        function drawGanttChart(ctx, data, width, height) {
            const barHeight = 40;
            const barGap = 10;
            const leftMargin = 200;
            const rightMargin = 50;
            const topMargin = 50;
            
            // 绘制标题
            ctx.fillStyle = '#1e3c72';
            ctx.font = 'bold 16px Microsoft YaHei';
            ctx.textAlign = 'left';
            ctx.fillText('电解液产业链累积涨跌幅（2026年至今）', 20, 30);
            
            // 绘制Y轴标签（品种名称）
            ctx.fillStyle = '#333';
            ctx.font = '13px Microsoft YaHei';
            ctx.textAlign = 'right';
            
            data.forEach((item, index) => {
                const y = topMargin + index * (barHeight + barGap) + barHeight / 2;
                ctx.fillText(item.variety.name, leftMargin - 10, y + 5);
            });
            
            // 绘制条形图
            const maxChange = Math.max(...data.map(d => Math.abs(d.change)), 10);
            const barWidth = (width - leftMargin - rightMargin) / 2;
            
            data.forEach((item, index) => {
                const y = topMargin + index * (barHeight + barGap);
                const barLength = (Math.abs(item.change) / maxChange) * barWidth;
                
                // 绘制条形
                ctx.fillStyle = item.change >= 0 ? '#27ae60' : '#e74c3c';
                const x = item.change >= 0 ? leftMargin + barWidth : leftMargin + barWidth - barLength;
                ctx.fillRect(x, y, barLength, barHeight);
                
                // 绘制数值标签
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Microsoft YaHei';
                ctx.textAlign = item.change >= 0 ? 'left' : 'right';
                const labelX = item.change >= 0 ? x + 5 : x - 5;
                ctx.fillText((item.change >= 0 ? '+' : '') + item.change.toFixed(2) + '%', labelX, y + barHeight / 2 + 5);
            });
            
            // 绘制中线（0%）
            ctx.strokeStyle = '#999';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();
            ctx.moveTo(leftMargin + barWidth, topMargin);
            ctx.lineTo(leftMargin + barWidth, topMargin + data.length * (barHeight + barGap));
            ctx.stroke();
            ctx.setLineDash([]);
        }
        
        // 显示折线图
        function showLineChart(varietyId) {
            const container = document.getElementById('lineChartContainer');
            const title = document.getElementById('lineChartTitle');
            const canvas = document.getElementById('lineChartCanvas');
            
            // 更新标题
            const variety = ELECTROLYTE_VARIETIES.find(v => v.id === varietyId);
            title.textContent = variety.name + '价格走势';
            
            // 显示容器
            container.classList.add('active');
            
            // 绘制折线图
            drawLineChart(canvas, varietyId);
        }
        
        // 绘制折线图
        function drawLineChart(canvas, varietyId) {
            const ctx = canvas.getContext('2d');
            const data = electrolyteData[varietyId];
            
            if (!data || data.length === 0) {
                console.warn('⚠️ 无数据: ' + varietyId);
                return;
            }
            
            // 设置canvas尺寸
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = 300;
            
            // 清空画布
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 绘制折线图
            const padding = { top: 30, right: 30, bottom: 50, left: 60 };
            const chartWidth = canvas.width - padding.left - padding.right;
            const chartHeight = canvas.height - padding.top - padding.bottom;
            
            // 计算价格范围
            const prices = data.map(d => d.均价);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);
            const priceRange = maxPrice - minPrice;
            
            // 绘制网格线
            ctx.strokeStyle = '#e0e0e0';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (i / 5) * chartHeight;
                ctx.beginPath();
                ctx.moveTo(padding.left, y);
                ctx.lineTo(padding.left + chartWidth, y);
                ctx.stroke();
                
                // Y轴标签
                const price = maxPrice - (i / 5) * priceRange;
                ctx.fillStyle = '#666';
                ctx.font = '11px Microsoft YaHei';
                ctx.textAlign = 'right';
                ctx.fillText(price.toFixed(0), padding.left - 5, y + 5);
            }
            
            // 绘制折线
            ctx.strokeStyle = '#1e3c72';
            ctx.lineWidth = 2;
            ctx.beginPath();
            
            data.forEach((d, i) => {
                const x = padding.left + (i / (data.length - 1)) * chartWidth;
                const y = padding.top + ((maxPrice - d.均价) / priceRange) * chartHeight;
                
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            });
            
            ctx.stroke();
            
            // 绘制标题
            ctx.fillStyle = '#333';
            ctx.font = 'bold 14px Microsoft YaHei';
            ctx.textAlign = 'center';
            ctx.fillText('价格走势', canvas.width / 2, 20);
        }
        
        // 关闭折线图
        function closeLineChart() {
            const container = document.getElementById('lineChartContainer');
            container.classList.remove('active');
        }
        
        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
