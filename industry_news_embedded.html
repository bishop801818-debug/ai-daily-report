<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>行业新闻 - 晨会指挥中心</title>
<style>
  :root {
    --primary: #1e3c72;
    --accent: #f39c12;
    --bg: #f0f2f8;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-dim: #7f8c8d;
    --border: #e0e6ef;
    --shadow: 0 2px 12px rgba(30,60,114,0.08);
    --shadow-hover: 0 6px 24px rgba(30,60,114,0.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;
          background:var(--bg); color:var(--text); min-height:100vh; }

  /* ── 顶部导航 ── */
  .topbar {
    background: #111111;
    padding:14px 30px; display:flex; align-items:center;
    justify-content:space-between; box-shadow:0 2px 12px rgba(0,0,0,0.15);
    position:sticky; top:0; z-index:100;
  }
  .topbar-title { color:#fff; font-size:20px; font-weight:700;
                   display:flex; align-items:center; gap:10px; }
  .topbar-title .icon { font-size:22px; }
  .topbar-date { color:rgba(255,255,255,0.85); font-size:13px; }
  .topbar-badge { background:var(--accent); color:#fff;
                   font-size:11px; padding:2px 8px; border-radius:20px;
                   font-weight:600; margin-left:8px; }
  .topbar-back {
    background:rgba(255,255,255,0.15); color:#fff; border:none;
    padding:7px 16px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:background 0.2s; display:flex; align-items:center; gap:6px;
  }
  .topbar-back:hover { background:rgba(255,255,255,0.25); }

  /* ── 页面容器 ── */
  .page {
    isolation:isolate;
    position:relative; max-width:1100px; margin:0 auto; padding:24px 16px 60px; }

    /* ── BU主Tab栏（一级，含下拉维度，单行不换行） ── */
  .bu-tab-bar {
    display:flex; gap:8px; margin-bottom:20px;
    position:relative; z-index:999;
    flex-wrap:nowrap; align-items:flex-start;
    padding-bottom:4px;
  }

  .bu-tab-wrap {
    position:relative; display:inline-block; flex-shrink:0;
    z-index:999;
  }
  .bu-tab-btn {
    padding:8px 18px; border-radius:20px; border:2px solid transparent;
    cursor:pointer; font-size:13px; font-weight:600;
    background:#fff; color:var(--text); white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .bu-tab-btn .dropdown-arrow { font-size:10px; transition:transform 0.2s; }
  .bu-tab-wrap:hover .bu-tab-btn .dropdown-arrow { transform:rotate(180deg); }

  /* 下拉菜单（默认隐藏，悬停显示） */
  .bu-dropdown {
    display:none;
    position:absolute; top:calc(100% + 6px); left:0;
    background:#fff; border:1px solid var(--border);
    border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.12);
    z-index:1000; min-width:160px; overflow:visible;
  }
  .bu-tab-wrap:hover .bu-dropdown { display:block; }

  .bu-dropdown-item {
    padding:10px 16px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; transition:background 0.15s;
    border-bottom:1px solid var(--border);
  }
  .bu-dropdown-item:last-child { border-bottom:none; }
  .bu-dropdown-item:hover { background:#f0f4ff; }
  .bu-dropdown-item .dro-label { display:flex; align-items:center; gap:8px; }
  .bu-dropdown-item .dro-count {
    font-size:11px; color:var(--text-dim); background:var(--bg);
    padding:1px 7px; border-radius:10px; font-weight:600;
  }
/* ── 内容区标题（当前BU+维度指示） ── */
  .content-header {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .content-header .bu-pill {
    font-size:12px; padding:3px 12px; border-radius:20px;
    color:#fff; font-weight:600;
  }
  .content-header .dim-label {
    font-size:14px; font-weight:700; color:var(--text);
  }

  /* ── 维度内容区 ── */
  .dim-content { display:none; }
  .dim-content.active { display:block; }

  /* ── 统计条 ── */
  .dim-stats {
    display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;
  }
  .stat-chip {
    font-size:12px; padding:4px 12px; border-radius:20px;
    background:#fff; border:1px solid var(--border);
    color:var(--text-dim);
  }
  .stat-chip strong { color:var(--primary); }

  /* ── 新闻卡片 ── */
  .news-card {
    background:var(--card-bg); border-radius:12px; padding:16px 20px;
    margin-bottom:12px; box-shadow:var(--shadow);
    border-left:4px solid var(--border);
    transition:box-shadow 0.2s, border-color 0.2s;
    cursor:pointer;
  }
  .news-card:hover { box-shadow:var(--shadow-hover); border-left-color:var(--primary); }
  .news-card.p0 { border-left-color:#c0392b; }
  .news-card.p1 { border-left-color:#e67e22; }
  .news-card.p2 { border-left-color:#27ae60; }

  .card-top {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:8px;
  }
  .bu-tag {
    font-size:11px; font-weight:700; padding:2px 10px;
    border-radius:20px; color:#fff;
  }
  .priority-tag {
    font-size:10px; font-weight:700; padding:2px 7px;
    border-radius:3px; color:#fff;
  }
  .priority-tag.p0 { background:#c0392b; }
  .priority-tag.p1 { background:#e67e22; }
  .priority-tag.p2 { background:#27ae60; }

  .card-title {
    font-size:15px; font-weight:700; color:var(--primary);
    line-height:1.5; margin-bottom:6px;
  }
  .card-content {
    font-size:13px; color:var(--text-dim); line-height:1.8;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
    transition:max-height 0.3s ease;
  }
  .news-card.expanded .card-content {
    display:block; -webkit-line-clamp:unset; overflow:visible;
  }
  .card-arrow {
    font-size:11px; color:var(--text-dim); margin-top:4px;
    transition:transform 0.2s;
  }
  .news-card.expanded .card-arrow { transform:rotate(180deg); }

  .card-footer {
    margin-top:8px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .card-source { font-size:11px; color:var(--text-dim); }
  .card-link {
    font-size:11px; color:#3498db; text-decoration:none;
  }
  .card-link:hover { text-decoration:underline; }

  /* ── 加载状态 ── */
  #pageLoader { text-align:center; padding:80px 0; color:#888; }
  #pageLoader .loader-icon { font-size:40px; margin-bottom:14px; }
  #pageLoader .loader-msg { font-size:15px; }
  .page-error { text-align:center; padding:60px 20px; color:#888; font-size:14px; }

  /* ── 空状态 ── */
  .empty-state {
    text-align:center; padding:60px 20px; color:#aaa;
    font-size:14px; background:var(--card-bg); border-radius:12px;
    box-shadow:var(--shadow);
  }

  @media (max-width:640px) {
    .topbar { padding:12px 16px; }
    .topbar-title { font-size:16px; }
    .dim-tab-btn { padding:6px 14px; font-size:13px; }
    .news-card { padding:12px 14px; }
  }
</style>
</head>

<div class="topbar">

<div class="page">

  <div id="pageLoader">

  <div id="realPageContent" style="display:none">

    <!-- 内容区（直接渲染新闻，无二级维度Tab） -->
    <div id="dimContentArea"></div>

  </div>

</div>

 "market", "priority": "P1", "dept": "sdmd"}, {"id": "news_2238", "title": "澳矿复产预期+津巴矿到港，远期供给宽松逻辑强化", "content": "澳洲Bald Hill矿山预计四季度开始出矿，津巴布韦锂矿6月底至7月初陆续到港，远期供给宽松预期持续压制盘面。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_2237", "title": "仓单突破5万吨，近月合约交割压力大", "content": "仓单大幅增长已突破5万吨，近月合约面临较大交割压力，对短期现货升水形成压制，多空博弈激烈。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_2236", "title": "盐湖提锂贡献主要增量", "content": "本周碳酸锂产量中盐湖端贡献主要增量，盐湖季度现金生产成本约33291元/吨，显著低于矿石端，盈利空间充足，排产动力十足。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_2235", "title": "津巴布韦锂矿重启发运", "content": "津巴布韦锂矿已恢复发运，近日到港后锂盐厂快速提货，新民洲港口库存处于低位，短期内矿石到港将改善原料偏紧局面。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_2234", "title": "电池级氢氧化锂", "content": "价格：166000元/吨，涨跌：-12700元/吨（周度-7.10%）。来源：长城证券，2026-05-25", "source": "长城证券，2026-05-25", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_2233", "title": "锂辉石精矿CIF（中国）", "content": "价格：2630-2700美元/吨，涨跌：-200美元/吨（周度-6.94%）。来源：我的钢铁网，2026-05-25", "source": "我的钢铁网，2026-05-25", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_2232", "title": "碳酸锂期货LC2609", "content": "价格：184460元/吨，涨跌：-4460元/吨（-2.36%）。来源：正大期货，2026-05-25", "source": "正大期货，2026-05-25", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_2216", "title": "德方纳米债务压力警示", "content": "德方纳米在三年累亏近38亿元、资产负债率超60%背景下，仍决定投资87亿元新建产能，摩根士丹利目标价100元/股，而瑞银仅给中性评级目标价79.5元/股，提示资金链与扩张节奏风险，来源：子瑜姐姐，2026-05-10", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P2", "dept": "czly"}, {"id": "news_2215", "title": "高端产能扩张过热风险", "content": "2025年底全国磷酸铁锂有效产能599万吨/年，2026年预计增至737万吨/年；自2025年四季度至2026年一季度，行业新增扩产规划合计达380万吨/年，其中高压 hy"}, {"id": "news_2186", "title": "国内基础油产能持续扩张，进口依存度持续下降", "content": "2025年我国润滑油基础油产能已达1672万吨/年，进口量降至146.89万吨，同比减少4.4%，进口依存度降至约14%，国产高端基础油供给能力稳步提升。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lhy"}, {"id": "news_2185", "title": "ExxonMobil新加坡Group II基础油产能扩建完成", "content": "ExxonMobil完成新加坡裕廊岛API Group II基础油工厂最新一轮扩建，亚太区Group II基础油供给能力进一步提升，全球中高端基础油市场竞争加剧。", "source": "", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lhy"}, {"id": "news_2184", "title": "昆仑蜗轮蜗杆油L-CKE/P 220", "content": "价格：3480.32元/170kg，涨跌：近期报价稳定。来源：我的钢铁网，2026-05-21", "source": "我的钢铁网，2026-05-21", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lhy"}, {"id": "news_2183", "title": "WTI原油期货", "content": "价格：90.30美元/桶，涨跌：单日跌6.52%，近三周从112美元高位快速回落。来源：Investing.com，2026-05-25", "source": "Investing.com，2026-05-25", "url": "#", "date": "2026-05-26", "dim": "market", "priority": "P1", "dept": "lhy"}, {"id": "auto_2026-05-25_3668", "title": "油价下行空间与需求改善节奏存分歧", "content": "地缘溢价消退令油价短期承压,但若美伊协议落地提振需求,加上中国制造业PMI若触底,原油下行空间或有限,市场方向尚不明朗。(来源:和讯,2026-05-22)", "source": "", "url": "", "date": "2026-05-25", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-25_3667", "title": "废矿物油再生润滑油基础油", "content": "免征消费税 执行至2027年底\n来源：财政部公告2023年第69号", "source": "财政部公告2023年第69号", "url": "", "date": "2026-05-25", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-25_3666", "title": "中国润滑油基础油出口均价(2025年)", "content": "765.24美元/吨 较上年同期\n来源：新思界行业研究中心,2026年", "source": "新思界行业研究中心,2026年", "url": "", "date": "2026-05-25", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-25_3665", "title": "全球润滑油基础油消费量(2025年)", "content": "3515万吨 +1.4%(年均复合)\n来源：新思界行业研究中心,2026年", "source": "新思界行业研究中心,2026年", "url": "", "date": "2026-05-25", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-25_3664", "title": "中国润滑油产量(2024年)", "content": "826万吨 +11.77%(同比)\n来源：前瞻 素加注设备，被处以罚款1.5万元。处罚决定书显示截至案发，当事人以2.2元/kg对外出售非中石化认证车用尿素3546.16kg，违法经营额7801.55元。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "kls"}, {"id": "news_1548", "title": "丙二醇成本支撑崩塌", "content": "原料环氧丙烷半月跌幅超5.8%，山东地区丙二醇均价9800元/吨，较月初下跌7.26%，防冻液/制动液原料成本端压力缓解但市场信心不足。", "source": "", "url": "#", "date": "2026-05-14", "dim": "topnews", "priority": "P0", "dept": "dhx"}, {"id": "news_1538", "title": "亿纬锂能斩获印度8GWh储能大单，下游储能需求持续高增，电解液溶剂需求边际向好。", "content": "② 锂电电解液板块集体走强，多氟多涨停，驱动因素为韩国半导体企业对华无水氢氟酸出口激增，带动上游氟化工联动。\n③ 多氟多、天际股份2025年业绩扭亏，2026年六氟磷酸锂业务规划受市场高度关注，5月行业景气度延续。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_1526", "title": "亿华通取得铂碳催化剂制备方法专利，通过多元醇溶剂+酸性助分散剂体系优化碳载体分散性，利好燃料电池催化剂降本。", "content": "② 2025年全国燃料电池汽车销量10,776辆/+51.8%，系统成本已降至约1,450元/kW，但行业整体仍处于商业化初期亏损阶段。\n\n③ 国家电投吉电股份梨树20万吨绿色甲醇项目制氢EPC预中标，总规模含碱性电解槽28套+PEM电解槽4×500Nm³/h，合计超2.05亿元。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1523", "title": "三元材料价格持续小幅上涨，6系单晶622型周涨1.52%至20.1万元/吨，5月产量预计环比增9%至8.79万吨。", "content": "② 盟固利CIBF2026展示前沿材料并宣布投资30亿元布局磷酸铁锂一体化，容百科技同日获行业金锂奖。\n③ 宁德时代磷酸铁锂技术授权福特出海，亿纬锂能再签印度8GWh储能大单，储能市场中国电池企业持续扩张。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1509", "title": "工信部等五部门联合执法专项行动持续推进，5月进入集中执法阶段，废旧动力电池非正规渠道加速出清，正规企业迎战略扩张窗口期。", "content": "② 杰瑞股份在CIBF 2026展会发布新一代锂电池资源化循环利用设备，年处理产能提升50%、综合能耗降低30%，回收工艺进入提效新阶段。\n\n③ 格林美2025年退役锂电池拆解量超5.26万吨、锂回收率超96.5%，盈利状况持续改善，头部企业已率先跑通商业闭环。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1504", "title": "5月14日碳酸锂期货主力合约大跌近5%，盘中跌破20万元/吨整数关口，主力资金净流出超20亿元，期现基差走扩至-900元/吨。", "content": "② 磷酸铁锂现货价格近一年翻倍上涨，从约3万元/吨涨至约6万元/吨，下游电池企业订单已排至年底，行业供不应求态势明显。\n\n③ 《矿产资源法实施条例（草案）》5月9日经国务院常务会审议通过，锂矿被列为战略矿、保护性开采，探矿/采矿权审批上收至自然资源部，供给侧约束预期持续收紧。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1488", "title": "CIBF2026深圳国际电池展开幕，近3200家企业参展，展出面积约28万平方米，全球首部锂离子电池行业蓝皮书正式发布。", "content": "② 磷酸铁锂价格延续涨势，5月13日报6.82万元/吨，较4月初上涨18.44%，碳酸锂重返20万元/吨近三年新高，产业链利润持续修复。\n③ 宁德时代与海博思创签署3年60GWh钠电池战略合作协议，为迄今全球规模最大的钠电池订单，钠电商业化正式提速，或对磷酸铁锂形成替代压力。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "czly"}, {"id": "news_1477", "title": "山东巨野县临港产业园10台360kW充电桩投入使用，近300辆纯电重卡运营，单台年省燃料费约10万元，新能源重卡对车用尿素替代压力边际加速。", "content": "③ 山东巨野县临港产业园10台360kW充电桩投入使用，近300辆纯电重卡运营，单台年省燃料费约10万元，新能源重卡对车用尿素替代压力边际加速。", "source": "经济参考报", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "kls"}, {"id": "news_1476", "title": "2026年车用尿素品牌排行榜出炉，可兰素稳居榜首，美丰加蓝、心连心、泸天化、长城佳蓝、昆仑之星分列其后，市场品牌集中度持续提升。", "content": "② 2026年车用尿素品牌排行榜出炉，可兰素稳居榜首，美丰加蓝、心连心、泸天化、长城佳蓝、昆仑之星分列其后，市场品牌集中度持续提升。", "source": "中国报告大厅", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "kls"}, {"id": "news_1475", "title": "5月14日尿素现货稳中有降，山东/河南出厂价1770-1800元/吨，新单跟进持续乏力，厂家库存环比大增22.90%，基本面暂无有效利好支撑。（来源", "content": "华泰期货，2026-05-14）\n\n② 2026年车用尿素品牌排行榜出炉，可兰素稳居榜首，美丰加蓝、心连心、泸天化、长城佳蓝、昆仑之星分列其后，市场品牌集中度持续提升。", "source": "中国报告大厅", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P0", "dept": "kls"}, {"id": "news_1474", "title": "昆仑润滑在5月10日中国品牌日期间主动携手竞品长城润滑油开展跨界联动，以\\\"山河同守护，润滑共担当\\\"等共性文案传递行业品牌共同形象，国内润滑领域头部品牌从竞争走向协同的新格局值得关注。", "content": "昆仑润滑在5月10日中国品牌日期间主动携手竞品长城润滑油开展跨界联动，以\\\"山河同守护，润滑共担当\\\"等共性文案传递行业品牌共同形象，国内润滑领域头部品牌从竞争走向协同的新格局值得关注。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1473", "title": "道明证券警告称，中美原油库存快速下降叠加沙特4月产量跌至1990年以来最低（约631.6万桶/日），布伦特油价目标上限或上探150美元/桶；霍尔木兹海峡地缘风险持续，油价高位区间震荡格局延续，润滑油成本支撑有增无减。", "content": "道明证券警告称，中美原油库存快速下降叠加沙特4月产量跌至1990年以来最低（约631.6万桶/日），布伦特油价目标上限或上探150美元/桶；霍尔木兹海峡地缘风险持续，油价高位区间震荡格局延续，润滑油成本支撑有增无减。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1472", "title": "隆众数据显示，5月8日—14日当周国内II类基础油产能利用率跌至52%，库存环比大降22%，叠加多套主力炼厂处于检修状态，基础油市场供应收紧持续支撑价格上行。", "content": "隆众数据显示，5月8日—14日当周国内II类基础油产能利用率跌至52%，库存环比大降22%，叠加多套主力炼厂处于检修状态，基础油市场供应收紧持续支撑价格上行。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1471", "title": "润滑油添加剂海外产能加速布局", "content": "瑞丰新材规划投资约2.46亿美元建设海外润滑油添加剂生产基地（分多期推进），一期投资1.27亿美元，旨在形成核心单剂及主流复合剂品种的完整产能布局，目标成为全球除\\\"四大\\\"（路博润、润英联、雅富顿、雪佛龙奥伦耐）外的第五家综合型润滑油添加剂厂商。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1470", "title": "中海油泰州炼厂转型基础油专项", "content": "中海油泰州炼厂在经历前期转型后持续聚焦基础油及特种油品生产，在基础油国产化进程中填补区域供给缺口；其装置检修对华南基础油现货偏紧格局影响持续。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1469", "title": "茂名石化检修持续影响华南基础油供给", "content": "鑫泰石化、黄河新材料、中海油泰州、茂名石化等装置处于检修状态，合计影响I/II/III类基础油产能逾10万吨以上，华南地区基础油供给阶段性收紧，区域价格相对偏强。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1468", "title": "生物基/绿色润滑油研发提速", "content": "在\\\"双碳\\\"目标及《美丽中国建设成效考核办法》政策倒逼下，风电润滑油等细分领域将强制要求生物降解性指标，生物基mPAO、可降解酯类油等绿色产品成为研发新方向。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1467", "title": "润滑油添加剂API认证获突破", "content": "国内龙头瑞丰新材已通过API最高级别认证，利安隆与润英联签署战略合作框架协议共同提升技术实力，国内润滑油添加剂在核心技术层面加速进入国际主流供应链。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1466", "title": "国产mPAO高端基础油加速突围", "content": "中石化规划2026年将mPAO（茂金属聚α-烯烃）产能扩至5万吨/年，2028年国产替代率从当前30%提升至50%；同时推进10cSt中黏度牌号量产突破，中高黏度PAO全系列布局持续完善，进口垄断格局有望逐步打破。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1465", "title": "润滑油添加剂龙头Q1业绩亮眼", "content": "利安隆2026年Q1归母净利润同比持续增长，看好抗老化助剂涨价及润滑油添加剂放量；瑞丰新材2025年润滑油添加剂产量17.9万吨（同比+16.2%），销量18.0万吨（同比+13.5%），且API认证逐步落地，已进入壳牌、美孚、道达尔、中石化、中石油供应链，国产替代提速。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1464", "title": "上海国际润滑油展6月启幕：", "content": "第十九届上海国际润滑油品及应用技术展览会将于6月9日—11日在上海举办，中国石化润滑油（长城）、昆仑、壳牌、美孚、嘉实多、道达尔、巴斯夫、路博润、雅富顿、奎克好富顿等头部品牌均已确认参展，展会将设基础油/添加剂/生产原料（W1馆）及车用/工业润滑油/润滑脂（W2馆）两大主题展区，是研判行业趋势与对接合作的重要窗口。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1463", "title": "昆仑润滑携手长城润滑油品牌联动", "content": "5月10日第十个\\\"中国品牌日\\\"期间，昆仑润滑以\\\"产业同行，价值共生\\\"为主题，携手竞品长城润滑油及徐工集团、宇通客车、海尔空调等品牌开展跨界联动，以\\\"山河同守护，润滑共担当\\\"\\\"中国润滑路上，并肩同行缺一不可\\\"等共性文案主动传递行业品牌集群形象。昆仑与长城这两大国有巨头在品牌日期间从竞争走向协同，彰显国内润滑领域品牌同心同向、共塑国货形象的格局变化。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1462", "title": "国内基础油供需结构性偏紧", "content": "2025年国内基础油产能1,672万吨/年，产量877.4万吨，表观需求量1,036.8万吨，产能利用率约52%；进口依存度虽逐年下降（2025年进口量146.89万吨，同比-4.4%），但高端III类/PAO进口比例仍高，高端供给缺口尚未完全填补。\n\n---", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1461", "title": "润滑油行业持续处于涨价周期", "content": "自3月底起，美孚、壳牌、嘉实多、雪佛龙、马石油、道达尔、统一、昆仑、长城等超过40个国内外品牌已发布调价通知，4月—5月形成两波涨价高峰，叠加渠道库存已处高位，本轮涨价已非单纯成本驱动，而是供应链格局重塑信号。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1460", "title": "《美丽中国建设成效考核办法》出台", "content": "考核结果与领导干部综合考核评价及财政资金分配挂钩，中小型化工及润滑油企业或因ESG合规成本及技术实力不足加速出清，行业集中度有望提升，具备绿色低碳产能的龙头企业相对受益。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1459", "title": "欧佩克+减产叠加需求下调并行", "content": "欧佩克将2026年全球原油需求增速预测从138万桶/日大幅下调至117万桶/日，同时沙特产量因中东冲突跌至1990年以来最低水平，供需两端反向施压，原油价格短期高位震荡概率较高，基础油成本端支撑延续。", "source": "", "url": "#", "date": "2026-05-14", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1449", "title": "铂钯价格在地缘风险与美联储鹰派预期双重博弈下持续震荡，南非电力问题缓解压制铂价下行，但南非持续供电紧张叠加俄罗斯诺镍供给收缩（Q1同比 "P2", "dept": "lhy"}, {"id": "news_1248", "title": "美伊谈判陷入僵局、霍尔木兹海峡关闭超十周，国际油价大幅冲高，WTI突破102美元/桶关口，地缘风险溢价持续高企，润滑油基础油成本端压力显著加剧", "content": "美伊谈判陷入僵局、霍尔木兹海峡关闭超十周，国际油价大幅冲高，WTI突破102美元/桶关口，地缘风险溢价持续高企，润滑油基础油成本端压力显著加剧", "source": "", "url": "#", "date": "2026-05-13", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3226", "title": "② 新疆和田公路事业发展中心：2026年机械设备采购招标", "content": "5月11日，和田公路事业发展中心发布2026年机动车辆及机械设备保险采购项目公开招标公告，预算金额108.85万元，投标截止：2026-06-05 11:00。公路系统机械设备润滑油采购需求值得关注。*", "source": "中国政府采购网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3225", "title": "① 华润电力（锦州）有限公司：燃料专业润滑油脂采购询比公告", "content": "5月11日，华润电力（锦州）有限公司发布燃料专业润滑油脂采购询比采购公告，采购编号：，截止时间：2026-05-16 09:00，采购机构：华润守正招标有限公司。", "source": "必联网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3224", "title": "③ 小家电润滑脂技术迭代：多基础油体系实现-50℃至280℃宽温覆盖", "content": "百润得（肯特润滑）以20余年技术沉淀，推出覆盖矿物油、合成油、全氟聚醚等多基础油体系的润滑方案，实现-50℃至280℃宽温覆盖，配合锂基、复合铝基、聚脲等多种稠化剂技术，为家电电机、齿轮箱等部件提供长效防护。*", "source": "搜狐", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3223", "title": "① 昆仑天润汽机油新品发布，API SQ标准全系布局完成", "content": "昆仑润滑在西安站正式发布昆仑天润汽机油新品，完成了对API SQ标准全系产品布局。API SQ标准是目前全球等级最高、指标最严苛的汽油机油技术体系，昆仑润滑也是国内少数完成该标准全系布局的润滑油品牌。*", "source": "中国报业网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3222", "title": "⑧ 美孚/壳牌/嘉实多：5月涨价落地在即，部分品牌明确持续涨价预期", "content": "美孚5月15日起再涨约15%（累计超23%），壳牌5月18日起涨幅不低于10%，嘉实多5月22日起进一步调整。嘉实多、壳牌均明确表示\\\"不排除进一步涨价\\\"，涨价预期持续笼罩市场。*", "source": "车与轮新零售", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3221", "title": "⑦ 小家电润滑脂：2026年TOP5品牌榜单发布，市场走向专业化", "content": "聚焦化工网发布\\\"2026年中国小家电润滑脂行业专业推荐TOP5品牌榜单\\\"，百润得（肯特润滑）凭借多基础油体系和宽温覆盖技术入选，小家电用润滑脂市场持续走向专业化、品牌化。*", "source": "搜狐/聚焦化工厂", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3220", "title": "⑥ 福斯/壳牌：独立润滑油厂商与综合性石油公司的供应链博弈持续", "content": "在涨价潮中，拥有自有炼厂的壳牌、美孚等综合石油公司与不拥有上游炼厂的福斯，走出截然不同的应对路径。福斯方面表示与十余家基础油供应商保持战略合作，\\\"东家不亮西家亮\\\"的灵活供应模式反而成为保供优势。*", "source": "第一财经", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3219", "title": "⑤ 风电轴承脂：国产替代加速，采购成本降低40%-60%", "content": "嘉乐德润滑推出长寿命风电轴承脂，已成功替代杜邦、苏威、3M等进口品牌，广泛适配各类功率风电机组，采购成本降低40%-60%，风电润滑脂国产化趋势明显提速。*", "source": "宝商在线", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3218", "title": "④ 风电行业：价格战明显缓解，迎来\\\"价值竞争\\\"结构性转型", "content": "5月11日，明阳智能、广泰风能、广大特材等多家风电头部企业召开2025年度业绩说明会或接受投资者调研，各方普遍表示风电行业低价竞争态势已显著减缓，中标价格企稳回升，\\\"反内卷\\\"取得阶段性成效，盈利水平有望持续改善。*", "source": "Wind资讯", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3217", "title": "③ 利安隆（300596）：2026Q1业绩同比持续增长，润滑油添加剂放量获看好", "content": "国海证券5月11日发布研报，维持利安隆\\\"买入\\\"评级。研报指出公司2026年一季度业绩同比持续增长，看好抗老化助剂涨价及润滑油添加剂放量逻辑，润滑油添加剂业务成长空间明确。*", "source": "国海证券", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3216", "title": "② 昆仑润滑：品牌日强势发声，\\\"自主之芯\\\"擦亮中国名片", "content": "5月10日第十届中国品牌日，昆仑润滑以\\\"自主之芯\\\"为核心传播主题，在多个平台发声；5月8日\\\"一城一策\\\"全国推广西安站启动，奥运冠军武大靖代言加持，品牌攻势猛烈。*", "source": "搜狐、中国能源网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3215", "title": "② API SQ标准成汽机油升级分水岭，头部品牌加速布局", "content": "昆仑润滑完成API SQ标准全系汽机油布局，标志着全球最高等级、指标最严苛的汽油机油标准体系在中国市场全面落地。行业观点认为，SQ标准将推动汽机油市场进入新一轮产品迭代周期，市场份额有望向已完成标准布局的头部品牌集中。*", "source": "中国报业网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3214", "title": "③ 昆仑润滑完成API SQ标准全系布局，\\\"一城一策\\\"全国推广西安启幕", "content": "5月8日，昆仑润滑\\\"一城一策\\\"全国推广活动首站在西安启幕，奥运冠军武大靖亲临现场。活动正式发布昆仑天润汽机油新品，标志着昆仑润滑完成API SQ（全球等级最高、指标最严苛的汽油机油技术体系）全系产品布局。5月10日第十届中国品牌日期间，昆仑润滑以\\\"自主之芯\\\"为传播核心再度发声，品牌攻势持续升温。*", "source": "中国报业网、中国能源网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3213", "title": "② PAO等高端进口基础油价格坚挺，与国产基础油走势持续分化", "content": "5月11日，华北市场进口PAO基础油价格保持高位：PAO4/PAO6均为27000元/吨，PAO8为29000元/吨，PAO10为28000元/吨，PAO40高达38000元/吨，走势平稳坚挺。同期国产基础油山东、华东、华南地区60N环比下跌，华东华北再生油100SN环比下跌89-169元/吨。霍尔木兹海峡局势持续影响GTL基础油物流通道，进口高端合成基础油供给受限，与国产基础油下跌形成鲜明分化。*", "source": "我的钢铁网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3212", "title": "① 长城润滑油品牌价值大幅增长，蝉联润滑油行业第一", "content": "5月11日，长城润滑油品牌价值大幅增长、蝉联润滑油行业第一的消息同步出现在中国能源网、中国经营网等平台，引发行业关注。作为中国石化旗下润滑油品牌，长城润滑油持续领跑品牌价值榜单，国字号背书效应显著。*", "source": "中国能源网、中国经营网", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "lhy"}, {"id": "auto_2026-05-12_3177", "title": "⑧ 多氟多、天际股份联合召开业绩说明会，共商六氟磷酸锂2026年规划", "content": "5月11日，多氟多与天际股份联合召开业绩说明会。两家公司均对2026年六氟磷酸锂业务规划进行了详细阐述。多氟多明确2026年产量目标6万吨，全球市占率目标持续提升；天际股份同样透露六氟磷酸锂扩产计划，行业整体竞争持续升级。\n\n---\n\n技术/产品", "source": "", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "felt"}, {"id": "auto_2026-05-12_3176", "title": "⑤ 碳酸锂价格逼近20万/吨，储能需求爆发成核心驱动力", "content": "长江有色数据显示，5月11日电池级碳酸锂现货均价报197,500元/吨，较前一交易日上涨3,000元/吨。碳酸锂期货主连价格已达20.16万元/吨，单日涨幅3.25%，不到半年价格近乎翻倍。机构分析：本轮上涨核心驱动为\\\"储能需求爆发+供应收缩共振\\\"，2026年Q1国内储能锂电池出货量达215GWh，同比暴增139%，5月储能电芯排产占比已达42.3%，首次超越动力电池。", "source": "", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "felt"}, {"id": "auto_2026-05-12_3175", "title": "③ 天赐材料Q1净利润暴增1006%，锂电企业Q1业绩\\\"炸裂\\\"", "content": "锂电企业2026年一季报密集发布，集体交出炸裂级成绩单：融捷股份同比+1296%、天齐锂业同比+1699%、湖南裕能同比+1338%、天赐材料同比+1006%！其中天赐材料Q1净利润16.54亿元，电解液出货超20万吨（同比+50%），全球市占率超30%，连续九年蝉联全球第一。行业整体景气度持续修复，基本面支撑强劲。\n\n---\n\n市场/价格\n\n\n\n\n\n\n\n上海有色网（SMM）5月11日快讯：本周电解液综合成本整体波动不大。六氟磷酸锂方面，受碳酸锂带动，氟化锂价格明显上行，叠加无水氟化氢价格继续走高，六氟磷酸锂原料成本持续抬升；经过前期持续去库，企业库存压力已明显缓解，厂家涨价意愿增强，推动六氟磷酸锂市场价上行。溶剂板块来看，行业整体供应充裕，且上游原料对溶剂成本涨跌相互对冲，电解液综合成本整体波动有限，价格暂稳。从供需格局来看，电解液企业普遍维持以销定产节奏。4月国内车企汽车出海销量显著增长，叠加后续车展有望持续提振新能源汽车销量，且储能板块需求保持稳步扩张，下游整体需求预计持续回暖，带动电解液产量同步回升。整体而言，电解液后续市场价格走势仍需持续跟踪其原材料价格变化。\n\n---\n\n企", "source": "", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P2", "dept": "felt"}, {"id": "auto_2026-05-12_3138", "title": "据《经济观察报》（2026年5月11日）报道，截至2026年...", "content": "", "source": "", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P0", "dept": "bych"}, {"id": "auto_2026-05-12_3042", "title": "龙蟠科技控股子公司常州锂源获4.4亿元B轮增资", "content": "5月11日，龙蟠科技（02465.HK）公告，常州锂源引入B轮投资者金沙产业投资，出资4.4亿元认购约6,117万元注册资本，占扩大后股本约6.83%。增资完成后，龙蟠持股比例由66.42%稀释至61.88%，常州锂源仍为集团控股子公司。该笔资金将主要用于磷酸铁锂产能建设，集团磷酸铁锂正极材料扩产按下加速键。同日，龙蟠科技与当升科技联合研发的第五代高压实磷酸铁锂正极材料在CIBF2026展前预热中亮相。\n\n---\n\n② 市场/价格\n\n\n\n\n\n\n\n\n\n\n---\n\n③ 政策/行业", "source": "", "url": "", "date": "2026-05-12", "dim": "topnews", "priority": "P0", "dept": "lpsd"}, {"id": "auto_2026-05-11_2994", "title": "德联集团Q1扣非净利下滑16%，泰国子公司及韩国胶粘剂业务推进中", "content": "（竞品动态持续跟踪）  \n\n---", "source": "", "url": "", "date": "2026-05-11", "dim": "topnews", "priority": "P0", "dept": "dhx"}, {"id": "auto_2026-05-11_2993", "title": "第2届冷却液与液冷技术论坛5月14日上海开幕，液冷市场2030年望达450亿元", "content": "（关联冷却液/热管理业务机遇）", "source": "", "url": "", "date": "2026-05-11", "dim": "topnews", "priority": "P0", "dept": "dhx"}, {"id": "auto_2026-05-11_2992", "title": "中东地缘溢价消退，乙二醇期货单周跌超6%，现货重回5000~5050元/吨区间", "content": "（关联迪克上游成本端松动）", "source": "", "url": "", "date": "2026-05-11", "dim": "topnews", "priority": "P0", "dept": "dhx"}, {"id": "auto_2026-05-11_2962", "title": "振华新材固态电池正极材料实现百吨级出货，固态电解质千吨中试线预计Q3投产", "content": "---", "source": "", "url": "", "date": "2026-05-11", "dim": "topnews", "priority": "P0", "dept": "sjld"}, {"id": "auto_2026-05-11_2961", "title": "5月锂电排产景气延续，三元材料价格周环比小幅上涨，高镍路线需求边际回暖", "content": "", "source": "", "url": "", "date": "2026-05-11", "dim": "topnews", "priority": "P0", "dept": "sjld"}, {"id": "auto_2026-05-11_2960", "title": "印尼大幅削减镍矿配额70%，硫酸镍成本持续上行， 量目标6万吨，全球市占率目标持续提升；天际股份同样透露六氟磷酸锂扩产计划，行业整体竞争持续升级。\n\n---\n\n技术/产品", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_1199", "title": "碳酸锂价格逼近20万/吨，储能需求爆发成核心驱动力", "content": "长江有色数据显示，5月11日电池级碳酸锂现货均价报197,500元/吨，较前一交易日上涨3,000元/吨。碳酸锂期货主连价格已达20.16万元/吨，单日涨幅3.25%，不到半年价格近乎翻倍。机构分析：本轮上涨核心驱动为\\\"储能需求爆发+供应收缩共振\\\"，2026年Q1国内储能锂电池出货量达215GWh，同比暴增139%，5月储能电芯排产占比已达42.3%，首次超越动力电池。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_1198", "title": "天赐材料Q1净利润暴增1006%，锂电企业Q1业绩\\\"炸裂\\\"", "content": "锂电企业2026年一季报密集发布，集体交出炸裂级成绩单：融捷股份同比+1296%、天齐锂业同比+1699%、湖南裕能同比+1338%、天赐材料同比+1006%！其中天赐材料Q1净利润16.54亿元，电解液出货超20万吨（同比+50%），全球市占率超30%，连续九年蝉联全球第一。行业整体景气度持续修复，基本面支撑强劲。\n\n---\n\n市场/价格\n\n\n\n\n\n\n\n上海有色网（SMM）5月11日快讯：本周电解液综合成本整体波动不大。六氟磷酸锂方面，受碳酸锂带动，氟化锂价格明显上行，叠加无水氟化氢价格继续走高，六氟磷酸锂原料成本持续抬升；经过前期持续去库，企业库存压力已明显缓解，厂家涨价意愿增强，推动六氟磷酸锂市场价上行。溶剂板块来看，行业整体供应充裕，且上游原料对溶剂成本涨跌相互对冲，电解液综合成本整体波动有限，价格暂稳。从供需格局来看，电解液企业普遍维持以销定产节奏。4月国内车企汽车出海销量显著增长，叠加后续车展有望持续提振新能源汽车销量，且储能板块需求保持稳步扩张，下游整体需求预计持续回暖，带动电解液产量同步回升。整体而言，电解液后续市场价格走势仍需持续跟踪其原材料价格变化。\n\n---\n\n企业动态", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_1192", "title": "据经济观察报调研，头部碱性电解槽企业手持碱性制氢设备订单规模约1.8GW（截至2026年4月底），其中国内约1.3GW、海外约0.5GW。随着\\\"十五五\\\"规划政策逐步落地及绿氢强制配额预期升温，预计2026年下半年起绿氢项目招标将迎来新一轮高峰期，电解槽厂商需做好产能储备。", "content": "据经济观察报调研，头部碱性电解槽企业手持碱性制氢设备订单规模约1.8GW（截至2026年4月底），其中国内约1.3GW、海外约0.5GW。随着\\\"十五五\\\"规划政策逐步落地及绿氢强制配额预期升温，预计2026年下半年起绿氢项目招标将迎来新一轮高峰期，电解槽厂商需做好产能储备。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1191", "title": "2026粤港澳大湾区（佛山）国际电解水制氢设备展览会相关招展工作已启动，展览范围涵盖电解水制氢技术、储氢设备、输氢管线及相关配套装备。本次展会将为国内电解槽厂商提供展示平台，有助于推动华南地区氢能产业链协同发展。", "content": "2026粤港澳大湾区（佛山）国际电解水制氢设备展览会相关招展工作已启动，展览范围涵盖电解水制氢技术、储氢设备、输氢管线及相关配套装备。本次展会将为国内电解槽厂商提供展示平台，有助于推动华南地区氢能产业链协同发展。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1190", "title": "西班牙能源公司Moeve的300MW绿氢项目已正式启动设备采购，De Nora获得首批电解池订单（€3,000-4,000万），标志着欧洲西南部最大规模绿氢项目进入工程建设阶段。该项目预计将进一步推动地中海沿岸绿氢产业集群的形成。", "content": "西班牙能源公司Moeve的300MW绿氢项目已正式启动设备采购，De Nora获得首批电解池订单（€3,000-4,000万），标志着欧洲西南部最大规模绿氢项目进入工程建设阶段。该项目预计将进一步推动地中海沿岸绿氢产业集群的形成。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1189", "title": "美国能源部（DOE）更新氢能和燃料电池多年期计划，近中期重点发展电解制氢技术，研发用于吉瓦级规模运行的经济、高效、耐用电解槽，包括低温电解槽（PEM、液体碱性、阴离子交换膜）和高温电解槽（固体氧化物电解槽）。该计划的更新反映了美国政府对氢能产业化的持续加码，将对全球氢能技术和市场格局产生深远影响。", "content": "美国能源部（DOE）更新氢能和燃料电池多年期计划，近中期重点发展电解制氢技术，研发用于吉瓦级规模运行的经济、高效、耐用电解槽，包括低温电解槽（PEM、液体碱性、阴离子交换膜）和高温电解槽（固体氧化物电解槽）。该计划的更新反映了美国政府对氢能产业化的持续加码，将对全球氢能技术和市场格局产生深远影响。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1188", "title": "PEM电解槽因启停快、适配风光波动性优势显著，但核心材料铱基催化剂和全氟磺酸膜100%依赖进口，成为产业链关键\\\"卡脖子\\\"环节。铱作为铂族贵金属，稀缺性远超铂，若PEM电解槽大规模推广，铱的供应将面临严峻挑战。当前国内研究机构和企业正加速攻关非铱或低铱催化剂路线，但距工业化仍有差距。", "content": "PEM电解槽因启停快、适配风光波动性优势显著，但核心材料铱基催化剂和全氟磺酸膜100%依赖进口，成为产业链关键\\\"卡脖子\\\"环节。铱作为铂族贵金属，稀缺性远超铂，若PEM电解槽大规模推广，铱的供应将面临严峻挑战。当前国内研究机构和企业正加速攻关非铱或低铱催化剂路线，但距工业化仍有差距。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1187", "title": "据《经济观察报》调研，头部碱性电解槽企业持续扩大产能规模，国内碱性制氢设备产能提速明显。随着\\\"十五五\\\"规划的推进及绿氢项目强制配额预期升温，碱性电解槽需求有望继续保持高增长态势。电解槽出货量增长将直接带动镍基催化剂和辅助材料需求。", "content": "据《经济观察报》调研，头部碱性电解槽企业持续扩大产能规模，国内碱性制氢设备产能提速明显。随着\\\"十五五\\\"规划的推进及绿氢项目强制配额预期升温，碱性电解槽需求有望继续保持高增长态势。电解槽出货量增长将直接带动镍基催化剂和辅助材料需求。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1186", "title": "信达期货研报（2026年5月11日）指出，本周铂钯市场延续低位震荡整理格局，美伊和谈在多轮反复后于周末出现阶段性破冰信号，霍尔木兹海峡局势边际缓和支撑贵金属板块情绪小幅修复，但高油价引发的通胀压力与需求担忧仍存。预计短期铂钯价格维持震荡偏弱格局，建议关注地缘局势进展及美联储货币政策动向。", "content": "信达期货研报（2026年5月11日）指出，本周铂钯市场延续低位震荡整理格局，美伊和谈在多轮反复后于周末出现阶段性破冰信号，霍尔木兹海峡局势边际缓和支撑贵金属板块情绪小幅修复，但高油价引发的通胀压力与需求担忧仍存。预计短期铂钯价格维持震荡偏弱格局，建议关注地缘局势进展及美联储货币政策动向。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1185", "title": "高能环境在2025年已形成年产铂3吨、钯3吨、钌3吨、铑5吨以上的产能规模基础上，持续推进铂族金属资源循环利用板块扩张。随着贵金属价格持续走高，铂族金属回收经济性显著改善，回收业务的战略价值日益凸显。铂源催化事业部可关注与具备规模优势的回收企业建立战略合作，拓宽原料供应渠道。", "content": "高能环境在2025年已形成年产铂3吨、钯3吨、钌3吨、铑5吨以上的产能规模基础上，持续推进铂族金属资源循环利用板块扩张。随着贵金属价格持续走高，铂族金属回收经济性显著改善，回收业务的战略价值日益凸显。铂源催化事业部可关注与具备规模优势的回收企业建立战略合作，拓宽原料供应渠道。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1184", "title": "2026年4月，颢元（绍兴）科技有限公司宣布，其自主研发的碳基非铂催化剂产品已完成关键测试，成功打破燃料电池核心材料长期依赖贵金属铂的技术瓶颈。该产品应用有望将燃料电池催化剂成本降低约90%，为氢能产业规模化商业应用扫清关键障碍。尽管距大规模量产仍需时日，但非铂催化剂的技术突破对铂基催化剂的长期市场", "content": "2026年4月，颢元（绍兴）科技有限公司宣布，其自主研发的碳基非铂催化剂产品已完成关键测试，成功打破燃料电池核心材料长期依赖贵金属铂的技术瓶颈。该产品应用有望将燃料电池催化剂成本降低约90%，为氢能产业规模化商业应用扫清关键障碍。尽管距大规模量产仍需时日，但非铂催化剂的技术突破对铂基催化剂的长期市场替代风险值得持续关注。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1183", "title": "昊臻氢能（HyZenis）一台碱性制氢电解槽近日顺利完成出厂测试，正式启运发往客户现场。此次为常规性海外交付，印证了昊臻氢能碱性电解槽产品的可靠性与全球化服务能力稳步提升。国内碱性电解槽厂商持续加码海外市场，对国内电解槽供应链整体带动效应显著。", "content": "昊臻氢能（HyZenis）一台碱性制氢电解槽近日顺利完成出厂测试，正式启运发往客户现场。此次为常规性海外交付，印证了昊臻氢能碱性电解槽产品的可靠性与全球化服务能力稳步提升。国内碱性电解槽厂商持续加码海外市场，对国内电解槽供应链整体带动效应显著。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1182", "title": "挪威电解槽巨头Nel ASA正式发布新一代加压碱性电解槽平台，25MW交钥匙成本低于$1,450/kW，CAPEX较市场现有方案降低40-60%。成本大幅下降将加速绿氢平价进程，对碱性电解槽市场的竞争格局产生深远影响，同时对PEM电解槽（核心材料含铱催化剂）的成本竞争力提出更高要求。", "content": "挪威电解槽巨头Nel ASA正式发布新一代加压碱性电解槽平台，25MW交钥匙成本低于$1,450/kW，CAPEX较市场现有方案降低40-60%。成本大幅下降将加速绿氢平价进程，对碱性电解槽市场的竞争格局产生深远影响，同时对PEM电解槽（核心材料含铱催化剂）的成本竞争力提出更高要求。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1181", "title": "意大利电化学巨头De Nora获得Thyssenkrupp Nucera合资项目首批订单，将为西班牙Moeve 300MW绿氢项目提供电解池，总价€3,000-4,000万欧元。该订单标志着De Nora在全球绿氢电解槽供应链中的地位进一步巩固，也表明欧洲绿氢项目建设进入实质性推进阶段。", "content": "意大利电化学巨头De Nora获得Thyssenkrupp Nucera合资项目首批订单，将为西班牙Moeve 300MW绿氢项目提供电解池，总价€3,000-4,000万欧元。该订单标志着De Nora在全球绿氢电解槽供应链中的地位进一步巩固，也表明欧洲绿氢项目建设进入实质性推进阶段。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1180", "title": "5月11日，高能环境在互动平台披露：截至2025年末，公司资源循环利用板块已形成年产铂3吨、钯3吨、钌3吨、铑5吨以上的产能规模。钌广泛应用于化工催化、电子半导体、新能源及氯碱工业等领域，高催化活性、耐腐蚀、耐高温特性突出。该产能规模在国内铂族金属回收领域具有代表性，对铂源催化事业部的原料采购和行业", "content": "5月11日，高能环境在互动平台披露：截至2025年末，公司资源循环利用板块已形成年产铂3吨、钯3吨、钌3吨、铑5吨以上的产能规模。钌广泛应用于化工催化、电子半导体、新能源及氯碱工业等领域，高催化活性、耐腐蚀、耐高温特性突出。该产能规模在国内铂族金属回收领域具有代表性，对铂源催化事业部的原料采购和行业对标具有参考价值。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1179", "title": "截至2026年4月底，国内头部碱性电解槽企业在手订单合计规模约10GW，其中国内约7.5GW、海外约2.5GW。碱性技术成熟、成本低，占国内绿氢项目98%以上份额，但PEM电解槽在响应速度和电流密度方面优势显著，更适配分布式和离网场景。两者并行发展格局持续，铂族金属催化剂需求将同步受益。", "content": "截至2026年4月底，国内头部碱性电解槽企业在手订单合计规模约10GW，其中国内约7.5GW、海外约2.5GW。碱性技术成熟、成本低，占国内绿氢项目98%以上份额，但PEM电解槽在响应速度和电流密度方面优势显著，更适配分布式和离网场景。两者并行发展格局持续，铂族金属催化剂需求将同步受益。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1178", "title": "由于钯金价格长期高企，汽车制造商正系统性将催化剂配方从钯金切换至更便宜的铂金，且切换完成后难以逆转。同时，中国\\\"国七\\\"和欧盟\\\"欧七\\\"排放标准的实施，意味着每辆燃油车需装载更多铂族金属。WPIC预测，到2030年汽车催化剂领域铂金需求将显著增长。铂→钯替代与排放标准双轮驱动，为铂金需求提供长期", "content": "由于钯金价格长期高企，汽车制造商正系统性将催化剂配方从钯金切换至更便宜的铂金，且切换完成后难以逆转。同时，中国\\\"国七\\\"和欧盟\\\"欧七\\\"排放标准的实施，意味着每辆燃油车需装载更多铂族金属。WPIC预测，到2030年汽车催化剂领域铂金需求将显著增长。铂→钯替代与排放标准双轮驱动，为铂金需求提供长期确定性增量。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1177", "title": "工信部、国家发改委等五部门联合发布《工业产品绿色设计指南（2026年版）》，明确将\\\"氢能装备\\\"列为重点行业，要求燃料电池催化剂采用Pt/La-Mo₂N等新型材料，电解槽电极采用多孔镍基材料，关键连接件选用高纯度不锈钢或镀覆防腐涂层。该指南为氢能装备全生命周期绿色设计提供了官方指引，有利于推动铂基", "content": "工信部、国家发改委等五部门联合发布《工业产品绿色设计指南（2026年版）》，明确将\\\"氢能装备\\\"列为重点行业，要求燃料电池催化剂采用Pt/La-Mo₂N等新型材料，电解槽电极采用多孔镍基材料，关键连接件选用高纯度不锈钢或镀覆防腐涂层。该指南为氢能装备全生命周期绿色设计提供了官方指引，有利于推动铂基催化剂向高活性、长寿命方向升级。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_1176", "title": "上海大学团队在《Frontiers in Energy》发表综述论文，系统解析铂基单原子催化剂在PEMFC中的突破性进展", "content": "通过将铂原子以原子级分散在载体上，催化剂质量活性达到商业铂碳材料的5.3倍，铂用量可降低90%，为氢能大规模应用扫清关键障碍。单原子催化剂技术从实验室走向产业化仍需时日，但其技术路线验证了\\\"铂载量大幅降低\\\"的可行性路径，对铂源催化事业部的产品研发方向具有重要参考意义。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "bych"}, {"id": "news_1175", "title": "5月11日，高能环境在互动平台披露", "content": "截至2025年末，公司资源循环利用板块已形成年产铂3吨、钯3吨、钌3吨、铑5吨以上的产能规模。钌广泛应用于化工催化、电子半导体、新能源及氯碱工业等领域，高催化活性、耐腐蚀、耐高温特性突出。该产能规模在国内铂族金属回收领域具有代表性，对铂源催化事业部的原料采购和行业对标具有参考价值。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "bych"}, {"id": "news_1174", "title": "工信部、国家发改委等五部门近日联合发布《工业产品绿色设计指南（2026年版）》，明确将\\\"氢能装备\\\"列为重点行业，并从\\\"长寿命设计\\\"维度提出", "content": "燃料电池催化剂采用Pt/La-Mo₂N等新型材料，电解槽电极采用多孔镍基材料，关键连接件选用高纯度不锈钢或镀覆抗腐蚀导电涂层材料。该政策导向意味着燃料电池催化剂向高性能、低铂载量方向发展的政策支持力度进一步加大，有利于铂基催化剂的市场长期需求。铂源催化事业部可结合政策方向，重点布局Pt/La-Mo₂N等新型催化剂材料的研发与市场验证。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "bych"}, {"id": "news_1173", "title": "5月11日，国际现货铂金大幅走高，据Trading Economics基准数据，当日铂价触及约2,153美元/盎司，日涨幅约4.55%，近一个月涨幅3.61%，较去年同期飙涨超120%，成为年内最强贵金属品种之一。本轮上涨的核心驱动因素包括", "content": "（1）南非矿业生产扰动叠加俄罗斯出口制裁持续压缩供应端；（2）汽车行业钯→铂催化剂配方切换加速；（3）地缘风险溢价再度升温。WPIC维持2026年全球铂金市场供应缺口约80万盎司的预测，短缺格局未改。铂金价格强势对铂源催化事业部的原料采购成本构成压力，但同步提升铂族金属回收业务的利润空间，建议密切跟踪国内铂族金属回收市场价格波动，择机锁定长期供应协议。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "bych"}, {"id": "news_1167", "title": "国家电投集团山东能源发展有限公司2026年第十五批招标——储能电站锂离子电池参数辨识及热失控预警技术研究项目框架招标于5月11日发布中标候选人公示。", "content": "国家电投集团山东能源发展有限公司2026年第十五批招标——储能电站锂离子电池参数辨识及热失控预警技术研究项目框架招标于5月11日发布中标候选人公示。", "source": "电力集采招标网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1166", "title": "5月11日，锂电池循环经济产业园基础设施补短建设项目正式发布招标公告，资金来源为财政资金，专门面向中小企业采购，投标截止时间2026年6月1日。", riority": "P2", "dept": "sjld"}, {"id": "news_1159", "title": "川能动力5月11日在业绩说明会上表示，李家沟锂矿已实现达产满产，产品按市场价销售；德阿锂业3万吨锂盐项目碳酸锂产线已投产，氢氧化锂产线尚未投产。", "content": "川能动力5月11日在业绩说明会上表示，李家沟锂矿已实现达产满产，产品按市场价销售；德阿锂业3万吨锂盐项目碳酸锂产线已投产，氢氧化锂产线尚未投产。", "source": "金融界", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1158", "title": "针对市场传闻电池将征消费税，中伟新材回应：根据财税〔2015〕16号，锂离子蓄电池（包括动力和储能电池）自2015年2月1日起即被列入免征消费税名单，现有政策不受影响。", "content": "针对市场传闻电池将征消费税，中伟新材回应：根据财税〔2015〕16号，锂离子蓄电池（包括动力和储能电池）自2015年2月1日起即被列入免征消费税名单，现有政策不受影响。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1157", "title": "永杉锂业5月9日公告签署《锂盐项目投资协议》，拟出资5.94亿元（持股99%）成立合资公司，一期建设年产万吨级锂盐产能；公司一季度营收同比增长90%。", "content": "永杉锂业5月9日公告签署《锂盐项目投资协议》，拟出资5.94亿元（持股99%）成立合资公司，一期建设年产万吨级锂盐产能；公司一季度营收同比增长90%。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1156", "title": "国家知识产权局信息显示，格林美（无锡）能源材料有限公司申请高镍正极材料相关专利，采用铌盐熔盐助掺杂工艺，提升正极材料结构稳定性。", "content": "国家知识产权局信息显示，格林美（无锡）能源材料有限公司申请高镍正极材料相关专利，采用铌盐熔盐助掺杂工艺，提升正极材料结构稳定性。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1155", "title": "5月11日，国家知识产权局披露金禾实业新获\\\"一种以二乙基硫醚为硫源制备硫化锂的方法及其应用\\\"发明专利授权，产物纯度≥99.9%，适用于固态电池领域。", "content": "5月11日，国家知识产权局披露金禾实业新获\\\"一种以二乙基硫醚为硫源制备硫化锂的方法及其应用\\\"发明专利授权，产物纯度≥99.9%，适用于固态电池领域。", "source": "金融界", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1154", "title": "德方纳米5月11日在投资者互动平台表示，磷酸铁锂、三元材料、磷酸锰铁锂等正极材料均可用于固态电池；公司已建成45万吨/年磷酸盐系正极材料产能，其中19万吨可共线生产磷酸铁锂和磷酸锰铁锂。", "content": "德方纳米5月11日在投资者互动平台表示，磷酸铁锂、三元材料、磷酸锰铁锂等正极材料均可用于固态电池；公司已建成45万吨/年磷酸盐系正极材料产能，其中19万吨可共线生产磷酸铁锂和磷酸锰铁锂。", "source": "金融界", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1153", "title": "容百科技5月11日收报38.24元，跌2.2%，换手率5.37%，成交额14.67亿元。容百同日发布\\\"提质增效重回报\\\"行动方案（2026年度）。", "content": 池产品出口退税率，计划未来完全取消。政策为电池企业预留约一个季度\\\"抢出口\\\"窗口期，短期刺激效应明显。", "content": "相关部门发布公告将调整电池产品出口退税率，计划未来完全取消。政策为电池企业预留约一个季度\\\"抢出口\\\"窗口期，短期刺激效应明显。", "source": "长江有色", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1145", "title": "5月9日国务院常务会议审议通过《矿产资源法实施条例（草案）》，明确锂矿列入战略性矿产资源目录，审批权收归自然资源部直管，实行保护性开采和总量调控，伴生锂资源将受到更严格管控。", "content": "5月9日国务院常务会议审议通过《矿产资源法实施条例（草案）》，明确锂矿列入战略性矿产资源目录，审批权收归自然资源部直管，实行保护性开采和总量调控，伴生锂资源将受到更严格管控。", "source": "国务院官网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1144", "title": "5月7日，工信部、生态环境部、商务部、海关总署、市场监管总局五部委联合启动动力电池回收利用专项执法行动，聚焦\\\"白名单\\\"外小作坊及无资质回收点，推动行业规范化发展。", "content": "5月7日，工信部、生态环境部、商务部、海关总署、市场监管总局五部委联合启动动力电池回收利用专项执法行动，聚焦\\\"白名单\\\"外小作坊及无资质回收点，推动行业规范化发展。", "source": "工信部官网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1142", "title": "国家电投储能电站锂离子电池热失控预警技术研究框架招标（5月11日）", "content": "国家电投集团山东能源发展有限公司2026年第十五批招标——储能电站锂离子电池参数辨识及热失控预警技术研究项目框架招标于5月11日发布中标候选人公示。", "source": "电力集采招标网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1141", "title": "锂电池循环经济产业园基础设施补短建设项目（5月11日正式招标）", "content": "5月11日，锂电池循环经济产业园基础设施补短建设项目正式发布招标公告，资金来源为财政资金，专门面向中小企业采购，投标截止时间2026年6月1日。", "source": "中国电力招标网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1140", "title": "桂阳县汉尧锂业年产2万吨电池级碳酸锂项目（湖南郴州）厂房装修劳务招标", "content": "桂阳县汉尧锂业年产20,000吨电池级碳酸锂项目厂房装饰装修工程劳务分包正在招标，建筑面积约71,771平方米，招标截止时间为2026年5月（相关节点）。", "source": "中国电力招标网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1139", "title": "四川年产10万吨磷酸铁锂正极材料项目（总投资19亿）进入施工招标阶段", "content": "四川某地年产10万吨磷酸铁锂正极材料项目施工标段进入拟招标安排，招标方式为公开招标，估算价3,800万元，拟招标时间为2026年6月15日。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1138", "title": "年比亚迪20GWh全固态电池产线已投产", "content": "2026年，比亚迪20GWh全固态电池产线已投产，国轩高科等企业量产线设计完成；麒麟凝聚态电池续航已能突破1500公里。", "source": "电车有点料", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1137", "title": "年或为钠电池规模化元年，全球出货量预计突破30GWh", "content": "CIBF2026展会上，珈钠能源、鹏辉能源等企业将展示钠电池量产成果；机构预计2026年全球钠电池出货量将突破30GWh，同比+198%，宁德时代等头部企业Q4将启动量产。", "source": "财联社", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1136", "title": "全固态电池距离规模化商用仍需3-5年，成本为液态电池6-8倍", "content": "中科院院士欧阳明高表示，全固态电池预计还需3-5年才能实现装车验证，装车验证与规模化量产是两码事；华泰证券测算其综合成本约为传统液态电池的6-8倍，100kWh电池包初期成本可能高达20万元。", "source": "车界微视察", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1135", "title": "宁德时代第三代神行超充电池：常温6分27秒充至98%，-30℃极寒仅9分钟", "content": "宁德时代第三代神行超充电池在超充性能上持续突破，常温下6分27秒即可充电至98%，即使在-30℃极寒环境下也仅需9分钟，显著提升电动车补能体验。", "source": "电车有点料", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1134", "title": "机构：锂电产业链景气度有望持续上行", "content": "机构研报指出，5月锂电池环节6家企业合计排产约164.6GWh，同比+57%、环比+8%，行业高景气依旧；CIBF展会临近，固态电池与钠电池新技术持续催化。", "source": "东方财富", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1133", "title": "出口退税率调整，电池企业\\\"抢出口\\\"窗口期开启", "content": "相关部门发布公告将调整电池产品出口退税率，计划未来完全取消。政策为电池企业预留约一个季度\\\"抢出口\\\"窗口期，短期刺激效应明显。", "source": "长江有色", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1132", "title": "《矿产资源法实施条例》通过，锂矿审批权收归自然资源部（5月9日）", "content": "5月9日国务院常务会议审议通过《矿产资源法实施条例（草案）》，明确锂矿列入战略性矿产资源目录，审批权收归自然资源部直管，实行保护性开采和总量调控，伴生锂资源将受到更严格管控。", "source": "国务院官网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1131", "title": "五部委联合执法：动力电池回收专项启动（5月7日）", "content": "5月7日，工信部、生态环境部、商务部、海关总署、市场监管总局五部委联合启动动力电池回收利用专项执法行动，聚焦\\\"白名单\\\"外小作坊及无资质回收点，推动行业规范化发展。", "source": "工信部官网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sjld"}, {"id": "news_1130", "title": "川能动李家沟锂矿达产满产，德阿锂业3万吨锂盐项目碳酸锂线已投产", "content": "川能动力5月11日在业绩说明会上表示，李家沟锂矿已实现达产满产，产品按市场价销售；德阿锂业3万吨锂盐项目碳酸锂产线已投产，氢氧化锂产线尚未投产。", "source": "金融界", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "sjld"}, {"id": "news_1129", "title": "中伟新材回应消费税传闻：锂离子蓄电池免征消费税不受影响", "content": "针对市场传闻电池将征消费税，中伟新材回应：根据财税〔2015〕16号，锂离子蓄电池（包括动力和储能电池）自2015年2月1日起即被列入免征消费税名单，现有政策不受影响。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "sjld"}, {"id": "news_1128", "title": "永杉锂业拟6亿元投建锂盐项目，一季度营收同比增长90%", "content": "永杉锂业5月9日公告签署《锂盐项目投资协议》，拟出资5.94亿元（持股99%）成立合资公司，一期建设年产万吨级锂盐产能；公司一季度营收同比增长90%。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "sjld"}, {"id": "news_1127", "title": "格林美无锡公司申请高镍正极材料铌盐掺杂专利", "content": "国家知识产权局信息显示，格林美（无锡）能源材料有限公司申请高镍正极材料相关专利，采用铌盐熔盐助掺杂工艺，提升正极材料结构稳定性。", "source": "新浪财经", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1126", "title": "德方纳米：所有正极材料均可用于固态电池，已建成45万吨/年产能", "content": "德方纳米5月11日在投资者互动平台表示，磷酸铁锂、三元材料、磷酸锰铁锂等正极材料均可用于固态电池；公司已建成45万吨/年磷酸盐系正极材料产能，其中19万吨可共线生产磷酸铁锂和磷酸锰铁锂。", "source": "金融界", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1125", "title": "容百科技股价5月11日下跌2.20%，主力资金净流出1.32亿", "content": "容百科技5月11日收报38.24元，跌2.2%，换手率5.37%，成交额14.67亿元。容百同日发布\\\"提质增效重回报\\\"行动方案（2026年度）。", "source": "证券之星", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1124", "title": "华友钴业14.3亿拟收购非洲Atlantic Lithium 100%股权", "content": "华友钴业5月7日公告，公司拟以协议安排方式收购大西洋锂业（Atlantic Lithium Limited）100%股权，耗资约14.3亿元，以深化海外资源布局；5月10日签署《合同更替协议》，以7090万美元承接Piedmont公司在加纳锂矿项目相关权利义务。", "source": "华友钴业公告", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1123", "title": "宁德时代5月排产首破100GWh，产能利用率维持85%-90%高位", "content": "机构数据显示，宁德时代5月月度产能已全面突破80GWh，排产首超100GWh，二季度排产饱和，储能电芯占比持续提升。", "source": "雪球", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1122", "title": "国轩高科4月装车量跃居第三，份额6.50%", "content": "国轩高科4月装车量4.05GWh，份额6.50%，较3月提升0.53个百分点，排名升至国内第三。", "source": "CNEVPost", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1121", "title": "比亚迪4月装车量16.83%，份额环比下滑约1个百分点", "content": "比亚迪4月装车量10.49GWh，市场份额16.83%，较3月的17.83%下滑约1个百分点。", "source": "CNEVPost", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1120", "title": "宁德时代4月动力电池装车量份额46.64%，巩固龙头地位", "content": "5月11日，中国汽车动力电池产业创新联盟发布4月数据，宁德时代以46.64%的装车量份额稳居第一，较3月提升1.1个百分点。", "source": "CNEVPost", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1119", "title": "宁德时代5月排产首破100GWh，储能/动力双旺驱动产业链主升浪", "content": "机构数据显示，宁德时代5月排产首次突破100GWh，同比大幅增长；5月6家企业合计排产约164.6GWh，同比+57%、环比+8%，行业高景气延续。头部企业订单普遍排至2026年底至2027年，产能利用率维持85%-90%高位。宁德时代与Togg达成磐石底盘量产合作，与湖南钢铁集团达成全面战略合作。CIBF2026展会临近，固态电池、钠电池新技术密集亮相在即，催化效应持续释放。\n\n---\n\n市场/价格", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1118", "title": "五部委5月联合开展动力电池回收执法行动，印尼政策持续扰动镍产业链", "content": "5月7日，工信部、生态环境部、商务部、海关总署、市场监管总局五部委联合启动动力电池回收利用专项执法行动，剑指\\\"白名单\\\"外小作坊和无资质回收点，规范市场秩序。政策端同受关注的还有：国务院常务会议5月9日审议通过《矿产资源法实施条例（草案）》，明确锂矿审批权收归自然资源部，推行保护性开采与总量调控。产业侧，印尼拟上调铜金锡矿特许费，导致中资镍企成本飙升25%-30%，华友钴业印尼湿法冶炼阶段性停产近48%设计产能，格林美终止2.3亿美元印尼增资计划。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1117", "title": "碳酸锂期/现货双双逼近20万/吨，锂价涨势凌厉", "content": "5月11日，国内碳酸锂期货主力合约盘中持续走高，最终报收20.50万元/吨，日涨幅3.51%，最高触及20.56万元/吨，刷新阶段性新高。现货方面，Mysteel数据显示电池级碳酸锂（晚盘）均价报195,400元/吨，较前一交易日上涨2,150元/吨；百川盈孚数据显示电池级碳酸锂均价报197,500元/吨，单日上涨3,000元/吨。长江有色数据显示，电池级碳酸锂(99.5%)现货均价报197,500元/吨，工业级碳酸锂(99.2%)均价报194,500元/吨。瑞银当日发布报告，上调2026年中国碳酸锂均价预测18%至20万元/吨，预计5-6月现货价格将冲高至25万元/吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_1114", "title": "格林美2026年研发重点转向超比能量、高压、固态电池前沿技术，推动\\\"AI+研发+制造\\\"智能创新平台建设，实施\\\"超级引领+精益工艺创新\\\"双轨创新战略，实现从技术突破到行业引领的跃迁，目标在前沿电池技术领域率先实现商业化突破。", "content": "格林美2026年研发重点转向超比能量、高压、固态电池前沿技术，推动\\\"AI+研发+制造\\\"智能创新平台建设，实施\\\"超级引领+精益工艺创新\\\"双轨创新战略，实现从技术突破到行业引领的跃迁，目标在前沿电池技术领域率先实现商业化突破。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1113", "title": "格林美自2022年起在湖北荆门累计投资10.66亿元布局电池回收项目，2025年退役电池回收利用量5.2万吨，占中国社会报废量超10%。其自主研发的智能无损拆解技术使效率翻倍、成本降低44%，镍钴回收率超过99%。格林美已构建\\\"废旧电池回收—原料再制造—材料再制造\\\"完整产业闭环，覆盖珠三角、长三", "content": "格林美自2022年起在湖北荆门累计投资10.66亿元布局电池回收项目，2025年退役电池回收利用量5.2万吨，占中国社会报废量超10%。其自主研发的智能无损拆解技术使效率翻倍、成本降低44%，镍钴回收率超过99%。格林美已构建\\\"废旧电池回收—原料再制造—材料再制造\\\"完整产业闭环，覆盖珠三角、长三角、京津冀、华中区域6个动力锂电池回收工厂，合作产业链企业超1000家。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1112", "title": "宁德时代旗下邦普循环已建成全国最大定向循环基地，镍钴锰回收率99.6%、锂回收率93.8%，年处理退役电池能力达27万吨。2026年30万吨废旧动力电池回收产能在建，未来规划实现超百万吨动力电池回收产能。作为\\\"电池巨头\\\"阵营代表，邦普循环以产业链协同与技术标准话语权为核心筹码，主导制定全国超80", "content": "宁德时代旗下邦普循环已建成全国最大定向循环基地，镍钴锰回收率99.6%、锂回收率93.8%，年处理退役电池能力达27万吨。2026年30万吨废旧动力电池回收产能在建，未来规划实现超百万吨动力电池回收产能。作为\\\"电池巨头\\\"阵营代表，邦普循环以产业链协同与技术标准话语权为核心筹码，主导制定全国超80%的锂电池回收国家标准。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1111", "title": "5月8日格林美以\\\"深圳总部+印尼苏拉威西青美邦园区\\\"两地连线+线上直播形式召开2025年年度业绩说明会，主题\\\"抢抓机缘，创造茁壮成长想象力\\\"。董事长许开华教授发表经营发展报告称，公司将构建\\\"AI+研发+制造\\\"智能创新平台，聚焦超比能量、高压、固态电池前沿赛道，推动从技术突破向行业引领跃迁", "content": "5月8日格林美以\\\"深圳总部+印尼苏拉威西青美邦园区\\\"两地连线+线上直播形式召开2025年年度业绩说明会，主题\\\"抢抓机缘，创造茁壮成长想象力\\\"。董事长许开华教授发表经营发展报告称，公司将构建\\\"AI+研发+制造\\\"智能创新平台，聚焦超比能量、高压、固态电池前沿赛道，推动从技术突破向行业引领跃迁。2025年公司实现营收371.24亿元（同比+11.82%）。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1110", "title": "5月11日格林美发布投资者关系活动记录表（2026年5月全球投资者接待日活动）。2026年Q1动力电池回收量15,076吨（同比+40%），2025年全年拆解量52,576吨（同比+46%），超过中国社会报废量10%。公司董事长许开华表示，将实施\\\"降负债、去库存、控投资\\\"三大行动，目标3年内资产", "content": "5月11日格林美发布投资者关系活动记录表（2026年5月全球投资者接待日活动）。2026年Q1动力电池回收量15,076吨（同比+40%），2025年全年拆解量52,576吨（同比+46%），超过中国社会报废量10%。公司董事长许开华表示，将实施\\\"降负债、去库存、控投资\\\"三大行动，目标3年内资产负债率降至60%以下、综合毛利率提升至20%以上，以\\\"不扩产不打折\\\"践行\\\"反内卷\\\"，2026年全年回收目标8万吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1109", "title": "5月1日起，工信部、生态环境部、商务部、海关总署、市场监管总局五部门联合执法专项行动正式启动，重点核查三大方向：①动力电池溯源编码（数字身份证）执行情况；②跨境出口合规备案；③梯次利用资质有效性。该行动将持续至2026年底，覆盖回收、贮存、运输、梯次利用、再生全链条。行业分析认为，联合执法有望将合规", "content": "5月1日起，工信部、生态环境部、商务部、海关总署、市场监管总局五部门联合执法专项行动正式启动，重点核查三大方向：①动力电池溯源编码（数字身份证）执行情况；②跨境出口合规备案；③梯次利用资质有效性。该行动将持续至2026年底，覆盖回收、贮存、运输、梯次利用、再生全链条。行业分析认为，联合执法有望将合规产能利用率从当前的15.5%显著提升，扭转\\\"劣币驱逐良币\\\"格局。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1108", "title": "🏭 安徽淮南：5万吨废旧锂电池综合利用项目（含6,000吨/年碳酸锂前驱体）", "content": "淮南项目涵盖拆解、梯次利用、破碎分选、湿法萃取全流程，总投资规模覆盖废旧三元锂和磷酸铁锂两条技术路线，建成后将成为中部地区重要回收加工基地。\n\n---", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1107", "title": "🏭 邦普循环：30万吨废旧动力电池回收产能2026年加紧建设", "content": "宁德时代旗下邦普循环2026年全力推进30万吨废旧动力电池回收新产能建设，未来规划达到超百万吨级回收产能，进一步巩固全国最大定向循环基地地位。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1106", "title": "🏭 格林美荆门：10.66亿元电池回收项目，2025年已回收5.2万吨", "content": "格林美自2022年起在荆门累计投资10.66亿元，已形成年处理数万吨退役电池产能，2025年实际回收利用量5.2万吨。公司持续推进回收网络建设，目标覆盖全国主要新能源汽车保有区域。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1105", "title": "🔬 格林美聚焦固态电池前沿赛道，布局\\\"AI+研发+制造\\\"智能创新", "content": "格林美2026年研发重点转向超比能量、高压、固态电池前沿技术，推动\\\"AI+研发+制造\\\"智能创新平台建设，实施\\\"超级引领+精益工艺创新\\\"双轨创新战略，实现从技术突破到行业引领的跃迁，目标在前沿电池技术领域率先实现商业化突破。\n\n---\n\n项目/招标", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1104", "title": "🔬 选择性协同逐步浸出策略：从废旧NCM正极全面回收有价金属", "content": "2026年5月学术研究提出新型废旧锂电池正极材料回收工艺——选择性协同逐步浸出策略，通过草酸浸出（选择性浸出锂并还原过渡金属）、过硫酸钠浸出（选择性氧化钴和锰）、氨浸出（实现镍选择性分离）三步流程，从废弃LiNiₓCoᵧMn₁₋ₓ₋ᵧO₂正极中高效提取锂、镍、钴、锰四种有价金属，为高压高镍正极的定向回收提供技术路径。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1103", "title": "📌 退役高峰临界点：2026年动力电池报废量预计达43GWh（约百万吨级）", "content": "据行业预测，2026年我国动力电池退役量将达到约43GWh，对应市场规模将冲向1800亿元。格林美预计2027年行业进入规模化报废阶段，动力电池将以53.6%的年复合增长率持续攀升至2031年。目前行业产能利用率仅约15.5%，但随着最严新规落地与执法推进，合规企业市场份额有望快速提升。\n\n---\n\n企业动态\n\n\n\n5月11日格林美发布投资者关系活动记录表（2026年5月全球投资者接待日活动）。2026年Q1动力电池回收量15,076吨（同比+40%），2025年全年拆解量52,576吨（同比+46%），超过中国社会报废量10%。公司董事长许开华表示，将实施\\\"降负债、去库存、控投资\\\"三大行动，目标3年内资产负债率降至60%以下、综合毛利率提升至20%以上，以\\\"不扩产不打折\\\"践行\\\"反内卷\\\"，2026年全年回收目标8万吨。\n\n\n\n5月8日格林美以\\\"深圳总部+印尼苏拉威西青美邦园区\\\"两地连线+线上直播形式召开2025年年度业绩说明会，主题\\\"抢抓机缘，创造茁壮成长想象力\\\"。董事长许开华教授发表经营发展报告称，公司将构建\\\"AI+研发+制造\\\"智能创新平台，聚焦超比能量、高压、固态电池前沿赛道，推动从技术突破向行业引领跃迁。2025年公司实现营收371.24亿元（同比+11.82%）。\n\n\n\n宁德时代旗下邦普循环已建成全国最大定向循环基地，镍钴锰回收率99.6%、锂回收率93.8%，年处理退役电池能力达27万吨。2026年30万吨废旧动力电池回收产能在建，未来规划实现超百万吨动力电池回收产能。作为\\\"电池巨头\\\"阵营代表，邦普循环以产业链协同与技术标准话语权为核心筹码，主导制定全国超80%的锂电池回收国家标准。\n\n\n\n格林美自2022年起在湖北荆门累计投资10.66亿元布局电池回收项目，2025年退役电池回收利用量5.2万吨，占中国社会报废量超10%。其自主研发的智能无损拆解技术使效率翻倍、成本降低44%，镍钴回收率超过99%。格林美已构建\\\"废旧电池回收—原料再制造—材料再制造\\\"完整产业闭环，覆盖珠三角、长三角、京津冀、华中区域6个动力锂电池回收工厂，合作产业链企业超1000家。\n\n\n\n华友钴业5月7日公告拟以2.1亿美元（约14.3亿元）收购大西洋锂业（Atlantic Lithium）100%股权，获得加纳Ewoyaa锂矿项目权益。5月10日晚，华友香港与Piedmark等各方签署《合同更替协议》，进一步收购Ewoyaa锂矿少数股东权益，交易对价7090万美元。5月11日披露最新进展：推进子公司受让相关权利义务暨收购Atlantic Lithium Limited股权事宜，项目交割仍在推进中，存在不确定性。\n\n\n\n5月11日华友钴业发布2025年年度权益分派实施公告，每股派发现金红利0.5元（含税），股权登记日为2026年5月18日，除权（息）基准日另行公告，共计派发现金红利9.48亿元。\n\n\n\n5月11日，印度LICO Materials宣布获得关键矿物回收激励，将投资建设锂、镍、钴回收项目，从报废电池中回收电池级纯度达99%的关键矿物。项目将在其现有25,000吨/年机械处理产能基础上，新增10,000吨/年湿法冶炼提取产能，在卡纳塔克邦建设电池拆解分类与关键矿物提取两座工厂。该项目聚焦印度本土电池回收市场，与中国回收企业形成跨国产能竞争。\n\n\n\n安徽省淮南市引进废旧锂电池综合利用项目，新建1条废旧锂电池包拆解线、1条锂电池梯次利用PACK组装生产线、2条锂电池破碎分选生产线（废旧三元/磷酸铁锂各1条）、1条磷酸铁锂黑粉湿法萃取线。建成后年回收处置5万吨废旧锂电池（部分梯次利用），制备6,000吨/年碳酸锂等前驱体材料，标志着中部地区回收产能持续扩容。\n\n---\n\n技术/产品", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1102", "title": "📌 新规明确回收率硬指标：锂≥85%、镍钴锰≥98%", "content": "《新能源汽车废旧动力电池回收和综合利用管理暂行办法》明确，废旧动力电池的镍、钴、锰综合回收率不低于98%，锂回收率不低于85%。高回收率标准直接提升旧电池的利用价值，是回收价格体系透明化的制度基础，正规回收渠道报价竞争力显著增强。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1101", "title": "📌 工信部等五部门联合执法专项行动推进中（5月1日起）", "content": "5月1日起，工信部、生态环境部、商务部、海关总署、市场监管总局五部门联合执法专项行动正式启动，重点核查三大方向：①动力电池溯源编码（数字身份证）执行情况；②跨境出口合规备案；③梯次利用资质有效性。该行动将持续至2026年底，覆盖回收、贮存、运输、梯次利用、再生全链条。行业分析认为，联合执法有望将合规产能利用率从当前的15.5%显著提升，扭转\\\"劣币驱逐良币\\\"格局。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_1100", "title": "自2026年4月1日《新能源汽车废旧动力电池回收和综合利用管理暂行办法》正式施行以来，行业进入规范化发展拐点。5月1日起，工信部等五部门联合执法专项行动在全国范围内展开，聚焦回收、贮存、运输、利用全链条，重点打击三类违法行为", "content": "无资质小作坊非法拆解电池包、将退役汽车动力电池违规改装用于电动自行车，以及跨境非法出口等。该行动被业界称为\\\"史上最严\\\"，首次明确\\\"车电一体报废\\\"制度，从源头阻断电池流向灰色渠道。随着监管趋严，合规产能利用率有望显著提升。\n\n\n\n5月11日 Mysteel 数据显示，电池级碳酸锂现货价格稳定在 19.5万元/吨；SMM 同期报告指出碳酸锂现货价格持续上行，期货市场碳酸锂2609合约开盘后半小时内快速拉升站稳。瑞银将2026年中国碳酸锂均价预测上调18%至20万元/吨，并预计5-6月现货价格将冲高至25万元/吨。随着新能源汽车退役电池规模放量，锂资源供需缺口持续支撑价格中枢上移。\n\n\n\n5月11日，格林美（002340）发布投资者关系活动记录，披露2026年第一季度动力电池回收量达 15,076吨，同比增长40%，延续高速增长态势。2025年全年拆解量52,576吨（同比+46%），超过中国社会报废量10%。公司董事长许开华明确2026年行动计划：①降负债、去库存、控投资；②3年内资产负债率降至60%以下；③综合毛利率提升至20%以上；④2026年全年回收目标 8万吨，覆盖珠三角、长三角、京津冀、华中六大回收工厂。\n\n---\n\n市场/价格\n\n\n\n\n\n\n\n---\n\n政策/行业", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "sdmd"}, {"id": "news_1098", "title": "津巴布韦此前2月宣布禁止锂矿出口，预计5月国内锂矿进口量将明显下降。津巴布韦第一批锂矿1–2万吨预计5月中旬前后发出，海运顺利情况下部分企业6月下旬方可到港，部分企业面临锂矿\\\"青黄不接\\\"局面。5月澳矿到货预计40万吨左右，津巴到货大幅减少，锂矿以去库为主，锂矿加工费已跌破1.8万元/吨。", "content": "津巴布韦此前2月宣布禁止锂矿出口，预计5月国内锂矿进口量将明显下降。津巴布韦第一批锂矿1–2万吨预计5月中旬前后发出，海运顺利情况下部分企业6月下旬方可到港，部分企业面临锂矿\\\"青黄不接\\\"局面。5月澳矿到货预计40万吨左右，津巴到货大幅减少，锂矿以去库为主，锂矿加工费已跌破1.8万元/吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1097", "title": "5月11日披露专利授权显示，金禾实业新获\\\"一种以二乙基硫醚为硫源制备硫化锂的方法及其产品和应用\\\"发明专利，产物纯度≥99.9%，适用于固态电池领域。", "content": "5月11日披露专利授权显示，金禾实业新获\\\"一种以二乙基硫醚为硫源制备硫化锂的方法及其产品和应用\\\"发明专利，产物纯度≥99.9%，适用于固态电池领域。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1096", "title": "深圳新星5月11日公告，首次公开发行募集资金投资项目\\\"年产1.5万吨六氟磷酸锂建设项目三期\\\"建设完成并投产，项目整体已全部建成，形成年产能合计12,800吨。", "content": "深圳新星5月11日公告，首次公开发行募集资金投资项目\\\"年产1.5万吨六氟磷酸锂建设项目三期\\\"建设完成并投产，项目整体已全部建成，形成年产能合计12,800吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1095", "title": "盐湖股份股价小幅回落，成交额49.51亿元，换手率2.47%。公司已建成全球单套规模最大的盐湖提锂装置，采用\\\"连续离子交换移动床+膜耦合\\\"核心技术，锂收率预计提升约25%。", "content": "盐湖股份股价小幅回落，成交额49.51亿元，换手率2.47%。公司已建成全球单套规模最大的盐湖提锂装置，采用\\\"连续离子交换移动床+膜耦合\\\"核心技术，锂收率预计提升约25%。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1094", "title": "赣锋锂业全天缩量震荡收阳，技术指标显示底部逐步抬升，MACD零轴下方绿柱持续缩短，短线止跌企稳信号明显。瑞银重申\\\"买入\\\"评级并上调目标价。", "content": "赣锋锂业全天缩量震荡收阳，技术指标显示底部逐步抬升，MACD零轴下方绿柱持续缩短，短线止跌企稳信号明显。瑞银重申\\\"买入\\\"评级并上调目标价。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1093", "title": "广州期货交易所联合中国期货市场监控中心，将于5月15日在广东深圳举办\\\"新能源·向未来\\\"碳酸锂业务专题培训，议题涵盖碳酸锂行业供需格局现状及发展趋势、储能产业发展及政策分析，同步线上直播。", "content": "广州期货交易所联合中国期货市场监控中心，将于5月15日在广东深圳举办\\\"新能源·向未来\\\"碳酸锂业务专题培训，议题涵盖碳酸锂行业供需格局现状及发展趋势、储能产业发展及政策分析，同步线上直播。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1092", "title": "第十八届深圳国际电池技术交流会/展览会（CIBF2026）将于5月13日至15日在深圳举办，预计吸引超3,000家国内外电池生态企业参展。大会设置7个专场，涵盖储能用钠离子电池与固态电池、长时储能与混合储能、构网型储能系统、储能安全与检测认证等，并邀请储能头部企业就\\\"十五五\\\"储能产业发展作主题报", "content": "第十八届深圳国际电池技术交流会/展览会（CIBF2026）将于5月13日至15日在深圳举办，预计吸引超3,000家国内外电池生态企业参展。大会设置7个专场，涵盖储能用钠离子电池与固态电池、长时储能与混合储能、构网型储能系统、储能安全与检测认证等，并邀请储能头部企业就\\\"十五五\\\"储能产业发展作主题报告。碳酸锂价格重返19–20万元/吨区间成为展会焦点。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1091", "title": "▶ 5月碳酸锂社库由累转去，供需缺口或再度打开", "content": "据SMM周度数据，当周碳酸锂库存102,673吨，环比去库920吨，由累库转为去库，且去库幅度有望走扩。5月下游表需预计超15万吨，环比增速超供应端，叠加进口量高增态势难以持续，供需缺口或再度打开，支撑锂价进一步上行。\n\n---\n\n⑦ 龙蟠时代事业部专属提示", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1090", "title": "▶ 江西云母矿换证流程或影响5–6月国产供应", "content": "江西省自然资源厅4月公示的四家核心锂云母矿采矿权出让收益评估报告，市场预计相关矿企5–6月停产换证。辉石产和云母产碳酸锂产量增长受限，5月整体碳酸锂产量环比增幅或仅3%，低于需求增速。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1089", "title": "▶ 津巴布韦锂矿出口受限持续，5–6月国内原料将持续紧张", "content": "津巴布韦此前2月宣布禁止锂矿出口，预计5月国内锂矿进口量将明显下降。津巴布韦第一批锂矿1–2万吨预计5月中旬前后发出，海运顺利情况下部分企业6月下旬方可到港，部分企业面临锂矿\\\"青黄不接\\\"局面。5月澳矿到货预计40万吨左右，津巴到货大幅减少，锂矿以去库为主，锂矿加工费已跌破1.8万元/吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1088", "title": "▶ 光华科技硫化锂产品已推向市场", "content": "光华科技5月11日在互动平台表示，公司硫化锂产品已推向市场，产能建设、客户验证及订单推进均按计划稳步进行。\n\n---\n\n⑥ 项目/招标", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1087", "title": "▶ 亿纬锂能发布商用车开源电池4.0 AI Battery系列", "content": "亿纬锂能5月11日举办第二届商用车电池科技日，展示全新开源电池4.0 AI Battery系列，AI赋能电池管理系统，能量密度与管理效率双提升。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1086", "title": "▶ 德方纳米45万吨/年磷酸盐正极材料产能就绪", "content": "德方纳米5月11日在投资者互动平台表示，公司已建成45万吨/年磷酸盐系正极材料产能，其中19万吨可共线生产磷酸铁锂（LFP）和磷酸锰铁锂（LMFP），LFP、LMFP均适用于固态电池。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1085", "title": "▶ 协鑫锂电PHY工艺磷酸铁锂成本降低50%", "content": "协鑫锂电在CIBF2026预热中展示其PHY工艺，通过粉体原料物理混合一体化生产，磷酸铁锂合成成本较传统工艺同比降低50%，大幅压缩材料端生产成本。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1084", "title": "▶ 第五代磷酸铁锂电池全面量产，宁德时代、比亚迪领跑", "content": "宁德时代2025年11月宣布第五代磷酸铁锂电池正式量产，比亚迪、国轩高科亦已发布同类产品，第五代产品正极材料压实密度接近2.7g/cm³，电芯体积能量密度显著提升。机构预计2026年该技术路线市场占比将超30%，成为动力电池主流。龙蟠科技与当升科技联合研发的高压实磷酸铁锂正极材料密度达2.7g/cm³，已具备量产能力。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1083", "title": "▶ 2026年4月动力电池月度数据发布", "content": "中国汽车动力电池产业创新联盟发布数据显示，2026年4月国内动力电池装车量62.4GWh；动力和储能电池合计产量183.9GWh，合计销量164.2GWh，延续产销两旺态势。\n\n---\n\n④ 企业动态", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1082", "title": "▶ 广期所5月15日深圳举办碳酸锂业务专题培训", "content": "广州期货交易所联合中国期货市场监控中心，将于5月15日在广东深圳举办\\\"新能源·向未来\\\"碳酸锂业务专题培训，议题涵盖碳酸锂行业供需格局现状及发展趋势、储能产业发展及政策分析，同步线上直播。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1081", "title": "▶ CIBF2026深圳电池展即将开幕，超3000家企业参展", "content": "第十八届深圳国际电池技术交流会/展览会（CIBF2026）将于5月13日至15日在深圳举办，预计吸引超3,000家国内外电池生态企业参展。大会设置7个专场，涵盖储能用钠离子电池与固态电池、长时储能与混合储能、构网型储能系统、储能安全与检测认证等，并邀请储能头部企业就\\\"十五五\\\"储能产业发展作主题报告。碳酸锂价格重返19–20万元/吨区间成为展会焦点。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_1080", "title": "金禾实业获固态电池用硫化锂专利，产物纯度≥99.9%", "content": "5月11日披露专利授权显示，金禾实业新获\\\"一种以二乙基硫醚为硫源制备硫化锂的方法及其产品和应用\\\"发明专利，产物纯度≥99.9%，适用于固态电池领域。\n\n---\n\n⑤ 技术/产品", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_1079", "title": "永杉锂业（603399.SH）、*ST威领（002667.SZ）涨幅超100%领跑板块", "content": "2026年初至5月11日收盘，永杉锂业涨幅136.38%、*ST威领涨幅111.61%，融捷股份、天华新能、盛新锂能等涨幅均超50%，板块整体强势。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1078", "title": "深圳新星六氟磷酸锂项目三期建成，整体年产能达12,800吨", "content": "深圳新星5月11日公告，首次公开发行募集资金投资项目\\\"年产1.5万吨六氟磷酸锂建设项目三期\\\"建设完成并投产，项目整体已全部建成，形成年产能合计12,800吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1077", "title": "川能动力：李家沟锂矿达产满产，德阿锂业3万吨碳锂线已投产", "content": "川能动力管理层5月11日在业绩说明会上表示，公司李家沟锂矿已实现达产满产，锂产品按市场价销售，无低价长协单。德阿锂业3万吨锂盐项目中，碳酸锂产线已投产，氢氧化锂产线尚在建设中。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1076", "title": "华友钴业拟斥资7,090万美元收购加纳Ewoyaa锂矿87%权益", "content": "5月11日披露公告显示，华友钴业拟通过子公司收购加纳Ewoyaa锂矿相关权益，交易完成后将穿透持有该锂矿项目87%的权益，加速海外锂资源布局。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1075", "title": "瑞银上调赣锋锂业、天齐锂业目标价，看好锂价至25万元/吨", "content": "瑞银发布研报，基于储能系统需求强劲、中东局势推高能源价格带动电动车需求，将2026年中国锂价预测上调18%至20万元/吨，并预计5–6月现货价格可达25万元/吨，同时上调赣锋锂业A/H股及天齐锂业A股目标价。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1074", "title": "盐湖股份（000792.SZ）5月11日下跌1.34%，总市值1,986.46亿元", "content": "盐湖股份股价小幅回落，成交额49.51亿元，换手率2.47%。公司已建成全球单套规模最大的盐湖提锂装置，采用\\\"连续离子交换移动床+膜耦合\\\"核心技术，锂收率预计提升约25%。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1073", "title": "赣锋锂业（002460.SZ）5月11日收涨1.34%，报31.74元", "content": "赣锋锂业全天缩量震荡收阳，技术指标显示底部逐步抬升，MACD零轴下方绿柱持续缩短，短线止跌企稳信号明显。瑞银重申\\\"买入\\\"评级并上调目标价。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1072", "title": "天齐锂业（002466.SZ）一季度净利润同比暴增1,530%–1,818%", "content": "天齐锂业Q1业绩大爆发：营收51.28亿元（同比+98.44%），归母净利润17–20亿元（同比+1,530%至1,818%），扣非净利润同比暴增近40倍。锂价回暖叠加低基数效应，2026年二季度业绩有望进一步上行。5月11日股价收涨1.74%至77.37元，成交额61.91亿元，总市值1,324.41亿元。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1071", "title": "龙蟠科技控股子公司常州锂源获4.4亿元B轮增资（重点关注）", "content": "龙蟠科技（02465.HK）5月11日公告，金沙产业投资以现金方式向常州锂源出资4.4亿元，认购约6,117万元注册资本，占扩大后股本约6.83%。增资完成后，龙蟠持股比例由约66.42%稀释至61.88%，常州锂源仍纳入集团合并报表。增资款项将主要用于磷酸铁锂正极材料产能建设。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1070", "title": "锂电产业链景气度持续，半数锂企Q1净利润翻番", "content": "银河证券、兴业证券等多家机构齐声看多锂电产业链景气度。2026年5月，国内Top20电池厂排产总量预计约249GWh，环比增长6%；半数锂企2026年一季度净利润同比翻番。永杉锂业、融捷股份、天华新能、盛新锂能等多只个股年初至5月11日涨幅均超50%，板块整体赚钱效应显著。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1069", "title": "碳酸锂期货突破20万元/吨大关，期现联动走强", "content": "5月11日，广期所碳酸锂期货主力合约2609强势收涨3.51%至205,020元/吨，盘中最高触及205,600元/吨，当日资金净流入22.06亿元。碳酸锂期货自2025年低点5.85万元/吨以来累计涨幅已超240%。现货端，Mysteel电池级碳酸锂现货报19.5万元/吨，百川盈孚均价19.6万元/吨，均较上交易日上涨0.2万元/吨，逼近20万元/吨心理关口。瑞银据此将2026年中国碳酸锂现货均价预测上调18%至20万元/吨，并预计5-6月现货价格有望触及25万元/吨。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_1059", "title": "--\n\n政策/行业\n\n- 4月动力电池装车量62.4GWh — 据中国汽车动力电池产业创新联盟数据，4月国内动力电池装车量62.4GWh，合计产量183.9GWh，合计销量164.2GWh。（金融界，2026-05-11）\n\n- Q1储能电池出口同比高速增长 — 东莞证券研报指出，一季度储能电池出口", "content": "5月锂电排产环比再增6%，连续三个月刷新历史峰值 — 据大东时代智库（TD）调研Top20电池厂数据，预计5月国内锂电市场排产总量约249GWh，环比增长6%。（证券时报，2026-05-11）\n\n- 机构：2026年Q1磷酸铁锂产量124.96万吨，同比增长66.1%** — 据ICC鑫椤资讯统计，全球磷酸铁锂企业产量TOP3为湖南裕能、万润新能、德方纳米。（东莞证券，2026-05-11）\n\n---\n\n企业动态", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1058", "title": "华盛锂电：股东华赢二号、三号减持0.11%", "content": "— 减持区间为2026年4月30日至5月11日，权益变动后合计持股降至25.00%。（华盛锂电公告，2026-05-12）\n\n---\n\n技术/产品\n\n- 协鑫锂电PHY工艺：磷酸铁锂合成成本降低50% — 通过粉体原料物理混合一体化工艺，大幅压缩材料生产成本。（财联社，2026-05-11）\n\n- 龙蟠科技/当升科技：高压实磷酸铁锂正极材料密度达2.7g/cm³ — 可有效提高电芯体积能量密度，间接降低单位能量锂用量。（财联社，2026-05-11）\n\n- 宁德时代钠电战略合作落地：3年60GWh — 宁德时代与海博思创签署迄今规模最大的钠电池订单，标志钠电池正式进入规模化应用阶段。（财联社，2026-05-11）\n\n- 第五代磷酸铁锂电池：宁德时代2025年11月已量产，比亚迪/国轩高科跟进 — 机构预计2026年该技术市场占比将超30%，成为动力电池主流路线。（财联社，2026-05-11）\n\n- 机构：2026年全球钠电池出货量预计突破30GWh — 钠离子电池受益锂价高企，产业化进程显著提速。（财联社，2026-05-11）\n\n- 金禾实业：固态电池用硫化锂专利获授权，产物纯度≥99.9% — 新发明专利以二乙基硫醚为硫源制备硫化锂，适用于固态电池领域。（金融界，2026-05-11）\n\n---\n\n项目/招标\n\n- 天程锂电：四川宜宾年产10万吨磷酸铁锂正极材料项目招标 — 总投资19.29亿元，占地249.86亩，分两期建设，一期投资8.26亿元。（新浪网/锂电焦点，2026-05-11）\n\n---", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1057", "title": "深圳新星：年产1.28万吨六氟磷酸锂项目全部建成", "content": "— 首次公开发行募投项目三期建设完成并投产，六氟磷酸锂项目整体全部完工。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1056", "title": "光华科技：硫化锂产品已推向市场，产能验证及订单按计划推进", "content": "— 公司在互动平台披露固态电池关键材料进展。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1055", "title": "亿纬锂能：举办第二届商用车电池科技日，展示开源电池4.0 AI Battery系列", "content": "— 公司持续推进新技术产品化落地。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1054", "title": "川能动力：李家沟锂矿已实现达产满产，德阿锂业3万吨锂盐项目碳酸锂产线已投产", "content": "— 公司锂产品按市场价销售，无低价长协单。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1053", "title": "华友钴业：拟斥资7090万美元收购加纳Ewoyaa锂矿87%权益", "content": "— 若交易完成，公司将穿透持有该锂矿项目87%权益。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_1052", "title": "万润新能：5月8日接待17家机构调研", "content": "— 雷钧资产、长江证券、富邦资源、国泰海通、中信证券、浙商资管等机构参与公司调研。（东方财富，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1051", "title": "万润新能：已与华中科技大学等联合开发固态电解质，LATP进入中试", "content": "— 公司前瞻布局固态电池，以LATP为代表的氧化物固态电解质已进入中试阶段，同时积极开发高纯硫化锂。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1050", "title": "万润新能：已成功开发新一代硫酸亚铁钠正极材料", "content": "— 公司布局储能、启停、低速两轮电车等钠电产品，新一代硫酸亚铁钠正极材料已进入客户验证环节。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1049", "title": "万润新能：高压实密度磷酸铁锂产品已通过客户验证，加速放量", "content": "— 公司高压实密度磷酸铁锂产品各项性能满足客户技术指标，已通过部分客户验证。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1048", "title": "万润新能：磷酸铁锂2025年度累计出货量37.51万吨，同比增长64.33%", "content": "— 得益于储能、动力市场高景气及AIDC配储等增量场景，锂离子电池正极材料供需情况有所改善。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1047", "title": "万润新能：2026年Q1归母净利润4.01亿元，同比扭亏为盈", "content": "— 公司综合毛利率14.35%，较去年同期大幅提升，受磷酸铁锂产销量大幅提升及降本增效双重驱动。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1046", "title": "德方纳米：2025年公司产销量实现稳定增长，行业需求维持高速增长", "content": "— 公司表示将紧抓行业机遇，以技术创新为核心、成本优化为支撑，持续巩固市场地位。（同花顺，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1045", "title": "德方纳米：45万吨/年磷酸盐系正极材料产能已建成，19万吨可共线生产铁锂/锰铁锂", "content": "— 公司在互动平台披露，磷酸铁锂、三元材料、磷酸锰铁锂均可用于固态电池，将持续加大客户开发力度。（证券日报，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1044", "title": "龙蟠科技：常州锂源获4.4亿元B轮增资", "content": "— 金沙产业投资以4.4亿元增资常州锂源，持股约6.83%，增资所得将用于磷酸铁锂产能建设。龙蟠科技持股比例由66.42%稀释至61.88%。（金融界，2026-05-11）", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1043", "title": "【展会前瞻】CIBF2026将于5月13日开幕，超3000家企业参展", "content": "— 大会聚焦钠电、固液混电、第五代磷酸铁锂技术迭代三大看点，宁德时代钠电战略合作大单落地（60GWh），为行业热点。\n\n---\n\n市场/价格\n\n\n\n\n\n\n\n\n\n\n---\n\n政策/行业\n\n- 4月动力电池装车量62.4GWh — 据中国汽车动力电池产业创新联盟数据，4月国内动力电池装车量62.4GWh，合计产量183.9GWh，合计销量164.2GWh。（金融界，2026-05-11）\n\n- Q1储能电池出口同比高速增长 — 东莞证券研报指出，一季度储能电池出口表现亮眼，新能源乘用车同环比双增长，\\\"五一\\\"长假前月末销量较强。（东莞证券，2026-05-11）\n\n- CIBF2026即将开幕 — 第十八届深圳国际电池技术交流会/展览会（CIBF2026）将于5月13日至15日在深圳举办，预计超3000家国内外电池生态企业参展，设置7大专场，聚焦钠离子电池、固态电池、储能安全等前沿议题。（财联社，2026-05-11）\n\n- 广期所碳酸锂业务专题培训 — 广州期货交易所联合中国期货市场监控中心将于5月15日在深圳举办\\\"新能源·向未来\\\"碳酸锂业务专题培训，同步线上直播。（广期所，2026-05-11）\n\n- 机构：5月锂电排产环比再增6%，连续三个月刷新历史峰值 — 据大东时代智库（TD）调研Top20电池厂数据，预计5月国内锂电市场排产总量约249GWh，环比增长6%。（证券时报，2026-05-11）\n\n- 机构：2026年Q1磷酸铁锂产量124.96万吨，同比增长66.1% — 据ICC鑫椤资讯统计，全球磷酸铁锂企业产量TOP3为湖南裕能、万润新能、德方纳米。（东莞证券，2026-05-11）\n\n---\n\n企业动态", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1042", "title": "【融资】常州锂源获4.4亿元B轮融资", "content": "— 龙蟠科技(02465)5月11日公告，金沙产业投资以4.4亿元增资常州锂源，认缴注册资本约6117万元，完成后持股比例约6.83%。本轮融资将加码磷酸铁锂产能建设。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1041", "title": "【重磅】碳酸锂期货冲破20万元/吨大关", "content": "— 5月11日，国内碳酸锂期货主力合约报收20.50万元/吨（涨幅3.51%），盘中最高20.56万元/吨；现货均价19.6万元/吨，较节前低位反弹超60%。机构普遍预期锂价将持续偏强运行，20万/吨大关已近在咫尺。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_1025", "title": "车用尿素需求持续扩容，工业占比突破42%", "content": "2025年国内车用尿素消费量突破1200万吨，同比增长15%。2026年一季度工业需求占比已突破42%，较2020年提升15个百分点，成为熨平周期波动的核心支撑。\n\n---", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "kls"}, {"id": "news_1024", "title": "尿素现货价格松动，主流报价下调20-40元/吨", "content": "山东现货均价1860元/吨（环比-40），河南1870元/吨（环比-20），江苏1870元/吨（环比-30）。华鲁恒升中颗粒尿素出厂报价1825元/吨，报价偏低且实际成交可商谈，反映当前市场需求偏弱。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "kls"}, {"id": "news_1023", "title": "尿素期货大幅回调，空方资金积极进场", "content": "5月11日尿素期货主力合约UR2609收跌1.75%至1909.0元/吨，日内资金流出747.29万元。据前20名期货公司持仓数据，尿素期货净持仓为-46122手，处于净空头状态，空方呈进场态势。", "source": "", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P0", "dept": "kls"}, {"id": "news_1018", "title": "5月11日，和田公路事业发展中心发布2026年机动车辆及机械设备保险采购项目公开招标公告，预算金额108.85万元，投标截止：2026-06-05 11:00。公路系统机械设备润滑油采购需求值得关注。*", "content": "5月11日，和田公路事业发展中心发布2026年机动车辆及机械设备保险采购项目公开招标公告，预算金额108.85万元，投标截止：2026-06-05 1 本降低40%-60%，风电润滑脂国产化趋势明显提速。*", "source": "宝商在线", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1009", "title": "5月11日，明阳智能、广泰风能、广大特材等多家风电头部企业召开2025年度业绩说明会或接受投资者调研，各方普遍表示风电行业低价竞争态势已显著减缓，中标价格企稳回升，\\\"反内卷\\\"取得阶段性成效，盈利水平有望持续改善。*", "content": "5月11日，明阳智能、广泰风能、广大特材等多家风电头部企业召开2025年度业绩说明会或接受投资者调研，各方普遍表示风电行业低价竞争态势已显著减缓，中标价格企稳回升，\\\"反内卷\\\"取得阶段性成效，盈利水平有望持续改善。*", "source": "Wind资讯", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1008", "title": "国海证券5月11日发布研报，维持利安隆\\\"买入\\\"评级。研报指出公司2026年一季度业绩同比持续增长，看好抗老化助剂涨价及润滑油添加剂放量逻辑，润滑油添加剂业务成长空间明确。*", "content": "国海证券5月11日发布研报，维持利安隆\\\"买入\\\"评级。研报指出公司2026年一季度业绩同比持续增长，看好抗老化助剂涨价及润滑油添加剂放量逻辑，润滑油添加剂业务成长空间明确。*", "source": "国海证券", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1007", "title": "5月10日第十届中国品牌日，昆仑润滑以\\\"自主之芯\\\"为核心传播主题，在多个平台发声；5月8日\\\"一城一策\\\"全国推广西安站启动，奥运冠军武大靖代言加持，品牌攻势猛烈。*", "content": "5月10日第十届中国品牌日，昆仑润滑以\\\"自主之芯\\\"为核心传播主题，在多个平台发声；5月8日\\\"一城一策\\\"全国推广西安站启动，奥运冠军武大靖代言加持，品牌攻势猛烈。*", "source": "搜狐、中国能源网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1006", "title": "5月11日，长城润滑油品牌价值蝉联行业第一的消息在多个平台同步传播，品牌价值领先地位持续巩固。*", "content": "5月11日，长城润滑油品牌价值蝉联行业第一的消息在多个平台同步传播，品牌价值领先地位持续巩固。*", "source": "中国能源网、中国经营网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1005", "title": "昆仑润滑完成API SQ标准全系汽机油布局，标志着全球最高等级、指标最严苛的汽油机油标准体系在中国市场全面落地。行业观点认为，SQ标准将推动汽机油市场进入新一轮产品迭代周期，市场份额有望向已完成标准布局的头部品牌集中。*", "content": "昆仑润滑完成API SQ标准全系汽机油布局，标志着全球最高等级、指标最严苛的汽油机油标准体系在中国市场全面落地。行业观点认为，SQ标准将推动汽机油市场进入新一轮产品迭代周期，市场份额有望向已完成标准布局的头部品牌集中。*", "source": "中国报业网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1003", "title": "5月8日，昆仑润滑\\\"一城一策\\\"全国推广活动首站在西安启幕，奥运冠军武大靖亲临现场。活动正式发布昆仑天润汽机油新品，标志着昆仑润滑完成API SQ（全球等级最高、指标最严苛的汽油机油技术体系）全系产品布局。5月10日第十届中国品牌日期间，昆仑润滑以\\\"自主之芯\\\"为传播核心再度发声，品牌攻势持续升", "content": "5月8日，昆仑润滑\\\"一城一策\\\"全国推广活动首站在西安启幕，奥运冠军武大靖亲临现场。活动正式发布昆仑天润汽机油新品，标志着昆仑润滑完成API SQ（全球等级最高、指标最严苛的汽油机油技术体系）全系产品布局。5月10日第十届中国品牌日期间，昆仑润滑以\\\"自主之芯\\\"为传播核心再度发声，品牌攻势持续升温。*", "source": "中国报业网、中国能源网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1002", "title": "5月11日，华北市场进口PAO基础油价格保持高位：PAO4/PAO6均为27000元/吨，PAO8为29000元/吨，PAO10为28000元/吨，PAO40高达38000元/吨，走势平稳坚挺。同期国产基础油山东、华东、华南地区60N环比下跌，华东华北再生油100SN环比下跌89-169元/吨。霍尔", "content": "5月11日，华北市场进口PAO基础油价格保持高位：PAO4/PAO6均为27000元/吨，PAO8为29000元/吨，PAO10为28000元/吨，PAO40高达38000元/吨，走势平稳坚挺。同期国产基础油山东、华东、华南地区60N环比下跌，华东华北再生油100SN环比下跌89-169元/吨。霍尔木兹海峡局势持续影响GTL基础油物流通道，进口高端合成基础油供给受限，与国产基础油下跌形成鲜明分化。*", "source": "我的钢铁网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1001", "title": "5月11日，长城润滑油品牌价值大幅增长、蝉联润滑油行业第一的消息同步出现在中国能源网、中国经营网等平台，引发行业关注。作为中国石化旗下润滑油品牌，长城润滑油持续领跑品牌价值榜单，国字号背书效应显著。*", "content": "5月11日，长城润滑油品牌价值大幅增长、蝉联润滑油行业第一的消息同步出现在中国能源网、中国经营网等平台，引发行业关注。作为中国石化旗下润滑油品牌，长城润滑油持续领跑品牌价值榜单，国字号背书效应显著。*", "source": "中国能源网、中国经营网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1000", "title": "新疆和田公路事业发展中心：2026年机械设备采购招标", "content": "5月11日，和田公路事业发展中心发布2026年机动车辆及机械设备保险采购项目公开招标公告，预算金额108.85万元，投标截止：2026-06-05 11:00。公路系统机械设备润滑油采购需求值得关注。*", "source": "中国政府采购网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0999", "title": "华润电力（锦州）有限公司：燃料专业润滑油脂采购询比公告", "content": "5月11日，华润电力（锦州）有限公司发布燃料专业润滑油脂采购询比采购公告，采购编号：，截止时间：2026-05-16 09:00，采购机构：华润守正招标有限公司。", "source": "必联网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0998", "title": "小家电润滑脂技术迭代：多基础油体系实现-50℃至280℃宽温覆盖", "content": "百润得（肯特润滑）以20余年技术沉淀，推出覆盖矿物油、合成油、全氟聚醚等多基础油体系的润滑方案，实现-50℃至280℃宽温覆盖，配合锂基、复合铝基、聚脲等多种稠化剂技术，为家电电机、齿轮箱等部件提供长效防护。*", "source": "搜狐", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0997", "ti 安启幕", "content": "5月8日，昆仑润滑\\\"一城一策\\\"全国推广活动首站在西安启幕，奥运冠军武大靖亲临现场。活动正式发布昆仑天润汽机油新品，标志着昆仑润滑完成API SQ（全球等级最高、指标最严苛的汽油机油技术体系）全系产品布局。5月10日第十届中国品牌日期间，昆仑润滑以\\\"自主之芯\\\"为传播核心再度发声，品牌攻势持续升温。*", "source": "中国报业网、中国能源网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0987", "title": "PAO等高端进口基础油价格坚挺，与国产基础油走势持续分化", "content": "5月11日，华北市场进口PAO基础油价格保持高位：PAO4/PAO6均为27000元/吨，PAO8为29000元/吨，PAO10为28000元/吨，PAO40高达38000元/吨，走势平稳坚挺。同期国产基础油山东、华东、华南地区60N环比下跌，华东华北再生油100SN环比下跌89-169元/吨。霍尔木兹海峡局势持续影响GTL基础油物流通道，进口高端合成基础油供给受限，与国产基础油下跌形成鲜明分化。*", "source": "我的钢铁网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0986", "title": "长城润滑油品牌价值大幅增长，蝉联润滑油行业第一", "content": "5月11日，长城润滑油品牌价值大幅增长、蝉联润滑油行业第一的消息同步出现在中国能源网、中国经营网等平台，引发行业关注。作为中国石化旗下润滑油品牌，长城润滑油持续领跑品牌价值榜单，国字号背书效应显著。*", "source": "中国能源网、中国经营网", "url": "#", "date": "2026-05-11", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0970", "title": "迪克化学事业部核心关注", "content": "乙二醇现货重回5000~5050元/吨区间，环氧乙烷价格持稳8500元/吨附近，上游原料成本端松动，短期对防冻液/制动液配方成本构成下行空间；但原料价格仍处近年相对高位，需关注下游需求跟进力度。\n\n---\n\n\n\n\n---\n\n\n\n\n---", "source": "", "url": "#", "date": "2026-05-10", "dim": "market", "priority": "P2", "dept": "dhx"}, {"id": "news_0957", "title": "法恩莱特提示", "content": "六氟磷酸锂当前处于\\\"库存低位+装置检修+报价上涨\\\"的阶段，价格从4月底低位持续反弹；电池级DMC因供给端无新增量且需求增长，报价已上调至5500元/吨以上；5月电解液成本端支撑整体走强，建议关注实际成交价跟进情况。\n\n\n\n\n\n\n\n---", "source": "", "url": "#", "date": "2026-05-10", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_0956", "title": "3. 储能成为锂电需求第一引擎，Q1出货同比+139%，宁德时代、中创新航、亿纬锂能等头部电芯厂扩产提速", "content": "3. 储能成为锂电需求第一引擎，Q1出货同比+139%，宁德时代、中创新航、亿纬锂能等头部电芯厂扩产提速", "source": "", "url": "#", "date": "2026-05-10", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_0955", "title": "2. 天赐材料Q1净利暴增10倍却遭主力砸盘，单日净流出17.65亿元，股价大跌6.99%", "content": "2. 天赐材料Q1净利暴增10倍却遭主力砸盘，单日净流出17.65亿元，股价大跌6.99%", "source": "", "url": "#", "date": "2026-05-10", "dim": "market", "priority": "P2",
