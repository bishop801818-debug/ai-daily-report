to_2026-05-08_2754", "title": "苏伊士携手巡鹰新能源常熟共建1.5万吨锂电池回收基地", "content": "苏伊士携手巡鹰新能源常熟共建1.5万吨锂电池回收基地", "source": "", "url": "", "date": "2026-05-08", "dim": "topnews", "priority": "P2", "dept": "sdmd"}, {"id": "auto_2026-05-08_2752", "title": "工信部六部门《动力电池回收管理暂行办法》正式发布实施", "content": "工信部六部门《动力电池回收管理暂行办法》正式发布实施", "source": "", "url": "", "date": "2026-05-08", "dim": "topnews", "priority": "P2", "dept": "sdmd"}, {"id": "auto_2026-05-08_2718", "title": "煤炭板块领跌拖累化工成本", "content": "5月7日煤炭板块持续走弱，中煤能源跌7.87%，煤头尿素成本支撑边际松动。", "source": "", "url": "", "date": "2026-05-08", "dim": "topnews", "priority": "P0", "dept": "kls"}, {"id": "news_1767", "title": "昆仑润滑API SQ全系布局完成，先发优势显著：昆仑润滑在5月8日完成API SQ全球最高汽机油标准的全系产品布局，较行…", "content": "昆仑润滑API SQ全系布局完成，先发优势显著：昆仑润滑在5月8日完成API SQ全球最高汽机油标准的全系产品布局，较行…", "source": "中国日报/中国石油新闻中心", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P1", "dept": "lhy"}, {"id": "news_0734", "title": "三、市场争议/风险提示 ⚠️", "content": "- ⚠️ 高盛发布看空锂价研报：高盛预测2026年下半年锂矿大幅过剩，碳酸锂年底或跌至6.5万元/吨，该预期直接冲击磷酸铁锂正极产业链（LFP占龙蟠主营近半），引发龙蟠科技、卫星化学等化工新材料标的集体大幅杀跌。当前市场对锂价底部分歧较大，需密切跟踪碳酸锂现货实际走势。\n- ⚠️ 龙蟠科技扩产隐忧：龙蟠科技业绩说明会同步提及\\\"防范LFP产能过剩\\\"风险，叠加多家厂商大规模扩产共振，冷却液/防冻液同质化竞争或加剧，警惕价格战风险向化工耗材端传导。\n\n---", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "dhx"}, {"id": "news_0729", "title": "三、市场争议/风险提示", "content": "1. ⚠️ 六氟磷酸锂价格走势分歧加大：SMM周报指出，六氟受原材料成本推动上涨，但同时供应提升幅度较大，叠加下游压价，后市价格预期趋稳而非持续上涨。近两日多氟多（002407）股价却逆势下跌1.52%，反映市场对六氟高位续涨信心不足。（今日头条/说文理财，2026-05-07）\n2. ⚠️ 添加剂VC价格持续坚挺：VC厂商库存合理而需求快速提升，价格有较强挺价意愿，与溶剂走弱形成对比，电解液配方成本结构分化加剧。（大东时代，2026-05-07）\n\n---", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_0728", "title": "二、供给侧分析", "content": "1. 全行业六氟库存降至历史极低：当前库存仅相当于约一周用量，远低于安全库存线，头部企业库存同样处于低位，即期供给极度脆弱，任何需求边际增量可快速推涨价格。（长江有色金属网，2026-05-07）\n2. 溶剂端供给持续充裕：EC/DMC/EMC等碳酸酯溶剂行业整体供应宽松，上游原料成本支撑有所弱化，部分溶剂价格小幅回落，采购节奏放缓。（上海有色网，2026-05-07）\n3. 新增六氟有效产能集中下半年释放：从产能建设到通过下游客户认证稳定供货需要较长周期，即期有效供给无法快速放量，供需错配格局短期难解。（长江有色金属网，2026-05-07）", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_0727", "title": "电解液价格评析", "content": "本周SMM数据显示，六氟受氟化锂、无水氟化氢成本推动价格上涨，但溶剂端EC/DMC/EMC因行业供应充裕价格走弱，涨跌对冲下电解液综合成本波动有限，市价暂稳。六氟涨价向电解液传导不畅，短期电解液企业利润空间承压，法恩莱特事业部需重点关注溶剂成本下行窗口期。", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "felt"}, {"id": "news_0679", "title": "行业技术路线正在向智能化、集成化方向发展，提高自动化水平和分选精度是未来竞争关键，建议关注技术迭代升级机会。", "content": "行业技术路线正在向智能化、集成化方向发展，提高自动化水平和分选精度是未来竞争关键，建议关注技术迭代升级机会。", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_0678", "title": "头部企业纷纷加速上游资源布局和下游产能扩张，行业集中度正在快速提升，竞争格局进一步向头部集中。", "content": "头部企业纷纷加速上游资源布局和下游产能扩张，行业集中度正在快速提升，竞争格局进一步向头部集中。", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_0677", "title": "政策密集出台表明监管层对行业规范化的决心，合规企业将获得更多政策红利和市场空间，建议积极抓住行业整合机遇。", "content": "政策密集出台表明监管层对行业规范化的决心，合规企业将获得更多政策红利和市场空间，建议积极抓住行业整合机遇。", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_0673", "title": "行业项目活跃度：高", "content": "本月电池回收相关项目密集公布环评和投产信息，行业投资热度不减，头部企业和跨界资本纷纷布局。\n\n7. 【山东美多事业部专属提示】", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_0668", "title": "争议焦点", "content": "当前钴镍价格维持高位震荡，但下游三元材料需求复苏不及预期，回收金属折价系数收窄至8-10%，回收企业利润空间受到挤压，部分中小企业面临成本倒挂风险。", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P2", "dept": "sdmd"}, {"id": "news_0667", "title": "印尼5月关停中资镍矿产线，转签日本军贸大单，镍资源供给格局重塑，对镍价形成支撑（来源：今日头条，2026-05-07）", "content": "印尼5月关停中资镍矿产线，转签日本军贸大单，镍资源供给格局重塑，对镍价形成支撑（来源：今日头条，2026-05-07）", "source": "", "url": "#", "date": "2026-05-08", "dim": "market", "priority": "P0", "dept": "sdmd"}, {"id": "news_0666", "title": "海外锂矿预计5月减产，国内宜春4家锂矿预期停产换证，供给收缩预期明显（来源：韭研公社，2026-05-07）", "content": "海外锂矿预计5月减产，国内宜春4家锂矿预期停产换证，供给 ce": "东吴证券研报", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "felt"}, {"id": "news_0191", "title": "六氟磷酸锂价格维持高位，电解液盈利弹性释放", "content": "2026年Q1 6F、VC、LiFSI等电解液原材料价格经历Q4大幅涨价，整体价格维持高位。碳酸锂价格持续回升支撑6F价格联动，电解液单吨净利润大幅增长。", "source": "招商证券研报", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "felt"}, {"id": "news_0180", "title": "2025年电解槽订单同比增170%，碱性占比超96%", "content": "中投顾问报告显示，2025年电解槽市场爆发式增长，订单同比增170%，碱性电解槽占比超96%，成本仅为海外1/3-1/2。 （来源：搜狐，2026-05-05） ---", "source": "搜狐", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "bych"}, {"id": "news_0179", "title": "2025年绿氢成本降至18-25元/公斤，三年下降近40%", "content": "中投顾问报告显示，2025年氢气产量超3700万吨，绿氢产能突破25万吨。绿氢成本三年下降近40%，2025年降至18-25元/公斤，西北地区竞争力接近平价。", "source": "搜狐", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "bych"}, {"id": "news_0178", "title": "壳牌游说欧盟软化绿氢\\\"同时段匹配\\\"规定", "content": "能源巨头壳牌推动欧盟弱化绿色氢能生产监管规定，要求推迟原定于2030年生效的\\\"时间相关性\\\"法规。该法规要求绿氢生产须与风电、光伏实际发电时段严格同步。荷兰、德国等五国联合向欧盟施压，要求将过渡期推迟至2035年。Repsol等公司表示此规定可能使绿氢成本增加约三分之一。", "source": "汇通财经", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "bych"}, {"id": "news_0164", "title": "负极材料价格基本平稳", "content": "当周（4.29-5.5），天然石墨(低端产品)价格环比持平，人造石墨(中端产品)持平。 （来源：同花顺，2026-05-05） ---", "source": "同花顺", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "sjld"}, {"id": "news_0163", "title": "锂电行业\\\"淡季不淡\\\"，Q1业绩普遍大幅改善", "content": "盟固利表示锂电行业呈现\\\"淡季不淡\\\"特点，Q1 A股电池类公司业绩普遍大幅改善。据不完全统计，归母净利润同比增长20%以上企业占比达六成以上。", "source": "经理人网", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "sjld"}, {"id": "news_0152", "title": "格林美节前股价过山车：4月29日涨停，4月30日暴跌5.19%", "content": "主力在涨停次日砸盘离场，4月30日主力净流出5.36亿元，散户净流入2.89亿元。涨停追高者节前已浮亏5%，一根接力棒还要往下传。 （来源：今日头条，2026-05-05） ---", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "sdmd"}, {"id": "news_0143", "title": "摩根士丹利下调2026年全球锂供应预期至40万吨LCE", "content": "摩根士丹利将2026年全球锂供应预期从年初约50万吨LCE大幅下调至约40万吨，供需缺口达8万-10万吨LCE。 （来源：澎湃新闻，2026-05-05） ---", "source": "澎湃新闻", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_0142", "title": "津巴布韦矿2个月没有新发运，预期5月上旬启动", "content": "Mysteel信息显示，津巴布韦锂矿已2个月没新发运，市场预期5月上旬启动发运、7月到厂生产。", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "lpsd"}, {"id": "news_0141", "title": "碳酸锂主力合约单日暴涨5.07%，最高触及18.95万元", "content": "碳酸锂主力合约2609从18.2万起步，节前最后一天单日暴涨5.07%，最高触及18.95万元/吨。", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "lpsd"}, {"id": "news_0140", "title": "碳酸锂现货价格报18.6万元/吨，周涨5400元", "content": "节前最后一周电池级碳酸锂基准价报17.77万元/吨，周涨5400元，环比涨3.13%。假期现货成交继续往上顶，市场传来消息：18.6万附近已出现真实成交。", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "lpsd"}, {"id": "news_0132", "title": "磷酸铁锂技术持续迭代，多项专利申请公开", "content": "海创锂电申请\\\"高镍均一宽分布梯度粒径正极材料前驱体及其制备方法\\\"专利，可提高三元正极材料倍率性能；盟固利公告拟投资30亿元建设四代及以上磷酸铁锂一体化项目。 （来源：搜狐/经理人网，2026-05-05） ---", "source": "搜狐/经理人网", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "czly"}, {"id": "news_0131", "title": "储能锂电池Q1出货量同比暴涨139%，退役电池价值凸显", "content": "2026年4月\\\"车电不分离\\\"新规正式实施，五部门联合整治回收乱象。一季度储能锂电池出货量同比暴涨139%，退役电池\\\"城市矿山\\\"价值愈发凸显。", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "czly"}, {"id": "news_0130", "title": "赣锋锂业Q1净利润同比暴涨616%，锂价反转助力业绩", "content": "赣锋锂业2026年Q1营收同比+143.81%，净利润同比+616.34%，从去年同期亏损直接扭亏为盈。天齐锂业、盐湖股份、盛新锂能等锂矿龙头Q1业绩普遍大幅改善。", "source": "今日头条", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "czly"}, {"id": "news_0125", "title": "国内车用尿素溶液报价：1800-2500元/吨不等", "content": "5月5日各地车用尿素报价：河南汇亿海1800元/吨、汇亿海净水材料2300元/吨、苏州尚马化工2500元/吨、福建三安化工2100元/吨。 （来源：农化网，2026-05-05） ---", "source": "农化网", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "kls"}, {"id": "news_0124", "title": "尿素产业链指数103.96，与昨日持平", "content": "5月5日生意社尿素产业链指数为103.96，与昨日持平，较周期内最高点166.13点（2021-10-31）下降37.42%。", "source": "同花顺", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P2", "dept": "kls"}, {"id": "news_0123", "title": "尿素期货主力合约收2017元/吨，周涨幅0.2%", "content": "节前最后一周（4.27-4.30）尿素期货主力UR609周收盘2017元/吨，周涨幅0.2%，持仓量353913手。节后关注现货成交力度及出口政策动态。", "source": "新浪网", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P1", "dept": "kls"}, {"id": "news_0122", "title": "尿素现货价格稳中偏弱，山东小粒跌10-20元/吨至1830元/吨", "content": "5月5日国内尿素价格稳中偏弱：山东1820-1840元/吨（跌10-20）、河南1800-1810元/吨（跌10）、河北1830-1840元/吨、江苏1870元/吨。普通小颗粒成交一般，大颗粒及多肽差异化产品溢价显著（华鲁大颗粒报价2020元/吨）。", "source": "肥料农药信息台/农时达情报", "url": "#", "date": "2026-05-05", "dim": "market", "priority": "P0", "dept": "kls"}, {"id": "news_1013", "title": "美孚5月15日起再涨约15%（累计超23%），壳牌5月18日起涨幅不低于10%，嘉实多5月22日起进一步调整。嘉实多、壳牌均明确表示\\\"不排除进一步涨价\\\"，涨价预期持续笼罩市场。*", "content": "美孚5月15日起再涨约15%（累计超23%），壳牌5月18日起涨幅不低于10%，嘉实多5月22日起进一步调整。嘉实多、壳牌均明确表示\\\"不排除进一步涨价\\\"，涨价预期持续笼罩市场。*", "source": "车与轮新零售", "url": "#", "date": "2026-05-03", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0996", "title": "美孚/壳牌/嘉实多：5月涨价落地在即，部分品牌明确持续涨价预期", "content": "美孚5月15日起再涨约15%（累计超23%），壳牌5月18日起涨幅不低于10%，嘉实多5月22日起进一步调整。嘉实多、壳牌均明确表示\\\"不排除进一步涨价\\\"，涨价预期持续笼罩市场。*", "source": "车与轮新零售", "url": "#", "date": "2026-05-03", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_1011", "title": "在涨价潮中，拥有自有炼厂的壳牌、美孚等综合石油公司与不拥有上游炼厂的福斯，走出截然不同的应对路径。福斯方面表示与十余家基础油供应商保持战略合作，\\\"东家不亮西家亮\\\"的灵活供应模式反而成为保供优势。*", "content": "在涨价潮中，拥有自有炼厂的壳牌、美孚等综合石油公司与不拥有上游炼厂的福斯，走出截然不同的应对路径。福斯方面表示与十余家基础油供应商保持战略合作，\\\"东家不亮西家亮\\\"的灵活供应模式反而成为保供优势。*", "source": "第一财经", "url": "#", "date": "2026-05-02", "dim": "market", "priority": "P2", "dept": "lhy"}, {"id": "news_0994", "title": "福斯/壳牌：独立润滑油厂商与综合性石油公司的供应链博弈持续", "content": "在涨价潮中，拥有自有炼厂的壳牌、美孚等综合石油公司与不拥有上游炼厂的福斯，走出截然不同的应对路径。福斯方面表示与十余家基础油供应商保持战略合作，\\\"东家不亮西家亮\\\"的灵活供应模式反而成为保供优势。*", "source": "第一财经", "url": "#", "date": "2026-05-02", "di // ============================================================
// dim 统一映射表（4个标准维度）
// 宏观新闻=policy | 行业新闻=market | 企业动态=competitor | 技术产品=frontier
// ============================================================
const DIM_MAP = {
  // 英文 → 标准key
  'market':     'market',
  'policy':     'policy',
  'competitor': 'competitor',
  'frontier':   'frontier',
  'customer':   'competitor',
  'project':    'competitor',
  'suggestion': null,
  'unknown':    null,
  // 中文 → 标准key
  '政策':       'policy',
  '竞品':       'competitor',
  '客户':       'competitor',
  '前沿':       'frontier',
  '市场':       'market',
};

function normalizeDim(rawDim) {
  if (!rawDim) return null;
  const key = String(rawDim).trim();
  if (DIM_MAP[key] !== undefined) return DIM_MAP[key];
  // 模糊匹配
  if (['政策','条例','补贴','通知','发文','进出口','监管','法规','双碳','碳中和','新能源战略'].some(w => key.includes(w))) return 'policy';
  if (key.includes('市场') || key.includes('价格') || key.includes('行情') || key.includes('供需') || key.includes('库存')) return 'market';
  if (['企业','竞品','竞争','动态','项目','招标','客户'].some(w => key.includes(w))) return 'competitor';
  if (['技术','产品','前沿','研发'].some(w => key.includes(w))) return 'frontier';
  return null;
}

// 加载所有日期的报告并合并
// ============================================================
async function loadAllReports() {
  // 1. 获取可用日期列表
  let availableDates = [];
  try {
    const idxRes = await fetch(`${REPORT_BASE}index.json?v=${Date.now()}`);
    if (idxRes.ok) {
      const idx = await idxRes.json();
      availableDates = idx.available_dates || [];
    }
  } catch(e) {}

  // 2. 回退：直接探测近期日期
  if (availableDates.length === 0) {
    const today = new Date();
    for (let daysBack = 0; daysBack <= 60; daysBack++) {
      const d = new Date(today.getTime() - daysBack * 86400000);
      const ds = d.toISOString().slice(0,10);
      try {
        const r = await fetch(`${REPORT_BASE}${ds}.json`);
        if (r.ok) availableDates.push(ds);
      } catch(e) {}
    }
  }

  // 3. 加载并合并所有日期
  const mergedDepts = {};
  const loadedDates = [];

  for (const dateStr of availableDates) {
    try {
      const res = await fetch(`${REPORT_BASE}${dateStr}.json?v=${Date.now()}`);
      if (!res.ok) continue;
      const json = await res.json();
      if (!json.departments) continue;

      loadedDates.push(dateStr);
      for (const [deptId, deptData] of Object.entries(json.departments)) {
        if (!mergedDepts[deptId]) {
          mergedDepts[deptId] = {
            name: deptData.name || DEPT_LIST.find(d=>d.id===deptId)?.name || deptId,
            subtitle: deptData.subtitle || '',
            report_date: dateStr,
            sections: { market:[], policy:[], competitor:[], frontier:[] },
            total_events: 0,
          };
        }
        const target = mergedDepts[deptId];
        target.report_date = dateStr;

        const rawSections = deptData.sections || {};
        const sectionsByDim = deptData.sectionsByDim || {};

        // 辅助：将item推入对应dim的列表（去重）
        function pushItemToDim(raw, stdDim) {
          const title = norm(raw.title || raw.event || raw.Title || '');
          const content = norm(raw.content || raw.fact || raw.Content || '');
          if (!title && !content) return;
          const sig = title.substring(0,60);
          if (!target._seen) target._seen = new Set();
          if (target._seen.has(sig)) return;
          target._seen.add(sig);
          if (!target.sections[stdDim]) target.sections[stdDim] = [];
          target.sections[stdDim].push({
            title: title.substring(0,120),
            content,
            priority: raw.priority || raw.Priority || 'P2',
            source: raw.source || raw.source_name || '',
            url: raw.url || raw.Url || '#',
            _date: dateStr,
          });
        }

        // 格式1：sectionsByDim（旧格式）
        for (const [rawDim, items] of Object.entries(sectionsByDim)) {
          const stdDim = normalizeDim(rawDim);
          if (!stdDim) continue;
          if (!Array.isArray(items)) continue;
          for (const raw of items) pushItemToDim(raw, stdDim);
        }

        // 格式2：sections 数组（新格式）
        if (Array.isArray(rawSections)) {
          for (const sec of rawSections) {
            const stdDim = normalizeDim(sec.dim || sec.title || '');
            if (!stdDim) continue;
            const items = sec.items || [];
            for (const raw of items) pushItemToDim(raw, stdDim);
          }
        }
        // 格式3：sections 是对象（更旧格式）
        else if (typeof rawSections === 'object' && rawSections !== null) {
          for (const [rawKey, rawArr] of Object.entries(rawSections)) {
            const stdDim = normalizeDim(rawKey);
            if (!stdDim) continue;
            const items = Array.isArray(rawArr) ? rawArr
              : (typeof rawArr === 'object' && rawArr !== null ? Object.values(rawArr).flat() : []);
            for (const raw of items) pushItemToDim(raw, stdDim);
          }
        }
      }
    } catch(e) {}
  }

  loadedDates.sort();
  const dateRange = loadedDates.length > 1
    ? `${loadedDates[0]} ~ ${loadedDates[loadedDates.length-1]}`
    : (loadedDates[0] || '');

  console.log('[行业新闻] 聚合加载:', loadedDates.length, '期');
  return { data: mergedDepts, dateRange, loadedDates };
}

    id, name: BU_NAME_MAP[id], color: BU_COLOR_MAP[id] || '#888'
  }));
  if (!currentBu && tabs.length > 0) { currentBu = tabs[0].id; openBu = tabs[0].id; }

  // Build HTML once
  bar.innerHTML = tabs.map(tab => `
    <div class="bu-tab-wrap">
      <div class="bu-tab-btn" data-bu="${tab.id}">
        ${tab.name}<span class="dropdown-arrow">▼</span>
      </div>
      <div class="bu-dropdown" id="dropdown_${tab.id}">
        ${DIM_TABS.map(d => `
          <div class="bu-dropdown-item" data-dim="${d.key}" data-bu="${tab.id}">
            <span class="dro-label"><span>${d.icon}</span><span>${d.label}</span></span>
            <span class="dro-count">${countItemsForBuDim(data, tab.id, d.key)}</span>
          </div>`).join('')}
      </div>
    </div>`).join('');

  // Single delegated click handler（选择维度）
  bar.onclick = function(e) {
    const droItem = e.target.closest('.bu-dropdown-item');
    if (droItem) {
      const dimKey = droItem.dataset.dim;
      const bKey = droItem.dataset.bu;
      switchBuDim(bKey, dimKey);
      return;
    }
  };

  refreshTabUI();
  console.log('[Tab] rendered', tabs.length, 'tabs, currentBu:', currentBu, 'openBu:', openBu);
}

// ============================================================
// 渲染内容区
// ============================================================
// 渲染内容区
// ============================================================
// 渲染内容区
// ============================================================
function renderDimContent(dimKey, data, buKey) {
  const area = document.getElementById('dimContentArea');
  const dimTab = DIM_TABS.find(t => t.key === dimKey) || DIM_TABS[0];

  const deptData = data[buKey];
  if (!deptData) { area.innerHTML = '<div class="empty-state">无数据</div>'; return; }

  const items = (deptData.sections || {})[dimKey] || [];
  const buColor = BU_COLOR_MAP[buKey] || '#888';
  const buName = BU_NAME_MAP[buKey] || buKey;

  // 统计
  const p0 = items.filter(x => x.priority === 'P0').length;
  const p1 = items.filter(x => x.priority === 'P1').length;

  // 内容区标题
  const headerHtml = `
    <div class="content-header">
      <span class="bu-pill" style="background:${buColor}">${buName}</span>
      <span class="dim-label">${dimTab.icon} ${dimTab.label}</span>
      <span style="font-size:12px;color:var(--text-dim);margin-left:auto">
        ${items.length} 条 · ${p0}头条 ${p1}重点
      </span>
    </div>`;

  if (items.length === 0) {
    area.innerHTML = headerHtml + `
      <div class="empty-state">
        <div style="font-size:32px;margin-bottom:10px">📭</div>
        <div>${buName} 暂无"${dimTab.label}"动态</div>
      </div>`;
    return;
  }

  // 按优先级排序
  const order = { P0:0, P1:1, P2:2 };
  const sorted = [...items].sort((a, b) => (order[a.priority]??2) - (order[b.priority]??2));

  let cardsHtml = '';
  for (const item of sorted) {
    const pClass = item.priority || 'P2';
    const pText = pClass === 'P0' ? '头条' : pClass === 'P1' ? '重点' : '补充';
    const displayTitle = item.title || '无标题';
    const displayContent = item.content || '';

    let itemSource = item.source || '';
    let itemDate = item._date || '';
    let workingContent = displayContent;
    if (!itemSource || !itemDate) {
      const m = displayContent.match(/（来源：([^），,]+)[，,]\s*(\d{4}-\d{2}-\d{2})/);
      if (m) {
        if (!itemSource) itemSource = m[1].trim();
        if (!itemDate) itemDate = m[2].trim();
        workingContent = displayContent.replace(/（来源：[^）]*）?/, '').trim();
      }
    }
    const cleanContent = workingContent.replace(/（来源：[^）]*）?\s*$/, '').trim();
    const shortContent = cleanContent.length > 200 ? cleanContent.substring(0,200) + '...' : cleanContent;
    const hasLongContent = cleanContent.length > 200;

    cardsHtml += `
    <div class="news-card ${pClass}" onclick="toggleCard(this)">
      <div class="card-top">
        <span class="priority-tag ${pClass}">${pText}</span>
      </div>
      <div class="card-title">${safe(displayTitle)}</div>
      <div class="card-content">${safe(shortContent)}</div>
      ${hasLongContent ? '<div class="card-arrow">▼ 点击展开全文</div>' : ''}
      <div class="card-footer">
        ${itemDate ? `<span class="card-source">📅 ${itemDate}</span>` : ''}
        ${itemSource ? `<span class="card-source">来源：${safe(itemSource)}</span>` : ''}
        ${item.url && item.url !== '#' ? `<a class="card-link" href="${safe(item.url)}" target="_blank" onclick="event.stopPropagation()">查看原文 →</a>` : ''}
      </div>
    </div>`;
  }

  area.innerHTML = headerHtml + cardsHtml;
}

// 卡片展开/折叠
function toggleCard(el) {
  el.classList.toggle('expanded');
  const arrow = el.querySelector('.card-arrow');
  if (arrow) arrow.textContent = el.classList.contains('expanded') ? '▲ 收起' : '▼ 点击展开全文';
}

// ============================================================
// 执行入口
// ============================================================
(async function init() {
  const loader = document.getElementById('pageLoader');
  const content = document.getElementById('realPageContent');

  try {
    const result = await loadCleanNews();
    if (!result || !result.data || result.loadedDates.length === 0) {
      loader.innerHTML = `
        <div class="loader-icon">📭</div>
        <div class="loader-msg">未找到早报数据<br><br>
          <span style="font-size:12px;color:#aaa">请先在首页点击"全员晨会汇报"生成今日早报</span>
        </div>`;
      return;
    }

    const { data, dateRange, loadedDates } = result;
    globalData = data;

    // 首次默认选中第一个BU（常州锂源）
    const buIds = Object.keys(BU_NAME_MAP).filter(k => k !== 'all');
    currentBu = buIds[0] || 'czly';
    currentDim = 'policy';

    document.getElementById('topbarDate').textContent = dateRange;
    document.title = `行业新闻 - ${dateRange} 晨会指挥中心`;

    renderBuTabs(data);
    // 默认渲染第一个BU的policy维度
    renderDimContent(currentDim, data, currentBu);

    loader.style.display = 'none';
    content.style.display = 'block';

  } catch(err) {
    console.error('[行业新闻] 加载失败:', err);
    loader.innerHTML = `
      <div class="page-error">
        <div style="font-size:28px;margin-bottom:10px">⚠️</div>
        <div>加载失败：${err.message}</div>
      </div>`;
  }
})();
</script>
