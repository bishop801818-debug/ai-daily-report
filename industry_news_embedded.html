<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="html-version" content="20260609_001">
<title>行业新闻 - 晨会指挥中心</title>
<style>
  :root {
    --primary: #1e3c72;
    --accent: #f39c12;
    --bg: #f0f2f8;
    --card-bg: #ffffff;
    --text: #2c3e50;
    --text-dim: #7f8c8d;
    --border: #e0e6ef;
    --shadow: 0 2px 12px rgba(30,60,114,0.08);
    --shadow-hover: 0 6px 24px rgba(30,60,114,0.16);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Microsoft YaHei','PingFang SC',Arial,sans-serif;
          background:var(--bg); color:var(--text); min-height:100vh; }

  /* ── 顶部导航 ── */
  .topbar {
    background:#fff;
    border-radius:16px;
    padding:14px 30px;
    margin-bottom:20px;
    box-shadow:0 4px 20px rgba(30,60,114,0.1);
    display:flex; align-items:center;
    justify-content:space-between;
    position:relative;
    border:1px solid rgba(30,60,114,0.08);
  }
  .topbar-title { color:#111; font-size:20px; font-weight:700;
                   display:flex; align-items:center; gap:10px; }
  .topbar-title .icon { font-size:22px; }
  .topbar-date { color:#666; font-size:13px; }
  .topbar-badge { background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%); color:#fff;
                   font-size:11px; padding:2px 8px; border-radius:20px;
                   font-weight:600; margin-left:8px; }
  .topbar-back {
    background:#f1f1f1; color:#111; border:none;
    padding:7px 16px; border-radius:8px; cursor:pointer; font-size:13px;
    transition:background 0.2s; display:flex; align-items:center; gap:6px;
  }
  .topbar-back:hover { background:#d0d0d0; }

  /* ── 页面容器 ── */
  .page {
    isolation:isolate;
    position:relative; max-width:1100px; margin:0 auto; padding:24px 16px 60px; }

    /* ── BU主Tab栏（一级，含下拉维度，单行不换行） ── */
  .bu-tab-bar {
    display:flex; gap:8px; margin-bottom:20px;
    position:relative; z-index:999;
    flex-wrap:nowrap; align-items:flex-start;
    padding-bottom:4px;
    background:#fff;
    border-radius:16px;
    padding:12px 15px;
    box-shadow:0 4px 20px rgba(30,60,114,0.1);
    border:1px solid rgba(30,60,114,0.08);
  }

  .bu-tab-wrap {
    position:relative; display:inline-block; flex-shrink:0;
    z-index:999;
  }
  .bu-tab-btn {
    padding:8px 18px; border-radius:10px; border:2px solid transparent;
    cursor:pointer; font-size:13px; font-weight:600;
    background:#fff; color:#111; white-space:nowrap;
    display:flex; align-items:center; gap:6px;
    transition:all 0.2s;
  }
  .bu-tab-btn:hover {
    background:#d8d8d8; color:#000;
  }
  .bu-tab-btn.active {
    background:#d0d0d0; color:#000;
  }
  .bu-tab-btn .dropdown-arrow { font-size:9px; transition:all 0.2s; opacity:0.6; }
  .bu-tab-wrap:hover .bu-tab-btn .dropdown-arrow { transform:rotate(180deg); }

  /* 下拉菜单（默认隐藏，由JS延迟控制显示） */
  .bu-dropdown {
    display:none;
    position:absolute; top:calc(100% + 6px); left:0;
    background:#fff; border:1px solid rgba(30,60,114,0.1);
    border-radius:12px; box-shadow:0 8px 30px rgba(0,0,0,0.15);
    z-index:1000; min-width:160px; overflow:visible;
  }

  .bu-dropdown-item {
    padding:10px 16px; cursor:pointer; font-size:13px;
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; transition:all 0.3s;
    border-bottom:1px solid rgba(30,60,114,0.08);
    color:#111;
  }
  .bu-dropdown-item:last-child { border-bottom:none; }
  .bu-dropdown-item:hover {
    background:linear-gradient(135deg,#1e3c72 0%,#2a5298 100%);
    color:#fff; transform:translateX(5px);
  }
  .bu-dropdown-item .dro-label { display:flex; align-items:center; }
  .bu-dropdown-item .dro-count {
    font-size:11px; color:#666; background:#f0f2f8;
    padding:1px 7px; border-radius:10px; font-weight:600;
  }
  .bu-dropdown-item:hover .dro-count { background:rgba(255,255,255,0.2); color:#fff; }
/* ── 内容区标题（当前BU+维度指示） ── */
  .content-header {
    display:flex; align-items:center; gap:12px; margin-bottom:16px;
  }
  .content-header .bu-pill {
    font-size:12px; padding:3px 12px; border-radius:20px;
    color:#fff; font-weight:600;
  }
  .content-header .dim-label {
    font-size:14px; font-weight:700; color:var(--text);
  }

  /* ── 维度内容区 ── */
  .dim-content { display:none; }
  .dim-content.active { display:block; }

  /* ── 统计条 ── */
  .dim-stats {
    display:flex; gap:16px; margin-bottom:14px; flex-wrap:wrap;
  }
  .stat-chip {
    font-size:12px; padding:4px 12px; border-radius:20px;
    background:#fff; border:1px solid var(--border);
    color:var(--text-dim);
  }
  .stat-chip strong { color:var(--primary); }

  /* ── 新闻卡片 ── */
  .news-card {
    background:var(--card-bg); border-radius:12px; padding:16px 20px;
    margin-bottom:12px; box-shadow:var(--shadow);
    border-left:4px solid var(--border);
    transition:box-shadow 0.2s, border-color 0.2s;
    cursor:pointer;
  }
  .news-card:hover { box-shadow:var(--shadow-hover); border-left-color:var(--primary); }
  .news-card.p0 { border-left-color:#c0392b; }
  .news-card.p1 { border-left-color:#e67e22; }
  .news-card.p2 { border-left-color:#27ae60; }

  .card-top {
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:8px;
  }
  .bu-tag {
    font-size:11px; font-weight:700; padding:2px 10px;
    border-radius:20px; color:#fff;
  }
  .priority-tag {
    font-size:10px; font-weight:700; padding:2px 7px;
    border-radius:3px; color:#fff;
  }
  .priority-tag.p0 { background:#c0392b; }
  .priority-tag.p1 { background:#e67e22; }
  .priority-tag.p2 { background:#27ae60; }

  .card-title {
    font-size:15px; font-weight:700; color:var(--primary);
    line-height:1.5; margin-bottom:6px;
  }
  .card-content {
    font-size:13px; color:var(--text-dim); line-height:1.8;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
    transition:max-height 0.3s ease;
  }
  .news-card.expanded .card-content {
    display:block; -webkit-line-clamp:unset; overflow:visible;
  }
  .card-arrow {
    font-size:11px; color:var(--text-dim); margin-top:4px;
    transition:transform 0.2s;
  }
  .news-card.expanded .card-arrow { transform:rotate(180deg); }

  .card-footer {
    margin-top:8px; display:flex; align-items:center;
    gap:12px; flex-wrap:wrap;
  }
  .card-source { font-size:11px; color:var(--text-dim); }
  .card-link {
    font-size:11px; color:#3498db; text-decoration:none;
  }
  .card-link:hover { text-decoration:underline; }

  /* ── 加载状态 ── */
  #pageLoader { text-align:center; padding:80px 0; color:#888; }
  #pageLoader .loader-icon { font-size:40px; margin-bottom:14px; }
  #pageLoader .loader-msg { font-size:15px; }
  .page-error { text-align:center; padding:60px 20px; color:#888; font-size:14px; }

  /* ── 空状态 ── */
  .empty-state {
    text-align:center; padding:60px 20px; color:#aaa;
    font-size:14px; background:var(--card-bg); border-radius:12px;
    box-shadow:var(--shadow);
  }

  @media (max-width:640px) {
    .topbar { padding:12px 16px; }
    .topbar-title { font-size:16px; }
    .dim-tab-btn { padding:6px 14px; font-size:13px; }
    .news-card { padding:12px 14px; }
  }

  /* 懒加载相关 */
  .cards-list { min-height: 100px; }
  #lazySentinel:hover { background: rgba(0,0,0,0.03); border-radius: 8px; }

  /* 回到顶部按钮 */
  .back-to-top {
    position: fixed; right: 30px; bottom: 40px;
    width: 44px; height: 44px;
    background: linear-gradient(135deg, #0AA66A 0%, #0d7a4a 100%);
    color: #fff; border: none; border-radius: 50%;
    font-size: 20px; cursor: pointer;
    box-shadow: 0 4px 16px rgba(10,166,106,0.35);
    z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; visibility: hidden;
    transform: translateY(20px);
    transition: all 0.3s ease;
  }
  .back-to-top.visible {
    opacity: 1; visibility: visible;
    transform: translateY(0);
  }
  .back-to-top:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(10,166,106,0.5);
  }
  .back-to-top:active {
    transform: translateY(0);
  }
</style>
</head>
