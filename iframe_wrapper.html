<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI日报 - iframe 加载优化版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
            background: #f5f5f5;
        }
        
        /* Loading 动画 */
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        
        #loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #e0e0e0;
            border-top: 4px solid #1e3c72;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 10px;
        }
        
        .loading-hint {
            font-size: 0.85rem;
            color: #888;
        }
        
        /* iframe 容器 */
        #iframe-container {
            width: 100%;
            height: 100vh;
            position: relative;
        }
        
        #main-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        /* 错误提示 */
        #error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            z-index: 10000;
        }
        
        #error-message.show {
            display: block;
        }
        
        .error-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        
        .error-text {
            font-size: 1.1rem;
            color: #333;
            margin-bottom: 20px;
        }
        
        .retry-button {
            padding: 10px 30px;
            background: #1e3c72;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        
        .retry-button:hover {
            background: #2e5c92;
        }
    </style>
</head>
<body>
    <!-- Loading 动画 -->
    <div id="loading-overlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">正在加载 AI 日报...</div>
            <div class="loading-hint">首次加载可能需要 10-15 秒</div>
        </div>
    </div>
    
    <!-- iframe 容器 -->
    <div id="iframe-container">
        <iframe id="main-iframe" src="about:blank"></iframe>
    </div>
    
    <!-- 错误提示 -->
    <div id="error-message">
        <div class="error-icon">⚠️</div>
        <div class="error-text">页面加载失败，请检查网络连接</div>
        <button class="retry-button" onclick="loadIframe()">重新加载</button>
    </div>
    
    <script>
        // 配置
        const IFRAME_URL = './index_v3.html';  // 修改为实际URL
        const LOAD_TIMEOUT = 30000;  // 30秒超时
        
        let loadTimeout = null;
        let hasLoaded = false;
        
        // 加载 iframe
        function loadIframe() {
            console.log('[iframe] 开始加载:', IFRAME_URL);
            const overlay = document.getElementById('loading-overlay');
            const iframe = document.getElementById('main-iframe');
            const errorMsg = document.getElementById('error-message');
            
            // 显示 loading
            overlay.classList.remove('hidden');
            errorMsg.classList.remove('show');
            
            // 设置超时
            loadTimeout = setTimeout(function() {
                console.error('[iframe] 加载超时');
                overlay.classList.add('hidden');
                errorMsg.classList.add('show');
            }, LOAD_TIMEOUT);
            
            // 监听加载完成
            iframe.onload = function() {
                console.log('[iframe] 加载完成');
                clearTimeout(loadTimeout);
                
                // 延迟隐藏 loading（让页面渲染完成）
                setTimeout(function() {
                    overlay.classList.add('hidden');
                    hasLoaded = true;
                }, 500);
            };
            
            // 监听加载错误
            iframe.onerror = function() {
                console.error('[iframe] 加载失败');
                clearTimeout(loadTimeout);
                overlay.classList.add('hidden');
                errorMsg.classList.add('show');
            };
            
            // 开始加载
            iframe.src = IFRAME_URL + '?t=' + Date.now();
        }
        
        // 页面加载完成后延迟加载 iframe
        window.addEventListener('load', function() {
            console.log('[iframe] 主页面加载完成，延迟 500ms 加载 iframe');
            
            // 延迟加载（让主页面先渲染）
            setTimeout(loadIframe, 500);
        });
        
        // 监听来自 iframe 的消息
        window.addEventListener('message', function(event) {
            // 可以接收 iframe 发送的消息
            console.log('[iframe] 收到消息:', event.data);
        });
        
        // 向 iframe 发送消息（如果需要）
        function sendMessageToIframe(message) {
            const iframe = document.getElementById('main-iframe');
            iframe.contentWindow.postMessage(message, '*');
        }
    </script>
</body>
</html>
