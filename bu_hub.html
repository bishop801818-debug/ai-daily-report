<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>晨会指挥中心 - 事业部矩阵</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&amp;family=Noto+Sans+SC:wght@300;400;500;600&amp;family=Playfair+Display:wght@700&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --navy: #0d1b2e;
            --navy-mid: #152339;
            --navy-light: #1e3356;
            --gold: #c9a84c;
            --gold-light: #e8c96a;
            --cream: #f8f4ec;
            --white: #ffffff;
            --text-dark: #1a2535;
            --text-mid: #4a5568;
            --text-light: #718096;
            --d1: #1a6b9e;
            --d2: #2e7d5a;
            --d3: #7b4fa8;
            --d4: #c0572a;
            --d5: #b5862a;
            --d6: #2a6b7c;
            /* 弹窗 — 浅色科技风（与主页一致） */
            --panel-bg: rgba(230,238,250,0.97);
            --panel-surface: rgba(240,245,255,0.85);
            --panel-border: rgba(7,82,54,0.1);
            --panel-text: #07523;
            --panel-muted: rgba(7,82,54,0.45);
            --panel-accent: #0AA66A;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: var(--text-dark);
        }

        /* ── 背景（更通透更轻）── */
        .tech-stage {
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(165deg, #eaedf6 0%, #dde3ee 50%, #d4dbe8 100%);
        }
        .bg-atmo {
            position: fixed; top: 0; left: 0; right: 0; height: 42%;
            z-index: 0; pointer-events: none;
            background:
                radial-gradient(ellipse 90% 70% at 15% 0%, rgba(7,82,54,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 65% 50% at 85% 0%, rgba(138,43,226,0.08) 0%, transparent 58%),
                radial-gradient(ellipse 55% 40% at 55% 0%, rgba(0,140,220,0.07) 0%, transparent 52%);
        }
        .perspective-grid {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 300vw; height: 55vh;
            z-index: 1; overflow: hidden;
            perspective: 500px; perspective-origin: 50% 100%;
        }
        .grid-plane {
            width: 100%; height: 100%;
            transform: rotateX(70deg);
            transform-origin: 50% 0%;
            background:
                linear-gradient(rgba(7,82,54,0.2) 1.5px, transparent 1.5px),
                linear-gradient(90deg, rgba(7,82,54,0.2) 1.5px, transparent 1.5px);
            background-size: 70px 70px;
            animation: gridDrift 16s linear infinite;
            mask-image: linear-gradient(transparent 0%, rgba(200,210,225,0.5) 55%, rgba(200,210,225,0.92) 100%);
            -webkit-mask-image: linear-gradient(transparent 0%, rgba(200,210,225,0.5) 55%, rgba(200,210,225,0.92) 100%);
        }
        @keyframes gridDrift {
            0% { background-position: 0 0; }
            100% { background-position: 70px 70px; }
        }
        .grid-fade {
            position: absolute; top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(180deg, #d5dde8 0%, transparent 100%);
        }
        #particleCanvas {
            position: fixed; inset: 0; z-index: 2;
            pointer-events: none; opacity: 0.7;
        }
        .data-core-wrap {
            position: fixed; top: 15%; left: 50%; transform: translateX(-50%);
            z-index: 3; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        .data-core-label {
            font-size: 0.52rem; color: rgba(7,82,54,0.4);
            letter-spacing: 3px; margin-bottom: 6px; font-weight: 700;
        }
        .data-core-svg { animation: coreGlow 4s ease-in-out infinite; }
        @keyframes coreGlow {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(7,82,54,0.35)) drop-shadow(0 0 2px rgba(7,82,54,0.2)); }
            50% { filter: drop-shadow(0 0 14px rgba(138,43,226,0.45)) drop-shadow(0 0 4px rgba(138,43,226,0.25)); }
        }

        /* ── 页面主内容 ── */
        .page-content {
            position: relative; z-index: 20;
            max-width: 1400px; margin: 0 auto;
            padding: 28px 30px 0;
        }
        .top-bar {
            background: rgba(230,235,245,0.95);
            border-radius: 14px; padding: 14px 28px; margin-bottom: 18px;
            box-shadow: 0 2px 16px rgba(7,82,54,0.1), 0 1px 0 rgba(255,255,255,0.8) inset;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(7,82,54,0.08); position: relative; overflow: hidden;
        }
        .top-bar::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
            background: linear-gradient(180deg, #0AA66A, #064e3b, #0AA66A);
            border-radius: 14px 0 0 14px;
        }
        .top-bar-title {
            font-size: 1.2rem; font-weight: 700;
            background: linear-gradient(90deg, #064e3b, #0AA66A);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text; letter-spacing: 1px;
        }
        .top-bar-nav { display: flex; gap: 6px; }
        .top-bar-nav a {
            padding: 6px 14px; border-radius: 10px;
            color: #556; text-decoration: none; font-size: 0.8rem; font-weight: 600;
            transition: all 0.2s; border: 1px solid transparent;
        }
        .top-bar-nav a:hover { background: rgba(10,166,106,0.08); color: #064e3b; }
        .top-bar-nav a.active { background: rgba(10,166,106,0.12); color: #064e3b; border-color: rgba(10,166,106,0.2); }

        /* ── 事业部中心整体布局 ── */
        .bu-hub-body {
            display: flex; gap: 32px; align-items: flex-start;
        }
        .li-matrix-wrap { flex: 1.2; }
        .chem-matrix-wrap { flex: 1; }

        .matrix-label { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
        .matrix-pill {
            padding: 5px 16px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px; flex-shrink: 0;
        }
        .matrix-pill-li { background: rgba(10,166,106,0.1); border: 1px solid rgba(10,166,106,0.3); color: #064e3b; }
        .matrix-pill-chem { background: rgba(138,43,226,0.08); border: 1px solid rgba(138,43,226,0.2); color: #6a1b9a; }
        .matrix-tagline { font-size: 0.65rem; color: rgba(7,82,54,0.38); letter-spacing: 0.05em; }

        /* ── 锂电五边形星座布局 ── */
        .pentagon-wrap {
            position: relative; width: 100%; max-width: 500px;
            margin: 0 auto; padding-top: 50px;
        }
        /* 中央六边形核心 */
        .constellation-core {
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 72px; height: 72px; display: flex; align-items: center; justify-content: center;
            z-index: 2;
        }
        .core-hex {
            width: 72px; height: 72px;
            background: linear-gradient(135deg, rgba(7,82,54,0.08), rgba(10,166,106,0.06));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(7,82,54,0.12); backdrop-filter: blur(8px);
            animation: coreBreath 3s ease-in-out infinite;
        }
        @keyframes coreBreath {
            0%, 100% { box-shadow: 0 0 18px rgba(7,82,54,0.08); }
            50%       { box-shadow: 0 0 30px rgba(10,166,106,0.2); }
        }
        .core-hex svg { width: 38px; height: 38px; }
        /* 五边形卡片定位 */
        .pent-wrap { position: relative; width: 100%; height: 480px; }
        .pent-card {
            position: absolute; width: 162px;
        }
        .pent-card.p1 { top: 52px;  left: 50%; transform: translateX(-50%); }
        .pent-card.p2 { top: 168px; right: 8px; }
        .pent-card.p3 { top: 308px; right: 8px; }
        .pent-card.p4 { top: 308px; left: 8px; }
        .pent-card.p5 { top: 168px; left: 8px; }
        /* 五边形连接线 SVG（浮动在卡片层下方） */
        .pent-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .pent-lines line {
            stroke: rgba(7,82,54,0.08);
            stroke-width: 1.5;
            stroke-dasharray: 4 3;
        }

        /* ── 化学品菱形矩阵布局 ── */
        .diamond-wrap {
            position: relative; width: 100%; max-width: 420px;
            margin: 0 auto; padding-top: 24px;
        }
        .diamond-inner { position: relative; width: 100%; height: 490px; }
        .diamond-card { position: absolute; width: 162px; }
        .diamond-card.d1 { top: 16px;  left: 50%; transform: translateX(-50%); }
        .diamond-card.d2 { top: 268px; left: 0; }
        .diamond-card.d3 { top: 268px; left: 50%; transform: translateX(-50%); }
        .diamond-card.d4 { top: 268px; right: 0; }
        /* 菱形连接线 */
        .diamond-lines {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .diamond-lines line {
            stroke: rgba(138,43,226,0.12);
            stroke-width: 1.5;
            stroke-dasharray: 4 3;
        }

        /* ── 通用卡片样式 ── */
        .bu-card {
            border-radius: 14px; padding: 16px 14px 13px;
            cursor: pointer; position: relative; overflow: visible;
            border: 1px solid rgba(7,82,54,0.1);
            background: rgba(240,244,250,0.92);
            -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
            box-shadow: 0 3px 14px rgba(7,82,54,0.1), 0 1px 0 rgba(255,255,255,0.6) inset;
            transition: transform 0.4s cubic-bezier(0.34,1.25,0.64,1),
                        box-shadow 0.35s ease, border-color 0.25s ease;
            -webkit-user-select: none; user-select: none; min-height: 118px;
        }
        .bu-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2.5px;
            background: linear-gradient(90deg, transparent, var(--card-accent), transparent);
            opacity: 0; transition: opacity 0.3s;
            border-radius: 14px 14px 0 0;
        }
        .bu-card:hover, .bu-card.hover-active {
            transform: translateY(-8px) scale(1.04);
            border-color: var(--card-accent);
            box-shadow: 0 12px 36px rgba(7,82,54,0.15),
                        0 0 22px var(--card-accent-glow),
                        inset 0 0 20px rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.96);
            z-index: 20;
        }
        .bu-card:hover::before, .bu-card.hover-active::before { opacity: 1; }
        .hover-progress {
            position: absolute; bottom: 0; left: 0; height: 2.5px;
            width: 0%; background: var(--card-accent);
            transition: none; opacity: 0.85;
            box-shadow: 0 0 8px var(--card-accent-glow);
        }
        .card-logo-wrap { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
        .card-logo-placeholder {
            width: 48px; height: 48px; border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 800;
            flex-shrink: 0; letter-spacing: 0.5px;
        }
        .card-logo-img {
            width: 48px; height: 48px; border-radius: 9px;
            object-fit: contain; flex-shrink: 0;
            filter: drop-shadow(0 2px 4px rgba(7,82,54,0.12));
            transition: filter 0.3s;
        }
        .bu-card:hover .card-logo-img, .bu-card.hover-active .card-logo-img {
            filter: drop-shadow(0 4px 12px var(--card-accent-glow));
        }
        .card-name-block { flex: 1; min-width: 0; }
        .card-fullname {
            font-size: 0.88rem; font-weight: 800; color: #064e3b;
            margin-bottom: 2px; letter-spacing: 0.3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .card-tag {
            display: inline-block; padding: 2px 8px; border-radius: 20px;
            font-size: 0.6rem; font-weight: 600;
            background: rgba(7,82,54,0.05); border: 1px solid rgba(7,82,54,0.1);
            color: var(--card-accent);
        }
        .card-glow-line {
            height: 1.5px; width: 22px;
            background: linear-gradient(90deg, var(--card-accent), transparent);
            border-radius: 2px; margin-bottom: 6px; opacity: 0.5;
        }
        .card-meta {
            font-size: 0.65rem; color: rgba(7,82,54,0.45); line-height: 1.5;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .card-hint {
            position: absolute; top: 8px; right: 8px; font-size: 0.58rem;
            color: rgba(7,82,54,0.28); opacity: 0;
            transition: opacity 0.3s; white-space: nowrap;
        }
        .bu-card:hover .card-hint, .bu-card.hover-active .card-hint { opacity: 1; }
        .page-bottom { height: 60px; }

        /* ── 右侧滑入面板（浅色科技风）── */
        .panel-overlay { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
        .panel-overlay.active { pointer-events: all; }
        .panel-backdrop {
            position: absolute; inset: 0;
            background: rgba(180,200,230,0.55);
            -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
            opacity: 0; transition: opacity 0.4s ease;
        }
        .panel-overlay.active .panel-backdrop { opacity: 1; }
        .panel-drawer {
            position: absolute; top: 0; right: 0; bottom: 0;
            width: 640px; max-width: 98vw;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            backdrop-filter: blur(20px) saturate(150%);
            box-shadow: -12px 0 48px rgba(7,82,54,0.18), 0 0 0 1px rgba(7,82,54,0.06);
            transform: translateX(100%);
            transition: transform 0.45s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            display: flex; flex-direction: column; overflow: hidden;
            border-radius: 18px 0 0 18px;
        }
        .panel-overlay.active .panel-drawer { transform: translateX(0); }

        .drawer-topbar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 24px;
            border-bottom: 1px solid var(--panel-border);
            flex-shrink: 0;
            background: var(--panel-surface);
            backdrop-filter: blur(12px);
        }
        .drawer-bu-info { display: flex; align-items: center; gap: 14px; }
        .drawer-logo-img {
            width: 44px; height: 44px; border-radius: 10px; object-fit: contain;
            background: rgba(7,82,54,0.06); border: 1.5px solid rgba(7,82,54,0.12);
            padding: 4px; flex-shrink: 0;
        }
        .drawer-logo-placeholder {
            width: 44px; height: 44px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem; font-weight: 800;
            background: rgba(7,82,54,0.06); border: 1.5px solid rgba(7,82,54,0.12);
            flex-shrink: 0; letter-spacing: 0.5px;
        }
        #drawerLogoWrap { display: flex; align-items: center; }
        .drawer-name { font-family: 'Noto Serif SC', serif; font-size: 1.1rem; font-weight: 700; color: var(--panel-text); }
        .drawer-tag {
            display: inline-block; padding: 2px 10px; border-radius: 20px;
            font-size: 0.62rem; font-weight: 600;
            color: var(--panel-accent);
            background: rgba(7,82,54,0.06); border: 1px solid rgba(7,82,54,0.12);
            margin-top: 3px;
        }
        .drawer-close {
            background: rgba(7,82,54,0.05); border: 1px solid rgba(7,82,54,0.1);
            border-radius: 8px; width: 34px; height: 34px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--panel-muted); font-size: 0.9rem; transition: all 0.2s;
        }
        .drawer-close:hover { background: rgba(7,82,54,0.12); color: var(--panel-text); border-color: rgba(7,82,54,0.25); }

        /* ── 面板主体（浅色）── */
        .drawer-body {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            scrollbar-width: thin; scrollbar-color: rgba(7,82,54,0.15) transparent;
        }
        .drawer-body::-webkit-scrollbar { width: 4px; }
        .drawer-body::-webkit-scrollbar-thumb { background: rgba(7,82,54,0.15); border-radius: 2px; }

        /* ── 综合评分区（浅色卡片）── */
        .hexa-summary {
            background: var(--panel-surface);
            border-bottom: 1px solid var(--panel-border);
            padding: 18px 24px;
            display: flex; align-items: center; gap: 20px;
            backdrop-filter: blur(12px);
        }
        .hexa-score-block { text-align: center; flex-shrink: 0; }
        .hexa-score-num {
            font-family: 'Playfair Display', serif;
            font-size: 2.4rem; font-weight: 700;
            background: linear-gradient(135deg, #064e3b, #0AA66A);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }
        .hexa-score-label { font-size: 0.62rem; color: var(--panel-muted); margin-top: 3px; letter-spacing: 0.05em; }
        .hexa-divider { width: 1px; height: 48px; background: var(--panel-border); flex-shrink: 0; }
        .hexa-grade {
            font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 700;
            line-height: 1; margin-bottom: 4px;
        }
        .hexa-grade-label { font-size: 0.62rem; color: var(--panel-muted); }
        .hexa-meta { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .hexa-meta-row { display: flex; align-items: center; gap: 8px; }
        .hexa-meta-key { font-size: 0.65rem; color: var(--panel-muted); width: 44px; flex-shrink: 0; }
        .hexa-meta-val { font-size: 0.72rem; font-weight: 600; color: var(--panel-text); }
        .hexa-badge {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 0.6rem; font-weight: 700; letter-spacing: 0.05em;
        }

        /* ── 主内容区：雷达 + 维度（浅色）── */
        .hexa-main {
            display: flex; gap: 0; padding: 20px 0;
        }
        .hexa-radar-col {
            width: 220px; flex-shrink: 0;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            padding: 0 16px;
            border-right: 1px solid var(--panel-border);
        }
        .hexa-radar-wrap {
            width: 190px; height: 190px; position: relative;
        }
        .hexa-legend { width: 100%; display: flex; flex-direction: column; gap: 4px; }
        .hexa-leg-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 0.6rem; color: var(--panel-muted);
        }
        .hexa-leg-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .hexa-rank-note { font-size: 0.6rem; color: var(--panel-muted); text-align: center; margin-top: 4px; }

        /* ── 维度打分条（浅色）── */
        .hexa-dims-col { flex: 1; padding: 0 20px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: calc(100vh - 300px); }
        .hexa-dim-row {
            border-radius: 8px; overflow: hidden;
            border: 1px solid rgba(7,82,54,0.08);
            background: rgba(240,245,255,0.6);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .hexa-dim-row:hover { border-color: rgba(10,166,106,0.3); box-shadow: 0 2px 8px rgba(7,82,54,0.06); }
        .hexa-dim-row.open { border-color: rgba(10,166,106,0.4); background: rgba(230,242,255,0.8); box-shadow: 0 2px 12px rgba(7,82,54,0.08); }
        .hexa-dim-header {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; cursor: pointer;
        }
        .hexa-dim-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .hexa-dim-num { font-size: 0.62rem; color: var(--panel-muted); font-weight: 600; width: 22px; flex-shrink: 0; }
        .hexa-dim-name { font-size: 0.78rem; color: var(--panel-text); flex: 1; font-weight: 500; }
        .hexa-dim-weight { font-size: 0.62rem; color: var(--panel-muted); margin-right: 4px; }
        .hexa-dim-bar-wrap { flex: 1; max-width: 100px; height: 5px; background: rgba(7,82,54,0.06); border-radius: 3px; overflow: hidden; }
        .hexa-dim-bar { height: 100%; border-radius: 3px; transition: width 0.6s cubic-bezier(0.34,1.2,0.64,1); }
        .hexa-dim-score { font-size: 0.85rem; font-weight: 700; color: var(--panel-text); width: 30px; text-align: right; flex-shrink: 0; }
        .hexa-dim-pts { font-size: 0.65rem; color: var(--panel-muted); width: 36px; text-align: right; flex-shrink: 0; }
        .hexa-dim-chevron { color: var(--panel-muted); transition: transform 0.25s; flex-shrink: 0; font-size: 0.65rem; }
        .hexa-dim-row.open .hexa-dim-chevron { transform: rotate(180deg); }

        /* KPI 展开面板（浅色） */
        .hexa-dim-kpi { display: none; padding: 0 14px 12px 44px; }
        .hexa-dim-row.open .hexa-dim-kpi { display: block; }
        .hexa-kpi-item {
            display: flex; align-items: center; gap: 8px;
            padding: 7px 10px; margin-bottom: 4px;
            background: rgba(7,82,54,0.04); border-radius: 6px;
        }
        .hexa-kpi-name { font-size: 0.7rem; color: var(--panel-muted); flex: 1; }
        .hexa-kpi-bar-wrap { width: 60px; height: 4px; background: rgba(7,82,54,0.06); border-radius: 2px; overflow: hidden; }
        .hexa-kpi-bar { height: 100%; border-radius: 2px; }
        .hexa-kpi-score { font-size: 0.68rem; font-weight: 600; color: var(--panel-text); width: 22px; text-align: right; flex-shrink: 0; }

        /* ── 全部BU横向排名（浅色）── */
        .hexa-all-section { padding: 16px 24px 24px; border-top: 1px solid var(--panel-border); }
        .hexa-all-title {
            font-size: 0.65rem; font-weight: 600; color: var(--panel-muted);
            letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 12px;
        }
        .hexa-all-bars { display: flex; flex-direction: column; gap: 6px; }
        .hexa-all-row {
            display: flex; align-items: center; gap: 10px;
            font-size: 0.7rem;
        }
        .hexa-all-rank { color: var(--panel-muted); width: 18px; text-align: right; flex-shrink: 0; font-weight: 600; }
        .hexa-all-name { color: var(--panel-text); width: 70px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hexa-all-bar-wrap { flex: 1; height: 6px; background: rgba(7,82,54,0.06); border-radius: 3px; overflow: hidden; }
        .hexa-all-bar { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.34,1.2,0.64,1); }
        .hexa-all-score { color: var(--panel-muted); width: 30px; text-align: right; flex-shrink: 0; font-weight: 600; }
        .hexa-all-row.current .hexa-all-name { color: #064e3b; font-weight: 700; }
        .hexa-all-row.current .hexa-all-score { color: #064e3b; font-weight: 700; }

        /* ── 快捷入口（浅色）── */
        .hexa-actions { padding: 0 24px 20px; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .hexa-action-btn {
            display: flex; align-items: center; justify-content: center; gap: 5px;
            padding: 9px 10px; border-radius: 8px; font-size: 0.72rem; font-weight: 600;
            cursor: pointer; text-decoration: none; transition: all 0.2s; border: 1px solid;
        }
        .hexa-action-pri {
            background: rgba(7,82,54,0.08); border-color: rgba(7,82,54,0.2); color: #064e3b;
        }
        .hexa-action-pri:hover { background: rgba(7,82,54,0.14); }
        .hexa-action-sec {
            background: rgba(7,82,54,0.04); border-color: rgba(7,82,54,0.1); color: var(--panel-muted);
        }
        .hexa-action-sec:hover { background: rgba(7,82,54,0.08); color: var(--panel-text); }

        /* ── 今日早报摘要（浅色）── */
        .hexa-brief { padding: 14px 24px; border-top: 1px solid var(--panel-border); border-bottom: 1px solid var(--panel-border); margin-bottom: 0; }
        .hexa-brief-label { font-size: 0.62rem; font-weight: 700; color: var(--panel-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 8px; }
        .hexa-brief-headline { font-size: 0.8rem; color: var(--panel-text); font-weight: 600; line-height: 1.5; margin-bottom: 6px; }
        .hexa-brief-tags { display: flex; flex-wrap: wrap; gap: 4px; }
        .hexa-brief-tag {
            padding: 2px 8px; border-radius: 12px; font-size: 0.6rem; font-weight: 600;
            background: rgba(7,82,54,0.06); border: 1px solid rgba(7,82,54,0.1);
            color: var(--panel-muted);
        }

        /* ── SVG 雷达图（浅色背景适配）── */
        .hexa-radar-wrap { position: relative; display: flex; flex-direction: column; align-items: center; overflow: visible; }
        .radar-svg { width: 100%; height: 100%; overflow: visible; }
        .radar-axis-label { font-size: 6.5px; font-family: 'Noto Sans SC', sans-serif; pointer-events: none; }
        .radar-ring-3d {
            stroke-width: 1; fill: none;
            transform-origin: 80px 80px;
        }

        /* 雷达图入场动画 */
        @keyframes ringReveal {
            0%   { transform: scale(0); opacity: 0; }
            65%  { transform: scale(1.12); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes fillReveal {
            0%   { opacity: 0; transform: scale(0); }
            70%  { opacity: 0.85; transform: scale(1.06); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes dotReveal {
            0%   { transform: scale(0); opacity: 0; }
            70%  { transform: scale(1.4); opacity: 1; }
            100% { transform: scale(1); opacity: 0.9; }
        }
        @keyframes centerReveal {
            0%   { opacity: 0; transform: scale(0.4); }
            70%  { opacity: 1; transform: scale(1.18); }
            100% { opacity: 1; transform: scale(1); }
        }
        @keyframes axisReveal {
            0%   { stroke-dashoffset: 200; opacity: 0; }
            50%  { opacity: 1; }
            100% { stroke-dashoffset: 0; opacity: 1; }
        }
        .radar-reveal .radar-ring-3d {
            transform: scale(0); opacity: 0;
            animation: ringReveal 0.9s cubic-bezier(0.34,1.3,0.64,1) forwards;
        }
        .radar-reveal .radar-ring-3d:nth-child(1) { animation-delay: 0.08s; }
        .radar-reveal .radar-ring-3d:nth-child(2) { animation-delay: 0.18s; }
        .radar-reveal .radar-ring-3d:nth-child(3) { animation-delay: 0.28s; }
        .radar-reveal .radar-ring-3d:nth-child(4) { animation-delay: 0.38s; }
        .radar-reveal .radar-fill {
            transform-origin: 80px 80px;
            transform: scale(0); opacity: 0;
            animation: fillReveal 1.0s cubic-bezier(0.34,1.2,0.64,1) 0.35s forwards;
        }
        .radar-reveal .radar-axis {
            stroke-dasharray: 200; stroke-dashoffset: 200;
            animation: axisReveal 0.8s ease-out 0.15s forwards;
        }
        .radar-reveal .radar-dot {
            transform-origin: 0 0;
            transform: scale(0); opacity: 0;
            animation: dotReveal 0.7s cubic-bezier(0.34,1.3,0.64,1) forwards;
        }
        .radar-reveal .radar-dot:nth-child(1) { animation-delay: 0.45s; }
        .radar-reveal .radar-dot:nth-child(2) { animation-delay: 0.52s; }
        .radar-reveal .radar-dot:nth-child(3) { animation-delay: 0.59s; }
        .radar-reveal .radar-dot:nth-child(4) { animation-delay: 0.66s; }
        .radar-reveal .radar-dot:nth-child(5) { animation-delay: 0.73s; }
        .radar-reveal .radar-dot:nth-child(6) { animation-delay: 0.80s; }
        .radar-reveal .radar-center-val {
            opacity: 0;
            animation: centerReveal 0.8s cubic-bezier(0.34,1.3,0.64,1) 0.5s forwards;
        }

        /* 维度条 + 排名条入场动画 */
        @keyframes scoreCountUp {
            0%   { opacity: 0; transform: translateY(6px) scale(0.85); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes barGrow {
            from { width: 0%; opacity: 0; }
            to   { opacity: 1; }
        }
        .hexa-summary { animation: fadeUp 0.35s ease both; }
        .hexa-summary .hexa-score-num { opacity: 0; animation: scoreCountUp 0.5s cubic-bezier(0.34,1.3,0.64,1) 0.15s forwards; }
        .hexa-summary .hexa-grade     { opacity: 0; animation: scoreCountUp 0.5s cubic-bezier(0.34,1.3,0.64,1) 0.25s forwards; }

        .hexa-dim-row .hexa-dim-score { opacity: 0; animation: scoreCountUp 0.4s ease forwards; }
        .hexa-dim-row:nth-child(1) .hexa-dim-score { animation-delay: 0.08s; }
        .hexa-dim-row:nth-child(2) .hexa-dim-score { animation-delay: 0.16s; }
        .hexa-dim-row:nth-child(3) .hexa-dim-score { animation-delay: 0.24s; }
        .hexa-dim-row:nth-child(4) .hexa-dim-score { animation-delay: 0.32s; }
        .hexa-dim-row:nth-child(5) .hexa-dim-score { animation-delay: 0.40s; }
        .hexa-dim-row:nth-child(6) .hexa-dim-score { animation-delay: 0.48s; }

        .hexa-dim-row .hexa-dim-bar {
            animation: barGrow 0.9s cubic-bezier(0.34,1.2,0.64,1) forwards;
        }
        .hexa-dim-row:nth-child(1) .hexa-dim-bar { animation-delay: 0.05s; }
        .hexa-dim-row:nth-child(2) .hexa-dim-bar { animation-delay: 0.12s; }
        .hexa-dim-row:nth-child(3) .hexa-dim-bar { animation-delay: 0.19s; }
        .hexa-dim-row:nth-child(4) .hexa-dim-bar { animation-delay: 0.26s; }
        .hexa-dim-row:nth-child(5) .hexa-dim-bar { animation-delay: 0.33s; }
        .hexa-dim-row:nth-child(6) .hexa-dim-bar { animation-delay: 0.40s; }

        .hexa-all-row .hexa-all-bar {
            animation: barGrow 1.0s cubic-bezier(0.34,1.2,0.64,1) forwards;
        }
        .hexa-all-row:nth-child(1) .hexa-all-bar { animation-delay: 0.10s; }
        .hexa-all-row:nth-child(2) .hexa-all-bar { animation-delay: 0.15s; }
        .hexa-all-row:nth-child(3) .hexa-all-bar { animation-delay: 0.20s; }
        .hexa-all-row:nth-child(4) .hexa-all-bar { animation-delay: 0.25s; }
        .hexa-all-row:nth-child(5) .hexa-all-bar { animation-delay: 0.30s; }
        .hexa-all-row:nth-child(6) .hexa-all-bar { animation-delay: 0.35s; }
        .hexa-all-row:nth-child(7) .hexa-all-bar { animation-delay: 0.40s; }
        .hexa-all-row:nth-child(8) .hexa-all-bar { animation-delay: 0.45s; }
        .hexa-all-row:nth-child(9) .hexa-all-bar { animation-delay: 0.50s; }
    </style>
</head>
